<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="1360" height="1200" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <title>vLLM 模块覆盖图</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .band { fill: #F6F5F1; stroke: #D3D1C7; stroke-width: 1; }
      .lab { font-size: 14px; font-weight: 600; fill: #2C2C2A; dominant-baseline: central; }
      .leg { font-size: 12px; fill: #444441; dominant-baseline: central; }
      .t { font-size: 14px; font-weight: 600; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .s { font-size: 12px; fill: #fff; fill-opacity: 0.9; text-anchor: middle; dominant-baseline: central; }
      .done { fill: #1D9E75; }
      .part { fill: #D08A1E; }
      .none { fill: #9A9990; }
    </style>
  </defs>
  <rect width="680" height="600" fill="#fff"/>

  <rect class="done" x="30" y="20" width="14" height="14" rx="3"/>
  <text class="leg" x="52" y="27">已成稿 5</text>
  <rect class="part" x="130" y="20" width="14" height="14" rx="3"/>
  <text class="leg" x="152" y="27">部分覆盖 4</text>
  <rect class="none" x="244" y="20" width="14" height="14" rx="3"/>
  <text class="leg" x="266" y="27">未覆盖 5</text>

  <rect class="band" x="30" y="56" width="620" height="110" rx="12"/>
  <text class="lab" x="50" y="76">API server 进程</text>
  <rect class="part" x="50" y="94" width="280" height="56" rx="8"/>
  <text class="t" x="190" y="112">前端收发</text>
  <text class="s" x="190" y="132">tokenize、流式返回，仅提及</text>
  <rect class="none" x="350" y="94" width="280" height="56" rx="8"/>
  <text class="t" x="490" y="112">Chat template、tool parser</text>
  <text class="s" x="490" y="132">未覆盖</text>

  <line x1="340" y1="168" x2="340" y2="190" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="band" x="30" y="194" width="620" height="110" rx="12"/>
  <text class="lab" x="50" y="214">EngineCore 进程</text>
  <rect class="done" x="50" y="232" width="130" height="56" rx="8"/>
  <text class="t" x="115" y="250">Scheduler</text>
  <text class="s" x="115" y="270">vllm-scheduler</text>
  <rect class="done" x="200" y="232" width="130" height="56" rx="8"/>
  <text class="t" x="265" y="250">KV cache 分页</text>
  <text class="s" x="265" y="270">paged-attention</text>
  <rect class="done" x="350" y="232" width="130" height="56" rx="8"/>
  <text class="t" x="415" y="250">Prefix cache</text>
  <text class="s" x="415" y="270">prefix-caching</text>
  <rect class="part" x="500" y="232" width="130" height="56" rx="8"/>
  <text class="t" x="565" y="250">KV offload</text>
  <text class="s" x="565" y="270">只有一条对比</text>

  <line x1="340" y1="306" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect class="band" x="30" y="332" width="620" height="110" rx="12"/>
  <text class="lab" x="50" y="352">GPU worker 进程</text>
  <rect class="done" x="50" y="370" width="130" height="56" rx="8"/>
  <text class="t" x="115" y="388">执行路径</text>
  <text class="s" x="115" y="408">cpu-overhead</text>
  <rect class="part" x="200" y="370" width="130" height="56" rx="8"/>
  <text class="t" x="265" y="388">Attention 库</text>
  <text class="s" x="265" y="408">缺 FlashInfer、MLA</text>
  <rect class="none" x="350" y="370" width="130" height="56" rx="8"/>
  <text class="t" x="415" y="388">Sampling</text>
  <text class="s" x="415" y="408">与约束解码</text>
  <rect class="done" x="500" y="370" width="130" height="56" rx="8"/>
  <text class="t" x="565" y="388">Spec decoding</text>
  <text class="s" x="565" y="408">独立一篇</text>

  <rect class="band" x="30" y="470" width="620" height="110" rx="12"/>
  <text class="lab" x="50" y="490">请求路径之外</text>
  <rect class="none" x="50" y="508" width="130" height="56" rx="8"/>
  <text class="t" x="115" y="526">模型与量化</text>
  <text class="s" x="115" y="546">未覆盖</text>
  <rect class="none" x="200" y="508" width="130" height="56" rx="8"/>
  <text class="t" x="265" y="526">LoRA、多模态</text>
  <text class="s" x="265" y="546">只作为边界提及</text>
  <rect class="none" x="350" y="508" width="130" height="56" rx="8"/>
  <text class="t" x="415" y="526">分布式</text>
  <text class="s" x="415" y="546">TP、PD 分离</text>
  <rect class="part" x="500" y="508" width="130" height="56" rx="8"/>
  <text class="t" x="565" y="526">启动</text>
  <text class="s" x="565" y="546">缺权重加载</text>
</svg>
