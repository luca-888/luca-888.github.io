<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14">
<rect width="900" height="470" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="700" fill="#222">草图 A · 一个请求穿过的进程与线程（单卡）</text>
<text x="20" y="48" fill="#666">问题：一个请求从 HTTP 到流式返回经过哪些进程/线程，哪些 CPU 工作不在 GPU 的关键路径上？</text>
<!-- lanes -->
<rect x="20" y="70" width="250" height="360" rx="8" fill="#f3f5f7" stroke="#c9d1d8"/>
<text x="34" y="94" font-weight="700" fill="#333">进程 1 · API server</text>
<rect x="290" y="70" width="400" height="360" rx="8" fill="#f3f5f7" stroke="#c9d1d8"/>
<text x="304" y="94" font-weight="700" fill="#333">进程 2 · EngineCore（单卡：进程内直接驱动 worker）</text>
<rect x="710" y="70" width="170" height="360" rx="8" fill="#f3f5f7" stroke="#c9d1d8"/>
<text x="724" y="94" font-weight="700" fill="#333">GPU</text>
<!-- API boxes -->
<rect x="40" y="120" width="210" height="52" rx="6" fill="#587767"/><text x="145" y="142" text-anchor="middle" fill="#fff" font-weight="700">HTTP 接收 · tokenize</text><text x="145" y="160" text-anchor="middle" fill="#fff" font-size="12">InputProcessor</text>
<rect x="40" y="330" width="210" height="72" rx="6" fill="#587767"/><text x="145" y="354" text-anchor="middle" fill="#fff" font-weight="700">增量 detokenize · 流式返回</text><text x="145" y="374" text-anchor="middle" fill="#fff" font-size="12">OutputProcessor</text><text x="145" y="391" text-anchor="middle" fill="#fff" font-size="12">stop string · RequestOutput</text>
<!-- engine boxes -->
<rect x="310" y="120" width="160" height="52" rx="6" fill="#8a97a3"/><text x="390" y="142" text-anchor="middle" fill="#fff" font-weight="700">输入线程</text><text x="390" y="160" text-anchor="middle" fill="#fff" font-size="12">反序列化 → 队列</text>
<rect x="310" y="200" width="360" height="100" rx="6" fill="#567891"/><text x="490" y="224" text-anchor="middle" fill="#fff" font-weight="700">主线程 busy loop</text>
<text x="490" y="248" text-anchor="middle" fill="#fff" font-size="13">schedule → prepare 输入 → 提交 execute_model</text><text x="490" y="270" text-anchor="middle" fill="#fff" font-size="13">update_from_output（更新状态、判断结束）</text>
<rect x="510" y="330" width="160" height="72" rx="6" fill="#8a97a3"/><text x="590" y="356" text-anchor="middle" fill="#fff" font-weight="700">输出线程</text><text x="590" y="376" text-anchor="middle" fill="#fff" font-size="12">序列化 → socket</text>
<!-- GPU -->
<rect x="730" y="200" width="130" height="100" rx="6" fill="#c0563b"/><text x="795" y="240" text-anchor="middle" fill="#fff" font-weight="700">forward</text><text x="795" y="262" text-anchor="middle" fill="#fff" font-weight="700">+ sample</text>
<!-- arrows -->
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#c0563b"/></marker></defs>
<g stroke="#c0563b" stroke-width="2.5" fill="none" marker-end="url(#a)">
<path d="M250 146 H310"/>
<path d="M390 172 V200"/>
<path d="M670 250 H730"/>
<path d="M730 280 H690 V300"/>
<path d="M590 300 V330" />
<path d="M510 366 H250"/>
</g>
<g fill="#c0563b" font-weight="700"><circle cx="280" cy="132" r="10"/><circle cx="376" cy="188" r="10"/><circle cx="700" cy="236" r="10"/><circle cx="690" cy="316" r="10" /><circle cx="604" cy="316" r="10"/><circle cx="380" cy="352" r="10"/></g>
<g fill="#fff" font-size="12" font-weight="700" text-anchor="middle"><text x="280" y="136">1</text><text x="376" y="192">2</text><text x="700" y="240">3</text><text x="690" y="320">4</text><text x="604" y="320">5</text><text x="380" y="356">6</text></g>
<text x="280" y="116" text-anchor="middle" fill="#666" font-size="11">ZMQ</text><text x="380" y="346" text-anchor="middle" fill="#666" font-size="11" dy="24">ZMQ</text>
<text x="20" y="456" fill="#666" font-size="12">红线 = 这个请求（含它的第一个 token）的路径；绿色块 = 不在 GPU 关键路径上的 CPU 工作；蓝色块 = 关键路径上的 CPU 工作，后两节要解决的对象。（粗稿：编号、文字、配色均可改）</text>
</svg>
