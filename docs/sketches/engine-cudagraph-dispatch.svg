<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14">
<rect width="900" height="500" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="700" fill="#222">草图 B · CUDA Graph 分派：一个 batch 最终走哪条路</text>
<text x="20" y="48" fill="#666">问题：给定本步的 batch，是走整图、分段图还是 eager？为什么 attention 在分段图里“留空”？</text>
<!-- batch A: mixed -->
<text x="20" y="84" font-weight="700" fill="#333">本步 batch（混合）：3 个 decode + 1 个 prefill chunk = 13 个 token</text>
<g font-size="11" text-anchor="middle" fill="#fff" font-weight="700">
<rect x="20" y="96" width="30" height="28" fill="#567891"/><text x="35" y="115">d1</text>
<rect x="54" y="96" width="30" height="28" fill="#567891"/><text x="69" y="115">d2</text>
<rect x="88" y="96" width="30" height="28" fill="#567891"/><text x="103" y="115">d3</text>
<g fill="#c0563b"><rect x="122" y="96" width="30" height="28"/><rect x="156" y="96" width="30" height="28"/><rect x="190" y="96" width="30" height="28"/><rect x="224" y="96" width="30" height="28"/><rect x="258" y="96" width="30" height="28"/><rect x="292" y="96" width="30" height="28"/><rect x="326" y="96" width="30" height="28"/><rect x="360" y="96" width="30" height="28"/><rect x="394" y="96" width="30" height="28"/><rect x="428" y="96" width="30" height="28"/></g>
<text x="290" y="115" font-size="11">prefill chunk · 10 token</text>
</g>
<g fill="none" stroke="#999" stroke-dasharray="3 3"><rect x="462" y="96" width="30" height="28"/><rect x="496" y="96" width="30" height="28"/><rect x="530" y="96" width="30" height="28"/></g>
<text x="545" y="140" text-anchor="middle" fill="#666" font-size="12">pad → 16</text>
<!-- dispatcher -->
<rect x="20" y="170" width="300" height="56" rx="6" fill="#587767"/>
<text x="170" y="194" text-anchor="middle" fill="#fff" font-weight="700">dispatcher</text><text x="170" y="212" text-anchor="middle" fill="#fff" font-size="12">BatchDescriptor(token 数, 是否 uniform decode)</text>
<path d="M170 128 V170" stroke="#333" stroke-width="2" fill="none"/>
<!-- routes -->
<g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
<rect x="20" y="290" width="270" height="150" rx="6" fill="#f3f5f7" stroke="#c9d1d8"/>
<rect x="310" y="290" width="270" height="150" rx="6" fill="#f3f5f7" stroke="#c9d1d8"/>
<rect x="600" y="290" width="270" height="150" rx="6" fill="#f3f5f7" stroke="#c9d1d8"/>
</g>
<g font-weight="700" fill="#333"><text x="34" y="312">FULL（整图）</text><text x="324" y="312">PIECEWISE（分段图）</text><text x="614" y="312">eager</text></g>
<g font-size="12" fill="#666"><text x="34" y="330">条件：纯 uniform decode，且有对应 size</text><text x="324" y="330">条件：prefill / 混合 batch</text><text x="614" y="330">条件：没有可用的 capture size</text></g>
<!-- full graph: all filled -->
<g fill="#567891"><rect x="34" y="350" width="60" height="24"/><rect x="98" y="350" width="60" height="24"/><rect x="162" y="350" width="60" height="24"/><rect x="226" y="350" width="50" height="24"/></g>
<text x="34" y="396" fill="#666" font-size="12">整条 forward（含 attention）录进一张图</text><text x="34" y="414" fill="#666" font-size="12">replay 一次 = 一次 launch</text>
<!-- piecewise: gaps for attention -->
<g fill="#567891"><rect x="324" y="350" width="50" height="24"/><rect x="418" y="350" width="50" height="24"/><rect x="512" y="350" width="50" height="24"/></g>
<g fill="none" stroke="#c0563b" stroke-width="2" stroke-dasharray="4 3"><rect x="376" y="350" width="40" height="24"/><rect x="470" y="350" width="40" height="24"/></g>
<text x="396" y="388" text-anchor="middle" fill="#c0563b" font-size="11">attn</text><text x="490" y="388" text-anchor="middle" fill="#c0563b" font-size="11">attn</text>
<text x="324" y="410" fill="#666" font-size="12">蓝 = 进图的段；红虚线 = attention，</text><text x="324" y="426" fill="#666" font-size="12">仍逐 kernel launch（形状随请求而变）</text>
<!-- eager -->
<g fill="#8a97a3"><rect x="614" y="350" width="14" height="24"/><rect x="632" y="350" width="14" height="24"/><rect x="650" y="350" width="14" height="24"/><rect x="668" y="350" width="14" height="24"/><rect x="686" y="350" width="14" height="24"/><rect x="704" y="350" width="14" height="24"/><rect x="722" y="350" width="14" height="24"/><rect x="740" y="350" width="14" height="24"/></g>
<text x="614" y="396" fill="#666" font-size="12">每个 kernel 单独 launch</text>
<g stroke="#333" stroke-width="2" fill="none"><path d="M170 226 V258 H155 V290"/><path d="M170 258 H445 V290"/><path d="M170 258 H735 V290"/></g>
<text x="160" y="272" fill="#666" font-size="11" text-anchor="end">3 个 decode（pad→4）</text>
<text x="452" y="272" fill="#c0563b" font-size="12" font-weight="700">← 本例：13 → 16</text>
<text x="20" y="470" fill="#666" font-size="12">默认 capture sizes：[1,2,4] + 8…248（步长 8）+ 之后步长 16，上限 512；数值取自源码注释。（粗稿：图形与文字均可改）</text>
</svg>
