<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSpark · 影片 v7（前两章）</title>
<style>html,body{margin:0;background:#f1ede4;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="v6-lib.js"></script>
<script src="beats.js"></script>
<script src="vo.js"></script>
<script src="v6-scenes-a.js"></script>
<script src="v6-scenes-b.js"></script>
<script src="subs.js"></script>
<script>
// v7（封面至第 5 幕）：封面、第 1 幕、第 2 幕，时间轴按配音节拍（beats.js）预留，配音合成后替换为实测时长。
// DSpark，13 幕（v6：从“每个 token 的时间 = 一轮的时间 ÷ 收下的 token”推起，每一幕回答上一幕留下的问题）。脚本与数据出处见 script.md。
// ?play 在浏览器里播放；node render.mjs 渲染（见该文件头部）。
// 第 3 幕起（第 4 幕除外）：原动画时间按 anchors 对齐到配音节拍（beatWarp）
const WARP = new Map();
function warped(k, fn, anchors, oldEnd, pre) { const r = beatWarp(k, anchors, oldEnd, pre); BEAT_AT[k] = r.B; const g = () => { T = warpT(r.A, T); fn(); }; WARP.set(g, { fn, A: r.A }); return [g, r.dur]; }
// 第 4 幕直接挂在配音节拍上（同第 2 幕）：每个对象在讲到它的那句字幕时出现，不再用 beatWarp
const PB = beatTimes(4, [.5, .4, .4, .4]), pb = (i, f) => at(PB, i, f); BEAT_AT[4] = PB;
Object.assign(PAR_T, { inp: pb(0), mask: pb(0, .26), maskDt: .3, cap: pb(0, .55), up: pb(1), lay: pb(1, .03), tgt: pb(1, .31), ltxt: pb(1, .36), scan: pb(1, .56), out: pb(1, .73), r1: pb(2), ar: pb(2, .03), par: pb(2, .45), acc: pb(2, .72), more: pb(3, .2) });
BEAT_AT[0] = OBB; BEAT_AT[13] = EB;
const FILM = [[sOpenB, OPENB_DUR], [sMap, MAP_DUR], [sRound, ROUND_DUR],
  warped(3, sARB, [[1.4, 0], [9.2, 1]], 12.4),
  [sParB, PB[3].e + 1.8],
  warped(5, sIndep, [[.1, 0], [1.6, 1], [4.2, 2], [8.0, 3], [10.0, 4]], 13.0),
  (BEAT_AT[6] = MKB, [sMarkovB, MK_DUR]),
  warped(7, sTable, [[.6, 0], [3.4, 1]], 10.0),
  warped(8, sCurve, [[1.0, 0], [7.6, 1]], 9.8),
  warped(9, sCost, [[.2, 0], [2.8, 1], [8.0, 2]], 10.4),
  warped(10, sValue, [[.4, 0], [2.2, 1], [7.2, 2]], 9.8),
  warped(11, sConf, [[.4, 0], [6.4, 1], [11.2, 2]], 12.0),
  warped(12, sSched, [[.4, 0], [10.6, 1]], 18.4),
  [sEndB, ENDB_DUR]], XF = .7;
let _t = 0; const SCENES = FILM.map(([fn, dur]) => { const sc = { fn, dur, at: _t }; _t += dur; return sc; });
window.DURATION = _t;
// 音效事件：[幕内时间, 类型]
const seq = (n, t0, dt, k) => Array.from({ length: n }, (_, i) => [t0 + i * dt, k]);
const EV = new Map([
  [sOpen, [[.3, 'pop'], [.9, 'tick'], [CV, 'whoosh'], ...seq(20, STR, RUN / 20, 'tick'), [STR + RUN + .3, 'pop'], [STR + RUN + .6, 'pop'], [STR + RUN + 1.6, 'tick']]],
  [sOpenB, OPENB_EV], [sEndB, ENDB_EV],
  [sMap, MAP_EV],
  [sRound, ROUND_EV],
  [sARB, [[.1, 'click'], ...[0, 1, 2, 3, 4].flatMap((i) => [[R0 + i * RDT, 'tick'], [R0 + i * RDT + .9, 'land']]), [R0 + 5 * RDT + .2, 'whoosh'], [9.6, 'err']]],
  [sParB, [[.1, 'click'], [PAR_T.inp, 'pop'], ...seq(5, PAR_T.mask, PAR_T.maskDt, 'tick'), [PAR_T.tgt, 'pop'], [PAR_T.scan, 'whoosh'], [PAR_T.out + .1, 'land'], [PAR_T.ar, 'pop'], [PAR_T.par, 'pop'], [PAR_T.acc + .2, 'tick'], [PAR_T.acc + .7, 'pop'], [PAR_T.more, 'tick'], [PAR_T.more + .3, 'tick']]],
  [sIndep, [[.1, 'click'], [1.0, 'pop'], [2.2, 'pop'], [4.4, 'err'], [6.0, 'land'], [7.0, 'land'], [8.2, 'err'], [8.8, 'whoosh'], ...seq(4, 10.4, .2, 'pop'), [11.4, 'err']]],
  [sMarkovB, MK_EV],
  [sTable, [[.1, 'click'], [.6, 'whoosh'], [1.4, 'pop'], [3.4, 'whoosh'], [4.0, 'whoosh'], [5.6, 'pop'], [6.8, 'pop'], [7.4, 'tick'], [8.2, 'tick'], [8.8, 'land']]],
  [sCurve, [[.1, 'click'], [1.0, 'whoosh'], [3.0, 'whoosh'], [5.4, 'whoosh'], [8.0, 'land'], [8.4, 'land'], [8.8, 'land']]],
  [sCost, [[.1, 'click'], [1.0, 'whoosh'], [2.8, 'pop'], [3.3, 'tick'], [5.0, 'pop'], [5.5, 'err'], [8.0, 'pop'], [9.0, 'err']]],
  [sValue, [[.1, 'click'], [.6, 'pop'], ...[0, 1, 2, 3].flatMap((i) => [[2.4 + i * 1.6, 'land'], ...(i ? [[2.9 + i * 1.6, 'whoosh']] : [])]), [9.0, 'pop']]],
  [sConf, [[.1, 'click'], [.8, 'pop'], [1.6, 'pop'], [3.4, 'tick'], [4.6, 'pop'], [6.4, 'err'], [7.6, 'pop'], [8.6, 'land'], [9.2, 'pop'], [11.2, 'pop']]],
  [sSched, [[.1, 'click'], [Q0, 'whoosh'], ...seq(IDLE.peak, I0, DT, 'tick'), [I0 + IDLE.peak * DT + .3, 'land'], [B0, 'whoosh'], ...seq(BUSY.peak, B0 + .6, DT, 'tick'), [B0 + .6 + BUSY.peak * DT + .3, 'land']]],
  [sEnd, [[.1, 'click'], ...seq(16, 1.0, RUN / 16, 'tick'), [3.8, 'whoosh'], [5.0, 'pop'], [5.8, 'pop'], [6.6, 'pop']]],
]);
window.EVENTS = SCENES.flatMap((sc) => { const w = WARP.get(sc.fn); return (EV.get(w ? w.fn : sc.fn) || []).map(([x, k]) => [sc.at + (w ? unwarpT(w.A, x) : x), k]); });
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = 1920; c.height = 1080; return c; };
const o1 = mk(), o2 = mk(), c1 = o1.getContext('2d'), c2 = o2.getContext('2d');
function paint(c, sc, tt) { X = c; T = Math.max(0, tt); X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.setLineDash([]); X.lineCap = 'butt'; R(0, 0, 1920, 1080, K.paper); sc.fn(); }
function drawFrame(t) { let i = SCENES.findIndex((s) => t < s.at + s.dur); if (i < 0) i = SCENES.length - 1; const sc = SCENES[i], local = t - sc.at;
  paint(c1, sc, local);
  if (i > 0 && local < XF) { const pv = SCENES[i - 1]; paint(c2, pv, pv.dur + local); c1.setTransform(1, 0, 0, 1, 0, 0); c1.globalAlpha = 1 - io(local / XF); c1.drawImage(o2, 0, 0); c1.globalAlpha = 1; } }
window.renderAt = (t, fps = 60, samples = 5, shutter = .25) => {
  for (let s = 0; s < samples; s++) { const ts = samples > 1 ? t - (shutter / Math.max(fps, 30)) * (1 - s / (samples - 1)) : t;
    drawFrame(Math.max(0, ts)); ctx.globalAlpha = 1 / (s + 1); ctx.drawImage(o1, 0, 0); }
  ctx.globalAlpha = 1;
  drawSub(t);
  const ch = SCENES.findIndex((s) => t < s.at + s.dur), ci = ch < 0 ? SCENES.length - 1 : ch;
  if (t > FILM[0][1] * .3 || ci > 0) { ctx.fillStyle = K.paper2; ctx.fillRect(96, 1066, 1728, 4); ctx.fillStyle = K.teal; ctx.fillRect(96, 1066, 1728 * clamp(t / window.DURATION), 4); }
  if (t > window.DURATION - .8) { ctx.globalAlpha = io((t - window.DURATION + .8) / .8); ctx.fillStyle = K.paper; ctx.fillRect(0, 0, 1920, 1080); ctx.globalAlpha = 1; }
};
// 字幕：底部居中一行。配音合成前，每幕的字幕按字数把这一幕的时长均分（首尾各留一点空）
function drawSub(t) {
  { const i = SCENES.findIndex((s) => t < s.at + s.dur), k = i < 0 ? SCENES.length - 1 : i, B = window.BEAT_AT[k];
    if (B) { const lt = t - SCENES[k].at, G = window.BEATS[k]; let cur = null;
      B.forEach(({ s, e }, j) => { if (lt < s) return; const cs = G[j].cues, w = cs.map((x) => x.length), W = w.reduce((a, c) => a + c, 0); let acc = s;
        cs.forEach((c, q) => { const d = (e - s) * w[q] / W; if (G[j].cs) acc = s + (e - s) * G[j].cs[q] - .1; if (lt >= acc) cur = lt < e + .6 || j === B.length - 1 ? c : null; acc += d; }); });
      if (cur) { ctx.font = font(600, 40); ctx.fillStyle = K.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(cur, 960, 1012, 1728); } return; } }
  const i = SCENES.findIndex((s) => t < s.at + s.dur), k = i < 0 ? SCENES.length - 1 : i, g = (window.SUBS || [])[k]; if (!g || !g.length) return;
  const sc = SCENES[k], t0 = sc.at + .4, t1 = sc.at + sc.dur - .2, w = g.map((x) => x.length), W = w.reduce((a, b) => a + b, 0);
  let acc = t0, cur = null; for (let j = 0; j < g.length; j++) { const d = (t1 - t0) * w[j] / W; if (t >= acc && t < acc + d) { cur = g[j]; break; } acc += d; }
  if (!cur && t >= t1) cur = g[g.length - 1]; if (!cur) return;
  ctx.font = font(600, 40); ctx.fillStyle = K.ink; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText(cur, 960, 1012, 1728);
}
window.renderCover = () => { X = ctx; T = 99; X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; coverFeed(); };
window.sceneStarts = SCENES.map((s) => s.at);
window.sceneEnds = SCENES.map((s, i) => s.at + s.dur - (i === SCENES.length - 1 ? .9 : .05));
window.renderAt(0);
if (new URLSearchParams(location.search).has('play')) { const start = performance.now(); const play = (now) => { window.renderAt(((now - start) / 1000) % window.DURATION, 60, 1); requestAnimationFrame(play); }; requestAnimationFrame(play); }
</script>
</body>
</html>
