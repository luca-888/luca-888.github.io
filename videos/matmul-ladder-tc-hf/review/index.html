<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关键帧审核</title>
<style>
  :root { --paper:#f1ede4; --ink:#141414; --ink2:#3a3a3a; --line:#cfc8b8; --teal:#0a6f63; --hot:#c4561d; --card:#fbf9f4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "PingFang SC", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header b { font-size: 16px; }
  .prog { color: var(--ink2); }
  .filters button, .nav button { border: 1px solid var(--line); background: var(--card); padding: 4px 10px; border-radius: 4px; cursor: pointer; font: inherit; }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .strip button { flex: 0 0 auto; width: 64px; padding: 0; border: 2px solid transparent; border-radius: 3px; background: none; cursor: pointer; position: relative; }
  .strip button img { width: 100%; display: block; border-radius: 2px; }
  .strip button.cur { border-color: var(--ink); }
  .strip button[data-v="ok"]::after, .strip button[data-v="fix"]::after { content: ""; position: absolute; right: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; }
  .strip button[data-v="ok"]::after { background: var(--teal); }
  .strip button[data-v="fix"]::after { background: var(--hot); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; color: var(--ink2); margin-bottom: 8px; flex-wrap: wrap; }
  .say { font-size: 18px; font-weight: 600; margin: 4px 0 12px; }
  .frame { width: 100%; display: block; border: 1px solid var(--line); border-radius: 4px; }
  .act { display: flex; gap: 10px; margin: 12px 0 8px; flex-wrap: wrap; }
  .act button { padding: 8px 18px; border-radius: 4px; border: 1px solid var(--line); background: #fff; cursor: pointer; font: inherit; font-weight: 600; }
  .act .ok.on { background: var(--teal); color: #fff; border-color: var(--teal); }
  .act .fix.on { background: var(--hot); color: #fff; border-color: var(--hot); }
  textarea { width: 100%; min-height: 84px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; font: inherit; background: #fff; }
  .nav { display: flex; justify-content: space-between; margin-top: 10px; }
  .hint { color: var(--ink2); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <b>关键帧审核 · 三章版</b>
  <span class="prog" id="prog"></span>
  <span class="filters" id="filters">
    <button data-f="all" class="on">全部</button>
    <button data-f="todo">未审</button>
    <button data-f="fix">要改</button>
  </span>
</header>
<main>
  <div class="strip" id="strip"></div>
  <div class="card">
    <div class="meta"><span id="where"></span><span id="time"></span></div>
    <div class="say" id="say"></div>
    <div class="hint" id="src" style="margin:-6px 0 10px"></div>
    <img class="frame" id="img" alt="">
    <div class="act">
      <button class="ok" id="ok">通过</button>
      <button class="fix" id="fix">要改</button>
    </div>
    <textarea id="note" placeholder="哪里要改？写下来，保存在本页，我会读取。"></textarea>
    <div class="nav"><button id="prev">← 上一张</button><button id="next">下一张 →</button></div>
    <div class="hint">键盘：← → 翻页，1 通过，2 要改。意见自动保存。</div>
  </div>
</main>
<script>
const KEY = "kf-review-matmul-tc-v4";
let F = [], R = {}, i = 0, filter = "all";
try { R = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { R = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(R)); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const SN = { s01: "开场", s02: "起点 wmma", s03: "第一章 读顺、送早", s04: "第二章 Hopper 异步机制", s05: "第三章 少读、晚写", s06: "收尾" };
function visible() { return F.map((f, k) => k).filter((k) => filter === "all" || (filter === "todo" ? !R[F[k].id]?.v : R[F[k].id]?.v === "fix")); }
function render() {
  const f = F[i], r = R[f.id] || {};
  $("where").textContent = `${f.scene} ${SN[f.scene] || ""} · 第 ${f.n} 句`;
  $("time").textContent = "";
  $("src").textContent = "画面：" + f.note;
  $("say").textContent = f.text;
  $("img").src = f.img;
  $("ok").classList.toggle("on", r.v === "ok");
  $("fix").classList.toggle("on", r.v === "fix");
  $("note").value = r.note || "";
  const done = F.filter((x) => R[x.id]?.v).length, fix = F.filter((x) => R[x.id]?.v === "fix").length;
  $("prog").textContent = `${i + 1} / ${F.length} · 已审 ${done} · 要改 ${fix}`;
  document.querySelectorAll("#strip button").forEach((b) => {
    const k = +b.dataset.k; b.classList.toggle("cur", k === i);
    b.dataset.v = R[F[k].id]?.v || ""; b.hidden = !visible().includes(k);
  });
  const cb = document.querySelector("#strip button.cur"), st = $("strip");
  if (cb) st.scrollLeft = cb.offsetLeft - st.clientWidth / 2 + cb.clientWidth / 2;
}
function set(v) { const id = F[i].id; R[id] = { ...(R[id] || {}), v: R[id]?.v === v ? "" : v, at: Date.now() }; save(); render(); }
function go(d) { const vis = visible(); if (!vis.length) return; let p = vis.indexOf(i); p = p < 0 ? 0 : Math.min(vis.length - 1, Math.max(0, p + d)); i = vis[p]; render(); }
fetch("frames.json").then((r) => r.json()).then((d) => {
  F = d;
  $("strip").innerHTML = F.map((f, k) => `<button data-k="${k}" title="${f.id}"><img src="${f.img}" alt="${f.id}" loading="lazy"></button>`).join("");
  $("strip").onclick = (e) => { const b = e.target.closest("button"); if (b) { i = +b.dataset.k; render(); } };
  const first = F.findIndex((f) => !R[f.id]?.v); i = first < 0 ? 0 : first; render();
});
$("ok").onclick = () => set("ok");
$("fix").onclick = () => set("fix");
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("note").oninput = (e) => { const id = F[i].id; R[id] = { ...(R[id] || {}), note: e.target.value, v: R[id]?.v || (e.target.value ? "fix" : ""), at: Date.now() }; save(); $("fix").classList.toggle("on", R[id].v === "fix"); };
$("filters").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.f; document.querySelectorAll("#filters button").forEach((x) => x.classList.toggle("on", x === b)); const vis = visible(); if (vis.length && !vis.includes(i)) i = vis[0]; render(); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") go(-1); else if (e.key === "ArrowRight") go(1);
  else if (e.key === "1") set("ok"); else if (e.key === "2") set("fix");
});
</script>
</body>
</html>
