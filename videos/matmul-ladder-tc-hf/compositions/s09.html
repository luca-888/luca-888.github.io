  <script>
    (function () {
      const $ = (k) => document.getElementById("s09-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const mk = (parent, cls, x, y) => {
        const d = document.createElement("div");
        d.className = cls; d.style.left = x + "px"; d.style.top = y + "px";
        parent.appendChild(d); return d;
      };

      // ---------- tile 图：x = tile 行 m（64），y = tile 列 n（32）；分组发放的序号 → 位置 ----------
      const X = (m) => m * 15, Y = (n) => n * 15;
      const pos = (id) => { const g = Math.floor(id / 512), r = id % 512; return [X(16 * g + (r % 16)), Y(Math.floor(r / 16))]; };
      const cols1 = [], cols2 = [];
      [["cells1", cols1], ["cells2", cols2]].forEach(([id, arr]) => {
        for (let m = 0; m < 64; m++) {
          const col = document.createElement("div");
          col.className = "s09-in";
          for (let n = 0; n < 32; n++) mk(col, "s09-c", X(m), Y(n));
          $(id).appendChild(col); arr.push(col);
        }
      });
      for (let k = 0; k < 132; k++) { const p = pos(k); mk($("run1"), "s09-r", p[0], p[1]); }
      const prs = [];
      for (let k = 0; k < 132; k += 2) { const p = pos(k); prs.push(mk($("prs"), "s09-pr", p[0] - 1, p[1] - 2)); }
      // 常驻：4 次领取，每次 132 个 tile（序号 132·i … 132·i + 131）
      const rnd = [], done = [];
      for (let i = 0; i < 4; i++) {
        const dl = document.createElement("div"), rl = document.createElement("div");
        dl.className = "s09-in"; rl.className = "s09-in";
        for (let k = 0; k < 132; k++) {
          const p = pos(132 * i + k);
          mk(dl, "s09-r", p[0], p[1]); mk(rl, "s09-r", p[0], p[1]);
        }
        $("rounds").appendChild(dl); $("rounds").appendChild(rl);
        done.push(dl); rnd.push(rl);
      }

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set($("ttl"), { x: 0, y: 0, scale: 1 });
      const fx = (v) => (v / 781.86) * 544;
      gsap.set($("fill"), { scaleX: 740 / 781.86 });
      gsap.set($("num"), { x: fx(740) - 150 });
      gsap.set($("num2"), { x: fx(757) - 150, opacity: 0 });
      gsap.set([$("mt"), $("gain")], { opacity: 0 });
      gsap.set([].concat(cols1, cols2), { opacity: 0 });
      gsap.set([$("run1"), $("pair0"), $("axis1"), $("cl1"), $("axis2"), $("rs")], { opacity: 0 });
      gsap.set(prs, { opacity: 0 });
      gsap.set([$("cbox"), $("sm0"), $("sm1"), $("mut"), $("l2"), $("who"), $("mcl")], { opacity: 0 });
      gsap.set(document.querySelectorAll("#s09-mc .s09-slot i"), { scaleX: 0 });
      gsap.set(document.querySelectorAll("#s09-mc .s09-slot b"), { opacity: 0 });
      gsap.set(done, { opacity: 0 });
      gsap.set(rnd, { opacity: 0 });
      done.forEach((d) => gsap.set(d.children, { opacity: 0.3 }));
      gsap.set([$("mkw"), $("rcl"), $("rc1"), $("rc2"), $("rc3"), $("rc4")], { opacity: 0 });
      gsap.set([$("r1a"), $("r1w"), $("r2a"), $("r2w")], { clipPath: "inset(0 100% 0 0)" });
      gsap.set([$("bh"), $("v1"), $("v2"), $("rl2"), $("r2x")], { opacity: 0 });

      // ---------- 0.0 标题卡 ----------
      ft($("chip"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 0.1);

      // ---------- 1.0 标题缩到左上；tile 图（分组发放的一轮），框出一个集群 ----------
      ft($("ttl"), { x: 0, y: 0, scale: 1 }, { x: 0, y: -16, scale: 0.6, duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("mt"), 1.0);
      cols1.forEach((c, m) => ft(c, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 1.05 + m * 0.008));
      fadeIn($("axis1"), 1.3);
      fadeIn($("run1"), 1.5);
      ft($("pair0"), { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 2.3);
      fadeIn($("cl1"), 2.4);
      prs.forEach((p, i) => ft(p, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 4.0 + i * 0.02));
      fadeOut($("ch1in"), 6.6, 0.35);

      // ---------- 7.0 互访共享内存 ----------
      fadeIn($("cbox"), 7.05);
      ft($("sm0"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 7.2);
      ft($("sm1"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 7.35);
      fadeIn($("mut"), 8.3);
      // ---------- 10.3 各搬 W 的一半；12.0 TMA 多播写入双方 ----------
      ft($("l2"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 10.3);
      fadeIn($("who"), 10.8);
      ft($("mut"), { opacity: 1 }, { opacity: 0.35, duration: 0.4, ease: MOVE }, 11.6);
      const draw = (p, t) => { const len = p.getTotalLength(); gsap.set(p, { strokeDasharray: len, strokeDashoffset: len }); ft(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.9, ease: MOVE }, t); };
      draw($("pa"), 11.8);
      fadeIn($("mcl"), 11.9);
      const slotFill = (id, t) => {
        ft(document.querySelector("#s09-" + id + " i"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: IN }, t);
        fadeIn(document.querySelector("#s09-" + id + " b"), t + 0.2, 0.3);
      };
      slotFill("s0a", 12.6); slotFill("s1a", 12.6);
      draw($("pb"), 13.0);
      slotFill("s0b", 13.8); slotFill("s1b", 13.8);
      fadeOut($("mcin"), 14.9, 0.35);

      // ---------- 15.3 48 KB → 32 KB ----------
      fadeIn($("bh"), 15.35);
      ft($("r1a"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: IN }, 15.5);
      ft($("r1w"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: IN }, 15.8);
