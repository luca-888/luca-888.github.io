  <script>
    (function () {
      const $ = (k) => document.getElementById("s04-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);

      // ---------- 生成网格 ----------
      const GL = 200, GT = 400, PX = 100, PY = 60;
      const bands = $("bands");
      for (let j = 0; j < 8; j += 2) {
        const b = document.createElement("div");
        b.className = "s04-band";
        b.style.left = (GL - 4 + j * PX) + "px"; b.style.top = (GT - 6) + "px";
        bands.appendChild(b);
      }
      const gin = $("gin"), heads = [], rls = [];
      for (let j = 0; j < 8; j++) {
        const h = document.createElement("div");
        h.className = "s04-hd"; h.textContent = j;
        h.style.left = (GL + j * PX) + "px"; h.style.top = (GT - 50) + "px";
        gin.appendChild(h); heads.push(h);
      }
      const hl = document.createElement("div");
      hl.className = "s04-rl"; hl.textContent = "bank 组";
      hl.style.left = (GL - 140) + "px"; hl.style.top = (GT - 50) + "px";
      gin.appendChild(hl); heads.push(hl);
      for (let r = 0; r < 8; r++) {
        const l = document.createElement("div");
        l.className = "s04-rl"; l.textContent = "行 " + r;
        l.style.left = (GL - 140) + "px"; l.style.top = (GT + r * PY + 8) + "px";
        gin.appendChild(l); rls.push(l);
      }
      const cellsBox = $("cells"), cells = [], blues = [], oks = [], grs = [];
      for (let r = 0; r < 8; r++) {
        cells.push([]);
        for (let j = 0; j < 8; j++) {
          const c = document.createElement("div");
          c.className = "s04-cell";
          c.style.left = (j * PX) + "px"; c.style.top = (r * PY) + "px";
          c.innerHTML = `<span class="n">${j}</span>` + (j === 0 ? `<i class="b"><span>0</span></i>` : "");
          cellsBox.appendChild(c); cells[r].push(c);
          if (j === 0) blues.push(c.querySelector(".b"));
        }
        const o = document.createElement("div");
        o.className = "s04-ol";
        o.style.left = "-4px"; o.style.top = (r * PY - 4) + "px";
        cellsBox.appendChild(o); oks.push(o);
        const g = document.createElement("div");
        g.className = "s04-ol g";
        g.style.left = (r * PX) + "px"; g.style.top = (r * PY) + "px";
        $("gg").appendChild(g); grs.push(g);
      }

      // ---------- 硬件塔 ----------
      const T = kitTower($("tower"));
      const L = T.layer, smBox = $("tower-sm");

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      const fx = (v) => (v / 781.86) * 544;
      gsap.set($("fill"), { scaleX: 93.3 / 781.86 });
      gsap.set([$("num1"), $("num2")], { x: fx(93.3) + 10 });
      gsap.set([$("num2"), $("gain"), $("mt")], { opacity: 0 });
      gsap.set([$("gtop"), $("bands"), $("hot"), ...heads, ...rls, ...blues, ...oks, ...grs], { opacity: 0 });
      cells.forEach((row) => gsap.set(row, { opacity: 0 }));
      gsap.set([$("a1in"), $("a2in"), $("a3in"), $("b1in"), $("b2in"), $("b3in")], { opacity: 0 });
      gsap.set(document.querySelectorAll("#s04-a3 .s04-stk b"), { opacity: 0 });
      gsap.set([L.tc, L.reg, L.smem, L.l2, L.hbm, smBox], { opacity: 0 });
      gsap.set([$("old"), $("x1"), $("x2"), $("l1"), $("l2"), $("l3")], { opacity: 0 });
      ["r1", "r2", "r3", "x1", "x2"].forEach((k) => { const p = $(k), len = p.getTotalLength(); p.dataset.len = len; gsap.set(p, { strokeDasharray: len, strokeDashoffset: len }); });
      gsap.set($("car"), { xPercent: -50, yPercent: -50, x: 1656, y: 752, opacity: 0 });
      gsap.set($("codein"), { opacity: 0 });
      gsap.set([$("tlin")], { opacity: 0 });
      gsap.set([$("lane1"), $("lane2")], { clipPath: "inset(0px 100% 0px 0px)" });
      gsap.set([$("idle"), $("bn"), $("tarr")], { opacity: 0 });

      // ---------- 0.0 标题卡；1.0 缩到左上 ----------
      ft($("chip"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: IN }, 0.08);
      ft($("ttl"), { scale: 1, y: 0, transformOrigin: "0 0" }, { scale: 0.72, y: -12, transformOrigin: "0 0", duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("mt"), 1.1);

      // ---------- 1.0 共享内存一块：8 × 8 个 16 字节块 ----------
      fadeIn($("bands"), 1.1, 0.5);
      cells.forEach((row, r) => row.forEach((c, j) => ft(c, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 1.2 + r * 0.08 + j * 0.03)));
      rls.forEach((l, r) => fadeIn(l, 1.3 + r * 0.08, 0.4));
      ft($("gtop"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 2.6);
      heads.forEach((h, j) => fadeIn(h, 4.2 + j * 0.06, 0.4));

      // ---------- 7.6 ldmatrix 读 8 行的同一块：同一组 bank，8 轮 ----------
      fadeIn($("a1in"), 7.6);
      blues.forEach((b, r) => ft(b, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: IN }, 8.4 + r * 0.08));
      ft($("hot"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 10.4);
      fadeIn($("a2in"), 10.4);
      fadeIn($("a3in"), 11.8, 0.4);
      for (let k = 0; k < 8; k++) {
        const t = 12.0 + k * 0.45;
        ft(oks[k], { opacity: 0 }, { opacity: 1, duration: 0.15, ease: IN }, t);
        if (k > 0) {
          ft(oks[k - 1], { opacity: 1 }, { opacity: 0.25, duration: 0.15 }, t);
          ft($("q" + k), { opacity: 1 }, { opacity: 0, duration: 0.05 }, t);
        }
        ft($("q" + (k + 1)), { opacity: 0 }, { opacity: 1, duration: 0.05 }, t);
      }

      // ---------- 16.6 换位：第 r 行第 c 块 → c ⊕ r ----------
      fadeOut($("a1in"), 16.6); fadeOut($("a2in"), 16.6); fadeOut($("a3in"), 16.6);
      oks.forEach((o, k) => ft(o, { opacity: k === 7 ? 1 : 0.25 }, { opacity: 0, duration: 0.3, ease: OUT }, 16.6));
      fadeIn($("b1in"), 17.0);
      const swz = (r, t0, d) => cells[r].forEach((c, j) => { const dx = ((j ^ r) - j) * PX; if (dx) ft(c, { x: 0 }, { x: dx, duration: d, ease: MOVE }, t0); });
      swz(1, 17.5, 0.9);                                        // 先单独演示第 1 行
      for (let r = 2; r < 8; r++) swz(r, 18.9, 1.1);            // 其余一起
      fadeOut($("hot"), 20.2, 0.3);
      fadeIn($("b2in"), 20.3);
      grs.forEach((g) => ft(g, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.35, ease: IN }, 21.2));
      fadeIn($("b3in"), 21.1);

      // ---------- 25.4 硬件塔：L2 → 共享内存直达，ldmatrix → mma.sync ----------
      fadeOut($("gin"), 25.4); fadeOut($("b1in"), 25.4); fadeOut($("b2in"), 25.4); fadeOut($("b3in"), 25.4);
      ["hbm", "l2", "smem", "reg", "tc"].forEach((id, i) =>
        ft(L[id], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 25.5 + i * 0.08));
      fadeIn(smBox, 25.9);
      // 旧路径（经寄存器折返）出现，随即划掉
      ft($("old"), { opacity: 0 }, { opacity: 0.8, duration: 0.4, ease: IN }, 26.1);
      ft($("x1"), { opacity: 1, strokeDashoffset: $("x1").dataset.len }, { opacity: 1, strokeDashoffset: 0, duration: 0.2, ease: IN }, 26.7);
      ft($("x2"), { opacity: 1, strokeDashoffset: $("x2").dataset.len }, { opacity: 1, strokeDashoffset: 0, duration: 0.2, ease: IN }, 26.9);
      ft([$("old"), $("x1"), $("x2")], { opacity: 0.8 }, { opacity: 0, duration: 0.4, ease: OUT }, 27.4);
      // 代码框
