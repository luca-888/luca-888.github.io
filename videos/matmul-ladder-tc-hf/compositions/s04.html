<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .s04-full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root .s04-abs { position: absolute; }
    #root .s04-lbl { position: absolute; font-size: 32px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
    #root .kit-tbar .num span { position: absolute; left: 0; top: 0; }
    /* 第 1 句：显存 → 3 个槽位 → Tensor Core */
    #root #s04-hbm { position: absolute; left: 96px; top: 400px; width: 260px; height: 320px; background: var(--paper2); border: 3px solid var(--hot); border-radius: 4px; }
    #root .s04-pile { position: absolute; width: 150px; height: 150px; background: var(--hotL); border: 2px solid var(--hot); border-radius: 2px; }
    #root .s04-slot { position: absolute; top: 450px; width: 220px; height: 220px; background: var(--paper2); border: 3px dashed var(--gray); border-radius: 4px; }
    #root .s04-sname { position: absolute; top: 404px; width: 220px; text-align: center; font-size: 30px; font-weight: 600; color: var(--note); }
    #root #s04-tc { position: absolute; left: 1430px; top: 430px; width: 330px; height: 260px; background: var(--teal); border-radius: 4px; }
    #root .s04-blk { position: absolute; left: 0; top: 0; width: 200px; height: 200px; border-radius: 3px; background: var(--hot); }
    #root .s04-blk span { position: absolute; inset: 0; line-height: 200px; text-align: center; font-family: var(--mono); font-size: 44px; font-weight: 800; color: #fff; white-space: nowrap; }
    #root .s04-pkt { position: absolute; left: 0; top: 0; width: 44px; height: 44px; background: var(--teal); border: 3px solid var(--paper); border-radius: 2px; }
    #root .s04-leg { position: absolute; top: 740px; white-space: nowrap; font-size: 32px; font-weight: 600; color: var(--ink2); }
    #root .s04-leg i { display: inline-block; width: 32px; height: 32px; vertical-align: -5px; margin-right: 10px; border-radius: 2px; }
    /* 第 3 句：指令与时钟格 */
    #root .s04-clk { position: absolute; top: 620px; width: 100px; height: 100px; background: var(--paper2); border: 2px solid var(--line); border-radius: 2px; }
    #root .s04-mini { position: absolute; left: 0; top: 0; width: 80px; height: 80px; background: var(--teal); border-radius: 2px; }
    #root .s04-miss { position: absolute; top: 616px; width: 108px; height: 108px; border: 4px dashed var(--hot); border-radius: 2px; }
  </style>
  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080">

    <!-- 标题卡 -->
    <div id="s04-title" class="clip s04-full" data-start="0.00" data-duration="19.74" data-track-index="1">
      <div id="s04-chip" class="kit-chip">mm_mma&lt;3级&gt;</div>
      <div id="s04-ttl" class="kit-title">第 3 步：<span class="acc">三级缓冲</span></div>
    </div>

    <!-- 耗时条：4.09 → 3.56（第 2 句） -->
    <div id="s04-tb" class="clip kit-tbar" data-start="1.00" data-duration="18.74" data-track-index="2">
      <div class="lbl">8192 阶矩阵乘法 · 一次耗时</div>
      <div class="track"><div id="s04-tbghost" class="ghost"></div><div id="s04-tbfill" class="fill"></div><div class="peak"></div></div>
      <div id="s04-tbnum" class="num"><span id="s04-tbv1">4.09 ms</span><span id="s04-tbv2">3.56 ms</span></div>
      <div class="ref">虚线：规格峰值 1.11 ms</div>
    </div>

    <!-- 第 1 句（1.0）：三个槽位，拷贝提前两块；算块 t 时，t+1、t+2 在路上 -->
    <div id="s04-stage" class="clip s04-full" data-start="1.00" data-duration="18.74" data-track-index="3">
      <div id="s04-stg" class="s04-full">
        <div id="s04-hbm">
          <div class="s04-pile" style="left:66px;top:126px"></div>
          <div class="s04-pile" style="left:52px;top:140px"></div>
          <div class="s04-pile" style="left:38px;top:154px"></div>
        </div>
        <div id="s04-hbml" class="s04-lbl" style="left:96px;top:350px;width:260px;text-align:center;font-size:36px;font-weight:700;color:var(--hot-t)">显存</div>
        <div id="s04-sml" class="s04-lbl" style="left:470px;top:340px;width:740px;text-align:center;font-size:36px;font-weight:700;color:var(--use-t)">共享内存 · 3 个槽位</div>
        <div id="s04-sn0" class="s04-sname" style="left:470px">槽 0</div>
        <div id="s04-sn1" class="s04-sname" style="left:730px">槽 1</div>
        <div id="s04-sn2" class="s04-sname" style="left:990px">槽 2</div>
        <div id="s04-sl0" class="s04-slot" style="left:470px"></div>
        <div id="s04-sl1" class="s04-slot" style="left:730px"></div>
        <div id="s04-sl2" class="s04-slot" style="left:990px"></div>
        <div id="s04-tc"></div>
        <div id="s04-tcl" class="s04-abs" style="left:1430px;top:430px;width:330px;height:260px;line-height:260px;text-align:center;font-size:40px;font-weight:800;color:#fff;white-space:nowrap">Tensor Core</div>
        <div id="s04-blks" class="s04-full"></div>
        <div id="s04-pkts" class="s04-full"></div>
        <div id="s04-legend" class="s04-full">
          <div class="s04-leg" style="left:470px"><i style="background:var(--hot)"></i>在路上</div>
          <div class="s04-leg" style="left:730px"><i style="background:var(--use)"></i>已到</div>
          <div class="s04-leg" style="left:990px"><i style="background:var(--teal)"></i>正在算</div>
        </div>
      </div>
    </div>

    <!-- 第 3 句（8.25）：一条 mma.sync = 2048 次乘加，每个时钟要一条 -->
    <div id="s04-ins" class="clip s04-full" data-start="8.25" data-duration="11.49" data-track-index="4">
      <div id="s04-insh" class="s04-abs" style="left:96px;top:520px;font-size:48px;font-weight:800;color:var(--ink);white-space:nowrap">卡在指令本身</div>
      <div id="s04-sq" class="s04-abs" style="left:96px;top:620px;width:160px;height:160px;background:var(--teal);border-radius:3px;line-height:160px;text-align:center;font-family:var(--mono);font-size:30px;font-weight:800;color:#fff">mma.sync</div>
      <div id="s04-sqk" class="s04-abs" style="left:286px;top:630px;white-space:nowrap">
        <div style="font-size:32px;font-weight:600;color:var(--ink2)">一条指令</div>
        <div style="font-size:44px;font-weight:800;color:var(--ink)"><span style="font-family:var(--mono);color:var(--teal-t)">2048</span> 次乘加</div>
      </div>
      <div id="s04-clkh" class="s04-abs" style="left:700px;top:548px;font-size:36px;font-weight:700;color:var(--ink);white-space:nowrap">喂满 Tensor Core：每个时钟一条</div>
      <div id="s04-clks" class="s04-full"></div>
      <div id="s04-clkn" class="s04-lbl" style="left:700px;top:734px;font-size:28px;color:var(--note)">每格 = 1 个时钟</div>
      <div id="s04-minis" class="s04-full"></div>
      <div id="s04-miss" class="s04-full"></div>
    </div>

    <!-- 第 4 句（16.44）：止于峰值的三分之一 -->
    <div id="s04-end" class="clip s04-full" data-start="16.44" data-duration="3.30" data-track-index="5">
      <div id="s04-third" class="s04-abs" style="left:700px;top:790px;white-space:nowrap"><span style="font-size:72px;font-weight:800;color:var(--ink)">峰值的 </span><span style="font-family:var(--mono);font-size:96px;font-weight:800;color:var(--hot-t);line-height:1">1/3</span></div>
      <div id="s04-bn" class="s04-abs" style="left:96px;top:830px"><span class="k-bottleneck" style="font-size:36px;padding:6px 14px">瓶颈：指令太小</span></div>
    </div>
  </div>
  <script>
    (function () {
      const $ = (k) => document.getElementById("s04-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const B = [1.0, 6.93, 8.25, 16.44], DUR = 19.74;
      const C_HOT = "#c4561d", C_USE = "#2f8a57", C_TEAL = "#0fa391", C_TEALD = "#0b7d70";

      // ---------- 数据块与喂给 Tensor Core 的小块 ----------
      const NB = 8, STEPS = 6, P = 1.1, T0 = 2.7;
      const HBM = { x: 126, y: 460 };                               // 块从显存那一摞起飞（左上角坐标）
      const SLOT = (j) => ({ x: 480 + j * 260, y: 460 });
      const blks = [];
      for (let n = 0; n < NB; n++) {
        const b = document.createElement("div");
        b.className = "s04-blk"; b.id = "s04-b" + n;
        b.innerHTML = `<span>块 ${n}</span>`;
        $("blks").appendChild(b); blks.push(b);
      }
      const pkts = [];
      for (let k = 0; k < STEPS * 3; k++) {
        const p = document.createElement("div");
        p.className = "s04-pkt"; p.id = "s04-pk" + k;
        $("pkts").appendChild(p); pkts.push(p);
      }
      // 时钟格：10 格，只有每 3 格塞得进一条
      const CL = 700, CP = 112, NC = 10, filled = [0, 3, 6, 9];
      const clks = [], minis = [], miss = [];
      for (let i = 0; i < NC; i++) {
        const c = document.createElement("div");
        c.className = "s04-clk"; c.style.left = (CL + i * CP) + "px";
        $("clks").appendChild(c); clks.push(c);
        if (filled.includes(i)) {
          const m = document.createElement("div");
          m.className = "s04-mini"; m.id = "s04-mi" + i;
          $("minis").appendChild(m); minis.push([i, m]);
        } else {
          const x = document.createElement("div");
          x.className = "s04-miss"; x.style.left = (CL + i * CP - 4) + "px";
          $("miss").appendChild(x); miss.push(x);
        }
      }

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set([$("tbfill"), $("tbghost")], { scaleX: 4.09 / 16 });
      gsap.set($("tbghost"), { opacity: 0 });
      gsap.set($("tbnum"), { x: 4.09 * 45 + 12 });
      gsap.set([$("tb"), $("tbv2")], { opacity: 0 });
      gsap.set([$("hbm"), $("hbml"), $("sml"), $("sn0"), $("sn1"), $("sn2"), $("sl0"), $("sl1"), $("sl2"), $("tc"), $("tcl"), $("legend")], { opacity: 0 });
      gsap.set(blks, { x: HBM.x, y: HBM.y, opacity: 0, backgroundColor: C_HOT });
      gsap.set(pkts, { opacity: 0 });
      gsap.set([$("insh"), $("sq"), $("sqk"), $("clkh"), $("clkn"), ...clks, ...miss], { opacity: 0 });
      minis.forEach(([i, m]) => gsap.set(m, { x: 136, y: 660, opacity: 0 }));
      gsap.set([$("third"), $("bn")], { opacity: 0 });

      // ---------- 标题卡 ----------
      ft($("chip"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 0.08);
      ft($("ttl"), { scale: 1, y: 0, transformOrigin: "0 0" }, { scale: 0.72, y: -12, transformOrigin: "0 0", duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("tb"), 1.05);

      // ---------- 第 1 句：舞台进场 ----------
      ft($("hbm"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 1.05);
      fadeIn($("hbml"), 1.1, 0.4);
      [0, 1, 2].forEach((j) => {
        ft($("sl" + j), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 1.15 + j * 0.08);
        fadeIn($("sn" + j), 1.25 + j * 0.08, 0.4);
      });
      fadeIn($("sml"), 1.3, 0.4);
      ft($("tc"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 1.3);
      fadeIn($("tcl"), 1.4, 0.4);
      fadeIn($("legend"), 1.8, 0.4);

      // 飞行：从显存起飞，落进槽位后由橙变绿
      const fly = (n, t) => {
        const s = SLOT(n % 3);
        ft(blks[n], { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 0.15, ease: IN }, t);
        ft(blks[n], { x: HBM.x, y: HBM.y }, { x: s.x, y: s.y, duration: 0.8, ease: MOVE }, t);
        ft(blks[n], { backgroundColor: C_HOT }, { backgroundColor: C_USE, duration: 0.2, ease: "none" }, t + 0.8);
      };
      // 预取：先发两块
      fly(0, 1.5);
      fly(1, 1.8);
      // 主循环：第 t 步算块 t（槽 t % 3），同时发块 t + 2 进刚空出的槽
      for (let t = 0; t < STEPS; t++) {
        const ts = T0 + t * P, s = SLOT(t % 3);
        ft(blks[t], { backgroundColor: C_USE }, { backgroundColor: C_TEAL, duration: 0.2, ease: "none" }, ts);
        for (let q = 0; q < 3; q++) {
          const p = pkts[t * 3 + q], tq = ts + 0.1 + q * 0.25;
          // 从槽底出发，沿槽位下方的走廊进 Tensor Core（不压住块上的字）
          gsap.set(p, { x: s.x + 78, y: s.y + 150 });
          ft(p, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, tq);
          tl.to(p, { keyframes: { "0%": { x: s.x + 78, y: s.y + 150 }, "15%": { x: s.x + 78, y: 700 }, "85%": { x: 1400, y: 700 }, "100%": { x: 1450, y: 630 }, easeEach: "none" }, duration: 0.45, ease: "power1.in" }, tq);
          ft(p, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, tq + 0.45);
          ft($("tc"), { backgroundColor: C_TEAL }, { backgroundColor: C_TEALD, duration: 0.1, ease: "none", yoyo: true, repeat: 1 }, tq + 0.42);
        }
        if (t + 2 < NB) fly(t + 2, ts);
        // 算完：槽位空出
        ft(blks[t], { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.25, ease: OUT }, ts + 0.95);
      }

      // ---------- 第 2 句：4.09 → 3.56 ms ----------
      ft($("tbghost"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, B[1]);
      ft($("tbfill"), { scaleX: 4.09 / 16 }, { scaleX: 3.56 / 16, duration: 0.9, ease: MOVE }, B[1]);
      ft($("tbnum"), { x: 4.09 * 45 + 12 }, { x: 3.56 * 45 + 12, duration: 0.9, ease: MOVE }, B[1]);
      ft($("tbv1"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: OUT }, B[1] + 0.1);
      ft($("tbv2"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, B[1] + 0.7);
      fadeOut($("tbghost"), B[1] + 1.5, 0.5);

      // ---------- 第 3 句：舞台缩小靠上（字先隐去），指令与时钟格 ----------
      const SH = B[2] + 0.6;
      const stageText = [$("hbml"), $("sml"), $("sn0"), $("sn1"), $("sn2"), $("tcl"), $("legend"), ...blks.map((b) => b.querySelector("span"))];
      ft(stageText, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: OUT }, SH);
      ft($("stg"), { scale: 1, opacity: 1, transformOrigin: "96px 300px" }, { scale: 0.42, opacity: 0.55, transformOrigin: "96px 300px", duration: 0.8, ease: MOVE }, SH + 0.1);
      ft($("insh"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, SH + 0.5);
      ft($("sq"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 10.3);
      ft($("sqk"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 10.6);
      ft($("clkh"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 11.8);
      clks.forEach((c, i) => ft(c, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 11.9 + i * 0.04));
      fadeIn($("clkn"), 12.2, 0.4);
      // 一条条发出：只塞得进每 3 格中的 1 格
      minis.forEach(([i, m], k) => {
        const t = 13.0 + i * 0.28;
        ft(m, { x: 136, y: 660, opacity: 0 }, { x: CL + i * CP + 10, y: 630, opacity: 1, duration: 0.5, ease: MOVE }, t);
      });
      miss.forEach((x, k) => ft(x, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 16.0));

      // ---------- 第 4 句：峰值的 1/3；瓶颈 ----------
      ft($("third"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, B[3] + 0.1);
      ft($("bn"), { opacity: 0, scale: 0.85, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, B[3] + 0.5);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["s04"] = tl;
    })();
  </script>
</template>
