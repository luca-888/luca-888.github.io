<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .s04-full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root .s04-abs { position: absolute; }
    #root .s04-lbl { position: absolute; font-size: 32px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
    #root .kit-tbar .num span { position: absolute; left: 0; top: 0; }
    /* 第 1、2 句：显存 → 3 个槽位 → Tensor Core */
    #root #s04-hbm { position: absolute; left: 96px; top: 340px; width: 240px; height: 220px; background: var(--paper2); border: 3px solid var(--hot); border-radius: 4px; }
    #root .s04-pile { position: absolute; width: 140px; height: 140px; background: var(--hotL); border: 2px solid var(--hot); border-radius: 2px; }
    #root .s04-slot { position: absolute; top: 356px; width: 200px; height: 200px; background: var(--paper2); border: 3px dashed var(--gray); border-radius: 4px; }
    #root .s04-sname { position: absolute; top: 302px; width: 200px; text-align: center; font-size: 36px; font-weight: 600; color: var(--ink2); }
    #root #s04-tc { position: absolute; left: 1220px; top: 340px; width: 300px; height: 220px; background: var(--teal); border-radius: 4px; }
    #root .s04-blk { position: absolute; left: 0; top: 0; width: 180px; height: 180px; border-radius: 3px; background: var(--hot); }
    #root .s04-blk span { position: absolute; inset: 0; line-height: 180px; text-align: center; font-family: var(--mono); font-size: 40px; font-weight: 800; color: #fff; white-space: nowrap; }
    #root .s04-pkt { position: absolute; left: 0; top: 0; width: 40px; height: 40px; background: var(--teal); border: 3px solid var(--paper); border-radius: 2px; }
    /* 第 2 句：两行时间线 */
    #root .s04-lname { position: absolute; left: 96px; width: 170px; text-align: right; font-size: 36px; font-weight: 700; color: var(--ink); white-space: nowrap; line-height: 64px; }
    #root .s04-lane { position: absolute; left: 300px; width: 1520px; height: 64px; }
    #root .s04-seg { position: absolute; top: 0; height: 64px; line-height: 64px; text-align: center; font-family: var(--mono); font-size: 36px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; border-radius: 2px; }
    /* 第 3 句：指令与时钟格 */
    #root .s04-clk { position: absolute; top: 470px; width: 84px; height: 84px; background: var(--paper2); border: 2px solid var(--line); border-radius: 2px; }
    #root .s04-want { position: absolute; top: 470px; width: 84px; height: 84px; border: 3px dashed var(--teal-t); border-radius: 2px; }
    #root .s04-mini { position: absolute; left: 0; top: 0; width: 64px; height: 64px; border-radius: 2px; }
    #root .s04-miss { position: absolute; top: 466px; width: 92px; height: 92px; border: 4px dashed var(--hot); border-radius: 2px; }
  </style>
  <div id="root" data-composition-id="s04" data-width="1920" data-height="1080">

    <!-- 标题卡 -->
    <div id="s04-title" class="clip s04-full" data-start="0.00" data-duration="27.79" data-track-index="1">
      <div id="s04-chip" class="kit-chip">mm_mma&lt;3级&gt;</div>
      <div id="s04-ttl" class="kit-title">第 3 步：<span class="acc">三级缓冲</span></div>
    </div>

    <!-- 耗时条：4.09 → 3.56（第 2 句开始后 3 s） -->
    <div id="s04-tb" class="clip kit-tbar" data-start="1.00" data-duration="26.79" data-track-index="2">
      <div class="lbl">8192 阶矩阵乘法 · 一次耗时</div>
      <div class="track"><div id="s04-tbghost" class="ghost"></div><div id="s04-tbfill" class="fill"></div><div class="peak"></div></div>
      <div id="s04-tbnum" class="num"><span id="s04-tbv1">4.09 ms</span><span id="s04-tbv2">3.56 ms</span></div>
      <div class="ref">虚线：规格峰值 1.11 ms</div>
    </div>

    <!-- 第 1 句（1.0）：三个槽位，拷贝提前两块；第 2 句：算块 t 时，t+1、t+2 在路上 -->
    <div id="s04-stage" class="clip s04-full" data-start="1.00" data-duration="12.24" data-track-index="3">
      <div id="s04-hbm">
        <div class="s04-pile" style="left:62px;top:28px"></div>
        <div class="s04-pile" style="left:48px;top:42px"></div>
        <div class="s04-pile" style="left:34px;top:56px"></div>
      </div>
      <div id="s04-hbml" class="s04-lbl" style="left:96px;top:288px;width:240px;text-align:center;font-size:36px;font-weight:700;color:var(--hot-t)">显存</div>
      <div id="s04-sml" class="s04-lbl" style="left:440px;top:254px;width:680px;text-align:center;font-size:36px;font-weight:700;color:var(--use-t)">共享内存 · 3 个槽位</div>
      <div id="s04-sn0" class="s04-sname" style="left:440px">槽 0</div>
      <div id="s04-sn1" class="s04-sname" style="left:680px">槽 1</div>
      <div id="s04-sn2" class="s04-sname" style="left:920px">槽 2</div>
      <div id="s04-sl0" class="s04-slot" style="left:440px"></div>
      <div id="s04-sl1" class="s04-slot" style="left:680px"></div>
      <div id="s04-sl2" class="s04-slot" style="left:920px"></div>
      <div id="s04-tc"></div>
      <div id="s04-tcl" class="s04-abs" style="left:1220px;top:340px;width:300px;height:220px;line-height:220px;text-align:center;font-size:40px;font-weight:800;color:#fff;white-space:nowrap">Tensor Core</div>
      <div id="s04-blks" class="s04-full"></div>
      <div id="s04-pkts" class="s04-full"></div>
    </div>

    <!-- 第 2 句（6.22）：两行时间线，拷贝条与计算条重叠 -->
    <div id="s04-tline" class="clip s04-full" data-start="6.22" data-duration="7.02" data-track-index="4">
      <div id="s04-ln1" class="s04-lname" style="top:690px">拷贝</div>
      <div id="s04-ln2" class="s04-lname" style="top:776px">计算</div>
      <div id="s04-lane1" class="s04-lane" style="top:690px"></div>
      <div id="s04-lane2" class="s04-lane" style="top:776px"></div>
    </div>

    <!-- 第 3 句（12.74）：一条 mma.sync = 2048 次乘加，每个时钟要一条，还要另发 ldmatrix -->
    <div id="s04-ins" class="clip s04-full" data-start="12.74" data-duration="15.05" data-track-index="5">
      <div id="s04-mmaw" class="s04-abs" style="left:0;top:0;width:700px;height:700px">
      <div id="s04-sq" class="s04-abs" style="left:96px;top:420px;width:200px;height:150px;background:var(--teal);border-radius:3px;line-height:150px;text-align:center;font-family:var(--mono);font-size:36px;font-weight:800;color:#fff">mma.sync</div>
      <div id="s04-sqk" class="s04-abs" style="left:96px;top:590px;white-space:nowrap;font-size:44px;font-weight:800;color:var(--ink)"><span style="font-family:var(--mono);color:var(--teal-t)">2048</span> 次乘加</div>
      </div>
      <div id="s04-lq" class="s04-abs" style="left:96px;top:700px;width:200px;height:100px;background:var(--purple);border-radius:3px;line-height:100px;text-align:center;font-family:var(--mono);font-size:36px;font-weight:800;color:#fff">ldmatrix</div>
      <div id="s04-clkh" class="s04-abs" style="left:700px;top:400px;font-size:36px;font-weight:700;color:var(--ink2);white-space:nowrap">时钟 →</div>
      <div id="s04-clks" class="s04-full"></div>
      <div id="s04-wants" class="s04-full"></div>
      <div id="s04-minis" class="s04-full"></div>
      <div id="s04-miss" class="s04-full"></div>
    </div>

    <!-- 第 4 句（23.3）：止于峰值的三分之一 -->
    <div id="s04-end" class="clip s04-full" data-start="23.30" data-duration="4.49" data-track-index="6">
      <div id="s04-third" class="s04-abs" style="left:700px;top:640px;white-space:nowrap"><span style="font-size:44px;font-weight:700;color:var(--ink)">峰值的 </span><span style="font-family:var(--mono);font-size:64px;font-weight:800;color:var(--hot-t);line-height:1">1/3</span></div>
      <div id="s04-bn" class="s04-abs" style="left:700px;top:760px"><span class="k-bottleneck" style="font-size:36px;padding:6px 14px">瓶颈：指令太小</span></div>
    </div>
  </div>
  <script>
    (function () {
      const $ = (k) => document.getElementById("s04-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const B = [1.0, 6.22, 12.74, 23.3], DUR = 27.79;
      const C_HOT = "#c4561d", C_USE = "#2f8a57", C_TEAL = "#0fa391", C_TEALD = "#0b7d70";

      // ---------- 数据块与喂给 Tensor Core 的小块 ----------
      const NB = 7, STEPS = 5, P = 1.15, T0 = 6.5;
      const HBM = { x: 126, y: 366 };                               // 块从显存那一摞起飞（左上角坐标）
      const SLOT = (j) => ({ x: 450 + j * 240, y: 366 });
      const blks = [];
      for (let n = 0; n < NB; n++) {
        const b = document.createElement("div");
        b.className = "s04-blk"; b.id = "s04-b" + n;
        b.innerHTML = `<span>块 ${n}</span>`;
        $("blks").appendChild(b); blks.push(b);
      }
      const pkts = [];
      for (let k = 0; k < STEPS * 3; k++) {
        const p = document.createElement("div");
        p.className = "s04-pkt"; p.id = "s04-pk" + k;
        $("pkts").appendChild(p); pkts.push(p);
      }
      // 时间线：u 为“一步”的时间单位，230 px / 步
      const U = 230;
      const seg = (lane, u0, u1, label, color) => {
        const s = document.createElement("div");
        s.className = "s04-seg";
        s.style.left = (u0 * U) + "px"; s.style.width = ((u1 - u0) * U - 6) + "px"; s.style.background = color;
        s.textContent = label;
        $(lane).appendChild(s);
      };
      seg("lane1", 0, 0.5, "块 0", "var(--hot)");
      seg("lane1", 0.5, 1.0, "块 1", "var(--hot)");
      for (let t = 0; t < STEPS; t++) {
        seg("lane1", 1 + t, 1.85 + t, "块 " + (t + 2), "var(--hot)");
        seg("lane2", 1 + t, 2 + t, "块 " + t, "var(--teal)");
      }
      // 时钟格：12 格；每 3 格里 1 格 mma.sync、1 格 ldmatrix、1 格空着
      const CL = 700, CP = 92, NC = 12;
      const clks = [], wants = [], minis = [], miss = [];
      for (let i = 0; i < NC; i++) {
        const c = document.createElement("div");
        c.className = "s04-clk"; c.style.left = (CL + i * CP) + "px";
        $("clks").appendChild(c); clks.push(c);
        const w = document.createElement("div");
        w.className = "s04-want"; w.style.left = (CL + i * CP) + "px";
        $("wants").appendChild(w); wants.push(w);
        const kind = i % 3;
        if (kind < 2) {
          const m = document.createElement("div");
          m.className = "s04-mini"; m.id = "s04-mi" + i;
          m.style.background = kind === 0 ? "var(--teal)" : "var(--purple)";
          $("minis").appendChild(m); minis.push([i, kind, m]);
        } else {
          const x = document.createElement("div");
          x.className = "s04-miss"; x.style.left = (CL + i * CP - 4) + "px";
          $("miss").appendChild(x); miss.push([i, x]);
        }
      }

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set([$("tbfill"), $("tbghost")], { scaleX: 4.09 / 16 });
      gsap.set($("tbghost"), { opacity: 0 });
      gsap.set($("tbnum"), { x: 4.09 * 45 + 12 });
      gsap.set([$("tb"), $("tbv2")], { opacity: 0 });
      gsap.set([$("hbm"), $("hbml"), $("sml"), $("sn0"), $("sn1"), $("sn2"), $("sl0"), $("sl1"), $("sl2"), $("tc"), $("tcl")], { opacity: 0 });
      gsap.set(blks, { x: HBM.x, y: HBM.y, opacity: 0, backgroundColor: C_HOT });
      gsap.set(pkts, { opacity: 0 });
      gsap.set([$("ln1"), $("ln2"), $("lane1"), $("lane2")], { opacity: 0 });
      gsap.set([$("lane1"), $("lane2")], { clipPath: `inset(0px ${1520 - U}px 0px 0px)` });
      gsap.set([$("sq"), $("sqk"), $("lq"), $("clkh"), ...clks, ...wants], { opacity: 0 });
      minis.forEach(([i, kind, m]) => gsap.set(m, { opacity: 0 }));
      miss.forEach(([i, x]) => gsap.set(x, { opacity: 0 }));
      gsap.set([$("third"), $("bn")], { opacity: 0 });
      gsap.set($("mmaw"), { x: 640, y: -200, scale: 1.5, transformOrigin: "0 0" });
      gsap.set($("stage"), { y: 150 });

      // ---------- 标题卡 ----------
      ft($("chip"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 0.08);
      ft($("ttl"), { scale: 1, y: 0, transformOrigin: "0 0" }, { scale: 0.72, y: -12, transformOrigin: "0 0", duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("tb"), 1.05);

      // ---------- 第 1 句：舞台进场，先预取两块 ----------
      ft($("hbm"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 1.1);
      fadeIn($("hbml"), 1.15, 0.4);
      [0, 1, 2].forEach((j) => {
        ft($("sl" + j), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 1.3 + j * 0.1);
        fadeIn($("sn" + j), 1.4 + j * 0.1, 0.4);
      });
      fadeIn($("sml"), 1.5, 0.4);
      ft($("tc"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 1.9);
      fadeIn($("tcl"), 2.0, 0.4);

      // 飞行：从显存起飞，落进槽位后由橙变绿
      const fly = (n, t, d = 0.8) => {
        const s = SLOT(n % 3);
        ft(blks[n], { opacity: 0 }, { opacity: 1, duration: 0.15, ease: IN }, t);
        // 走槽位下方的走廊，飞行中缩小，不压住别的槽
        tl.to(blks[n], { keyframes: { "0%": { x: HBM.x, y: HBM.y, scale: 0.75 }, "20%": { x: HBM.x, y: 470, scale: 0.4 }, "80%": { x: s.x, y: 470, scale: 0.4 }, "100%": { x: s.x, y: s.y, scale: 1 }, easeEach: "none" }, duration: d, ease: "power1.inOut" }, t);
        ft(blks[n], { backgroundColor: C_HOT }, { backgroundColor: C_USE, duration: 0.2, ease: "none" }, t + d);
        const lab = blks[n].querySelector("span");
        ft(lab, { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "none" }, t);
        ft(lab, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, t + d - 0.1);
      };
      fly(0, 3.2, 1.0);
      fly(1, 4.1, 1.0);

      // 第 2 句：舞台上移，下方留给时间线
      ft($("stage"), { y: 150 }, { y: 0, duration: 0.7, ease: MOVE }, B[1] - 0.1);

      // ---------- 第 2 句：主循环。第 t 步算块 t（槽 t % 3），同时发块 t + 2 进刚空出的槽 ----------
      for (let t = 0; t < STEPS; t++) {
        const ts = T0 + t * P, s = SLOT(t % 3);
        ft(blks[t], { backgroundColor: C_USE }, { backgroundColor: C_TEAL, duration: 0.2, ease: "none" }, ts);
        for (let q = 0; q < 3; q++) {
          const p = pkts[t * 3 + q], tq = ts + 0.1 + q * 0.25;
          // 从槽底出发，沿槽位下方的走廊进 Tensor Core
          gsap.set(p, { x: s.x + 70, y: s.y + 130 });
          ft(p, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, tq);
          tl.to(p, { keyframes: { "0%": { x: s.x + 70, y: s.y + 130 }, "20%": { x: s.x + 70, y: 590 }, "85%": { x: 1250, y: 590 }, "100%": { x: 1280, y: 510 }, easeEach: "none" }, duration: 0.45, ease: "power1.in" }, tq);
          ft(p, { opacity: 1 }, { opacity: 0, duration: 0.08, ease: "none" }, tq + 0.45);
          ft($("tc"), { backgroundColor: C_TEAL }, { backgroundColor: C_TEALD, duration: 0.1, ease: "none", yoyo: true, repeat: 1 }, tq + 0.42);
        }
        if (t + 2 < NB) fly(t + 2, ts);
        // 算完：槽位空出
        ft(blks[t], { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.6, duration: 0.25, ease: OUT }, ts + 0.95);
      }
      // 时间线：随主循环往右展开
      const b2 = B[1];
      fadeIn([$("ln1"), $("ln2")], b2 + 0.1, 0.4);
      fadeIn([$("lane1"), $("lane2")], b2 + 0.15, 0.4);
      ft([$("lane1"), $("lane2")], { clipPath: `inset(0px ${1520 - U}px 0px 0px)` }, { clipPath: `inset(0px ${1520 - 6 * U}px 0px 0px)`, duration: STEPS * P, ease: "none" }, T0);
      // 3 s 后：耗时条 4.09 → 3.56
      const S = b2 + 3.0;
      ft($("tbghost"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, S);
      ft($("tbfill"), { scaleX: 4.09 / 16 }, { scaleX: 3.56 / 16, duration: 0.9, ease: MOVE }, S);
      ft($("tbnum"), { x: 4.09 * 45 + 12 }, { x: 3.56 * 45 + 12, duration: 0.9, ease: MOVE }, S);
      ft($("tbv1"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: OUT }, S + 0.1);
      ft($("tbv2"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, S + 0.7);
      fadeOut($("tbghost"), S + 1.5, 0.5);
      fadeOut($("stage"), B[2]);
      fadeOut($("tline"), B[2]);

      // ---------- 第 3 句：一条 mma.sync 只有 2048 次乘加；每个时钟要一条；另发 ldmatrix ----------
      const b3 = B[2];
      ft($("sq"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, b3 + 0.9);
      ft($("sqk"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, b3 + 1.3);
      // 先在中间讲“一条指令”，再让到左边
      ft($("mmaw"), { x: 640, y: -200, scale: 1.5, transformOrigin: "0 0" }, { x: 0, y: 0, scale: 1, transformOrigin: "0 0", duration: 0.8, ease: MOVE }, b3 + 3.0);
      ft($("clkh"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, b3 + 3.6);
      clks.forEach((c, i) => ft(c, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, b3 + 3.8 + i * 0.04));
      // 理想：每一格都要一条 mma.sync（虚线）
      wants.forEach((w, i) => fadeIn(w, b3 + 4.8 + i * 0.06, 0.3));
      ft($("lq"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, b3 + 6.8);
      // 实际：发射槽被 ldmatrix 分走，还有空着的格
      const SQ = { x: 96 + 68, y: 420 + 43 }, LQ = { x: 96 + 68, y: 700 + 18 };
      minis.forEach(([i, kind, m]) => {
        const t = b3 + 7.7 + i * 0.18, src = kind === 0 ? SQ : LQ;
        ft(m, { x: src.x, y: src.y, opacity: 0 }, { x: CL + i * CP + 10, y: 480, opacity: 1, duration: 0.45, ease: MOVE }, t);
      });
      miss.forEach(([i, x]) => ft(x, { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, b3 + 7.7 + i * 0.18 + 0.3));

      // ---------- 第 4 句：峰值的 1/3；瓶颈 ----------
      const b4 = B[3];
      ft(minis.filter(([i, k]) => k === 0).map(([i, k, m]) => m), { scale: 1 }, { scale: 1.15, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, b4 + 0.1);
      ft($("third"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, b4 + 0.2);
      ft($("bn"), { opacity: 0, scale: 0.85, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, b4 + 0.8);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["s04"] = tl;
    })();
  </script>
</template>
