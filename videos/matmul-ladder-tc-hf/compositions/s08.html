  <script>
    (function () {
      const $ = (k) => document.getElementById("s08-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const NS = "http://www.w3.org/2000/svg";

      // ---------- tile 图：x = tile 行 m（64），y = tile 列 n（32） ----------
      const X = (m) => m * 15, Y = (n) => n * 15;
      const cells = $("cells"), cols = [];
      for (let m = 0; m < 64; m++) {
        const col = document.createElement("div");
        col.className = "s08-in";
        for (let n = 0; n < 32; n++) {
          const c = document.createElement("div");
          c.className = "s08-c";
          c.style.left = X(m) + "px"; c.style.top = Y(n) + "px";
          col.appendChild(c);
        }
        cells.appendChild(col); cols.push(col);
      }
      for (let n = 0; n < 32; n++) {
        const w = document.createElement("div");
        w.className = "s08-w"; w.style.top = Y(n) + "px";
        $("strip").appendChild(w);
      }
      // 一轮 132 个 tile：按行 (m = k / 32, n = k % 32) → 分组 (m = k % 16, n = k / 16)
      const rowPos = (k) => [X(Math.floor(k / 32)), Y(k % 32)];
      const grpPos = (k) => [X(k % 16), Y(Math.floor(k / 16))];
      const runs = [];
      for (let k = 0; k < 132; k++) {
        const r = document.createElement("div");
        r.className = "s08-r";
        $("run").appendChild(r); runs.push(r);
      }

      // ---------- 初始状态 ----------
      gsap.set($("ttl"), { x: 0, y: 0, scale: 1 });
      gsap.set($("chip"), { opacity: 0 });
      gsap.set($("ttl"), { opacity: 0 });
      const fx = (v) => (v / 781.86) * 544;
      gsap.set($("fill"), { scaleX: 480 / 781.86 });
      gsap.set($("num"), { x: fx(480) - 150 });
      gsap.set($("num2"), { x: fx(740) - 150, opacity: 0 });
      gsap.set([$("mt"), $("gain")], { opacity: 0 });
      gsap.set(cols, { opacity: 0 });
      runs.forEach((r, k) => { const p = rowPos(k); gsap.set(r, { x: p[0], y: p[1], opacity: 0 }); });
      gsap.set([$("strip"), $("wcur"), $("hl"), $("axis"), $("wlbl"), $("grp")], { opacity: 0 });
      gsap.set([$("hA"), $("hB")], { opacity: 0 });

      // ---------- 0.0 标题卡 ----------
      ft($("chip"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 0.1);

      // ---------- 1.0 标题缩到左上；tile 图按行发放 ----------
      ft($("ttl"), { x: 0, y: 0, scale: 1 }, { x: 0, y: -16, scale: 0.6, duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("mt"), 1.0);
      cols.forEach((c, m) => ft(c, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 1.05 + m * 0.008));
      fadeIn($("axis"), 1.3);
      runs.forEach((r, k) => ft(r, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: IN }, 1.6 + Math.floor(k / 32) * 0.12));
      fadeIn($("hA"), 1.6);

      // ---------- 3.6 每 16 行一组，组内按列：收拢 ----------
      fadeOut($("hA"), 3.6, 0.3);
      runs.forEach((r, k) => {
        const a = rowPos(k), b = grpPos(k);
        ft(r, { x: a[0], y: a[1] }, { x: b[0], y: b[1], duration: 1.2, ease: MOVE }, 3.7 + (k % 16) * 0.012);
      });
      fadeIn($("grp"), 3.9);
      fadeIn($("hB"), 4.0);

      // ---------- 7.1 工作集 136 MB → 65 MB ----------
      fadeOut($("hB"), 6.75, 0.3);
      fadeIn($("l2m"), 7.1);
      fadeIn($("wl1"), 7.2);
      ft($("b1a"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: IN }, 7.3);
      ft($("b1w"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: IN }, 7.55);
      fadeIn($("wl2"), 8.6);
      ft($("b2a"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: IN }, 8.7);
      ft($("b2w"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: IN }, 9.15);
      fadeOut($("wsin"), 12.0, 0.35);

      // ---------- 12.4 一块 W 读进 L2，随即被 16 个 tile 读取 ----------
      fadeIn($("wlbl"), 12.4);
      fadeIn($("strip"), 12.4);
      fadeIn($("wcur"), 12.6, 0.3);
      fadeIn($("hl"), 12.6, 0.3);
      ft($("fl1"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 12.6);
      ft($("l2a"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: IN }, 12.6);
      ft($("wb"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 12.9);
      const fsvg = $("fsvg"), lines = [];
      for (let i = 0; i < 16; i++) {
        const y = 330 + i * 34;
        const t = document.createElement("div");
        t.className = "s08-ft"; t.style.top = y + "px";
        $("ftiles").appendChild(t);
        ft(t, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 13.0 + i * 0.03);
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", 1350); ln.setAttribute("y1", 558);
        ln.setAttribute("x2", 1616); ln.setAttribute("y2", y + 13);
        ln.setAttribute("stroke-width", 3);
        ln.style.stroke = "var(--yel-t)";
        const len = Math.hypot(266, y + 13 - 558);
        ln.setAttribute("stroke-dasharray", len);
        ln.setAttribute("stroke-dashoffset", len);
        fsvg.appendChild(ln); lines.push([ln, len]);
      }
      fadeIn($("fl2"), 13.4);
      lines.forEach(([ln, len]) => ft(ln, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.6, ease: MOVE }, 13.5));
      // 组内按列推进：下一块 W，下一列 16 个 tile
      for (let s = 1; s <= 4; s++) {
        const t = 14.8 + s * 0.8;
        ft($("hl"), { y: Y(s - 1) }, { y: Y(s), duration: 0.3, ease: MOVE }, t);
        ft($("wcur"), { y: Y(s - 1) }, { y: Y(s), duration: 0.3, ease: MOVE }, t);
        lines.forEach(([ln, len]) => ft(ln, { strokeDashoffset: 0 }, { strokeDashoffset: len, duration: 0.01 }, t));
        lines.forEach(([ln, len]) => ft(ln, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.45, ease: MOVE }, t + 0.05));
      }
      fadeOut($("fanin"), 19.0, 0.35);

      // ---------- 19.4 显存读取 6.6 → 1.3 GB；L2 命中率 48% → 79% ----------
      fadeOut($("strip"), 19.4); fadeOut($("wcur"), 19.4); fadeOut($("hl"), 19.4); fadeOut($("wlbl"), 19.4);
      ft($("g1"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 19.5);
      ft($("c1a"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: IN }, 19.6);
      fadeIn($("v1a"), 20.1, 0.3);
      ft($("c1b"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: IN }, 20.6);
      fadeIn($("v1b"), 20.9, 0.3);
      ft($("g2"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 22.6);
      ft($("c2a"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: IN }, 22.7);
      fadeIn($("v2a"), 23.1, 0.3);
      ft($("c2b"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: IN }, 23.6);
      fadeIn($("v2b"), 24.1, 0.3);
      gsap.set([$("g1"), $("g2"), $("v1a"), $("v1b"), $("v2a"), $("v2b")], { opacity: 0 });
      ft([$("g1"), $("g2")], { opacity: 1 }, { opacity: 0, duration: 0.35, ease: OUT }, 25.6);

      // ---------- 26.0 实测 740，1.54 倍 ----------
      ft($("fill"), { scaleX: 480 / 781.86 }, { scaleX: 740 / 781.86, duration: 1.1, ease: MOVE }, 26.1);
      ft($("num"), { x: fx(480) - 150 }, { x: fx(740) - 150, duration: 1.1, ease: MOVE }, 26.1);
      ft($("num"), { opacity: 1 }, { opacity: 0, duration: 0.25, ease: OUT }, 26.1);
      ft($("num2"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 26.9);
      fadeIn($("gain"), 27.1);

      // ---------- 29.8 每个 block 各自从 L2 读整块 W：132 条线 ----------
      const bsvg = $("bsvg"), blines = [];
      gsap.set([$("l2b"), $("bl"), $("btag")], { opacity: 0 });
      runs.forEach((r, k) => {
        const p = grpPos(k);
        const x2 = 200 + p[0] + 7, y2 = 300 + p[1] + 7;
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", 1300); ln.setAttribute("y1", 520);
        ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
        ln.setAttribute("stroke-width", 1);
        ln.setAttribute("stroke-opacity", 0.55);
        ln.style.stroke = "var(--blue)";
        const len = Math.hypot(1300 - x2, 520 - y2);
        ln.setAttribute("stroke-dasharray", len);
        ln.setAttribute("stroke-dashoffset", len);
        bsvg.appendChild(ln);
        ft(ln, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.6, ease: MOVE }, 30.3 + k * 0.007);
      });
      ft($("l2b"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: IN }, 29.9);
      fadeIn($("bl"), 30.6);
