  <script>
    (function () {
      const $ = (k) => document.getElementById("s08-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const NS = "http://www.w3.org/2000/svg";
      const q = (sel) => document.querySelector(sel);

      // ---------- 耗时条 ----------
      const TBX = (ms) => ms * 45 + 12;
      gsap.set($("tbfill"), { scaleX: 1.49 / 16 });
      gsap.set($("tbghost"), { scaleX: 1.49 / 16, opacity: 0 });
      gsap.set($("tbnum"), { x: TBX(1.49) });
      gsap.set($("tbnum2"), { x: TBX(1.49), opacity: 0 });
      gsap.set($("tbin"), { opacity: 0 });

      // ---------- 写回：16 个线程，3 轮零散写入 ----------
      const dots = [], wl = [], mks = [];
      for (let i = 0; i < 16; i++) {
        const d = document.createElement("div");
        d.className = "s08-dot"; d.style.left = 160 + i * 50 + "px";
        $("dots").appendChild(d); dots.push(d);
      }
      for (let r = 0; r < 3; r++) {
        for (let i = 0; i < 16; i++) {
          const j = (i * 7 + r * 5) % 16, jj = (i * 11 + r * 3) % 9;
          const x2 = 1290 + j * 31 + (r * 9) % 20, y2 = 400 + jj * 22 + r * 6;
          const x1 = 175 + i * 50, y1 = 471;
          const ln = document.createElementNS(NS, "line");
          ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
          ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
          ln.setAttribute("stroke-width", 2);
          ln.setAttribute("stroke-opacity", 0.7);
          ln.style.stroke = "var(--purple)";
          const len = Math.hypot(x2 - x1, y2 - y1);
          ln.setAttribute("stroke-dasharray", len);
          ln.setAttribute("stroke-dashoffset", len);
          $("wsvg").appendChild(ln); wl.push([ln, len, r, i]);
          const m = document.createElement("div");
          m.className = "s08-mk"; $("mks").appendChild(m);
          gsap.set(m, { x: x2 - 7, y: y2 - 7, opacity: 0 });
          mks.push([m, r, i]);
        }
      }

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set([$("cbox"), $("b0"), $("b1"), $("same"), $("l2"), $("who"), $("mcl"), $("mcn")], { opacity: 0 });
      gsap.set(document.querySelectorAll("#s08-mc .s08-slot i"), { scaleX: 0 });
      ["pa", "pb"].forEach((k) => { const p = $(k), n = p.getTotalLength(); p.dataset.len = n; gsap.set(p, { strokeDasharray: n, strokeDashoffset: n }); });
      gsap.set([$("cap"), $("big"), $("rows")], { opacity: 0 });
      gsap.set([$("bm"), $("bc")], { scaleX: 0 });
      gsap.set([$("whd"), $("thl"), $("hbm"), $("zl"), $("tcl"), $("trk"), $("btag")], { opacity: 0 });
      gsap.set(dots, { opacity: 0 });
      gsap.set([$("g1"), $("g2"), $("g3")], { opacity: 0 });

      // ---------- 0.0 标题卡 ----------
      ft($("chip"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 0.1);

      // ---------- 1.0 标题缩到左上；1.7 两个要同一块 W 的 block；3.6 组成集群 ----------
      ft($("ttl"), { x: 0, y: 0, scale: 1 }, { x: 0, y: -16, scale: 0.6, duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("tbin"), 1.0);
      ft($("b0"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 1.6);
      ft($("b1"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 1.75);
      fadeIn($("same"), 2.4);
      ft($("cbox"), { opacity: 0, scale: 1.04, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, 3.6);
      fadeOut($("same"), 4.4, 0.3);

      // ---------- 4.7 W 各搬一半 ----------
      ft($("l2"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 2.3);
      fadeIn($("who"), 5.0);

      // ---------- 5.9 TMA 多播：一份写进两个 block ----------
      const draw = (p, t) => ft(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: 0.8, ease: MOVE }, t);
      const slotFill = (id, t) => ft(q("#s08-" + id + " i"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: IN }, t);
      draw($("pa"), 5.9);
      fadeIn($("mcl"), 5.95);
      slotFill("s0a", 6.6); slotFill("s1a", 6.6);
      draw($("pb"), 7.1);
      fadeIn($("mcn"), 7.2);
      slotFill("s0b", 7.8); slotFill("s1b", 7.8);
      fadeOut($("mcin"), 8.82);

      // ---------- 8.82 耗时条 1.49 → 1.45；10.35 cuBLAS 的 96.9% ----------
      tl.set($("tbghost"), { opacity: 1 }, 8.82);
      ft($("tbfill"), { scaleX: 1.49 / 16 }, { scaleX: 1.45 / 16, duration: 0.9, ease: MOVE }, 8.82);
      ft([$("tbnum"), $("tbnum2")], { x: TBX(1.49) }, { x: TBX(1.45), duration: 0.9, ease: MOVE }, 8.82);
      fadeOut($("tbnum"), 8.82, 0.3);
      fadeIn($("tbnum2"), 9.32, 0.4);
      ft($("tbghost"), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: OUT }, 10.32);

      fadeIn($("rows"), 9.2, 0.3);
      ft($("bm"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: IN }, 9.25);
      ft($("bc"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: IN }, 9.45);
      fadeIn($("cap"), 10.3);
      ft($("big"), { opacity: 0, scale: 0.92, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, 10.4);
      fadeOut($("resin"), 12.4);

      // ---------- 12.4 写回：线程零散写显存；16.35 期间不发 wgmma ----------
      fadeIn($("whd"), 12.5);
      fadeIn($("hbm"), 12.7);
      dots.forEach((d, i) => ft(d, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 13.0 + i * 0.03));
      fadeIn($("thl"), 13.3);
      const RT = [14.0, 14.8, 15.6];
      wl.forEach(([ln, len, r, i]) => {
        const t = RT[r] + ((i * 5) % 16) * 0.025;
        ft(ln, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: MOVE }, t);
        ft(ln, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: OUT }, t + 0.5);
      });
      mks.forEach(([m, r, i]) => fadeIn(m, RT[r] + ((i * 5) % 16) * 0.025 + 0.32, 0.15));
      fadeIn($("zl"), 14.6);
      fadeIn($("tcl"), 16.3); fadeIn($("trk"), 16.3);
      fadeIn($("g1"), 16.4, 0.3);
      ft($("g2"), { opacity: 1, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 1.2, ease: "none" }, 16.7);
      fadeIn($("g3"), 17.9, 0.4);
      ft($("btag"), { opacity: 0, scale: 0.85, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 17.6);

      tl.set({}, {}, 19.57);
      window.__timelines = window.__timelines || {};
      window.__timelines["s08"] = tl;
    })();
  </script>
