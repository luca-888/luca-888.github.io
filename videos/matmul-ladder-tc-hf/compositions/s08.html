  <script>
    (function () {
      const $ = (k) => document.getElementById("s08-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const NS = "http://www.w3.org/2000/svg";
      const q = (sel) => document.querySelector(sel);

      // ---------- 耗时条 ----------
      const TBX = (ms) => ms * 45 + 12;
      gsap.set($("tbfill"), { scaleX: 1.49 / 16 });
      gsap.set($("tbghost"), { scaleX: 1.49 / 16, opacity: 0 });
      gsap.set($("tbnum"), { x: TBX(1.49) });
      gsap.set($("tbnum2"), { x: TBX(1.49), opacity: 0 });
      gsap.set($("tbin"), { opacity: 0 });

      // ---------- 写回：16 个线程，3 轮零散写入 ----------
      const dots = [], wl = [], mks = [];
      for (let i = 0; i < 16; i++) {
        const d = document.createElement("div");
        d.className = "s08-dot"; d.style.left = 160 + i * 50 + "px";
        $("dots").appendChild(d); dots.push(d);
      }
      for (let r = 0; r < 3; r++) {
        for (let i = 0; i < 16; i++) {
          const j = (i * 7 + r * 5) % 16, jj = (i * 11 + r * 3) % 9;
          const x2 = 1290 + j * 31 + (r * 9) % 20, y2 = 400 + jj * 22 + r * 6;
          const x1 = 175 + i * 50, y1 = 471;
          const ln = document.createElementNS(NS, "line");
          ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
          ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
          ln.setAttribute("stroke-width", 2);
          ln.setAttribute("stroke-opacity", 0.7);
          ln.style.stroke = "var(--purple)";
          const len = Math.hypot(x2 - x1, y2 - y1);
          ln.setAttribute("stroke-dasharray", len);
          ln.setAttribute("stroke-dashoffset", len);
          $("wsvg").appendChild(ln); wl.push([ln, len, r, i]);
          const m = document.createElement("div");
          m.className = "s08-mk"; $("mks").appendChild(m);
          gsap.set(m, { x: x2 - 7, y: y2 - 7, opacity: 0 });
          mks.push([m, r, i]);
        }
      }

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set($("clg"), { x: -240 });
      gsap.set([$("cbox"), $("b0"), $("b1"), $("xd"), $("xh"), $("l2"), $("mcl"), $("kh"), $("kr1"), $("kr2"), $("kv2b")], { opacity: 0 });
      gsap.set(document.querySelectorAll("#s08-mc .s08-slot i"), { scaleX: 0 });
      ["xa", "pa", "pb"].forEach((k) => { const p = $(k), n = p.getTotalLength(); p.dataset.len = n; gsap.set(p, { strokeDasharray: n, strokeDashoffset: n }); });
      gsap.set([$("thl"), $("hbm"), $("tcl"), $("trk"), $("btag")], { opacity: 0 });
      gsap.set(dots, { opacity: 0 });
      gsap.set([$("g1"), $("g2"), $("g3")], { opacity: 0 });

      // ---------- 0.0 标题卡 ----------
      ft($("chip"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 0.1);

      // ---------- 1.0 两个 block，各在一个 SM 上；2.4 框成集群 ----------
      ft($("ttl"), { x: 0, y: 0, scale: 1 }, { x: 0, y: -16, scale: 0.6, duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("tbin"), 1.0);
      ft($("b0"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 1.4);
      ft($("b1"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, 1.55);
      ft($("cbox"), { opacity: 0, scale: 1.04, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, 2.4);
      // 3.61 可访问彼此的共享内存：双向箭头，一个数据块下去再上来
      ft($("xa"), { strokeDashoffset: $("xa").dataset.len }, { strokeDashoffset: 0, duration: 0.5, ease: MOVE }, 3.7);
      fadeIn($("xh"), 4.1, 0.3);
      ft($("xd"), { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.2, ease: IN }, 4.6);
      ft($("xd"), { y: 0 }, { y: 104, duration: 0.8, ease: MOVE }, 4.8);
      ft($("xd"), { y: 104 }, { y: 0, duration: 0.8, ease: MOVE }, 5.8);
      fadeOut($("xd"), 6.6, 0.3);

      // ---------- 7.11 集群右移；L2 的一块 W；两个 block 要同一块 W ----------
      ft($("clg"), { x: -240 }, { x: 0, duration: 0.8, ease: MOVE }, 7.11);
      fadeOut($("xh"), 7.11, 0.3);
      ft($("xa"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: OUT }, 7.11);
      ft($("l2"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 8.4);

      // ---------- 12.8 TMA 多播：每半读一次，分叉写进两个 block ----------
      const draw = (p, t) => ft(p, { strokeDashoffset: p.dataset.len }, { strokeDashoffset: 0, duration: 0.8, ease: MOVE }, t);
      const slotFill = (id, t) => ft(q("#s08-" + id + " i"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: IN }, t);
      fadeIn($("mcl"), 12.9);
      draw($("pa"), 13.1);
      slotFill("s0a", 13.8); slotFill("s1a", 13.8);
      draw($("pb"), 15.2);
      slotFill("s0b", 15.9); slotFill("s1b", 15.9);

      // 15.8 耗时条 1.49 → 1.45
      tl.set($("tbghost"), { opacity: 1 }, 15.8);
      ft($("tbfill"), { scaleX: 1.49 / 16 }, { scaleX: 1.45 / 16, duration: 0.9, ease: MOVE }, 15.8);
      ft([$("tbnum"), $("tbnum2")], { x: TBX(1.49) }, { x: TBX(1.45), duration: 0.9, ease: MOVE }, 15.8);
      fadeOut($("tbnum"), 15.8, 0.3);
      fadeIn($("tbnum2"), 16.3, 0.4);
      ft($("tbghost"), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: OUT }, 17.3);

      // 17.27 每 block 每步从 L2 读：48 KB → 32 KB（W 只读一半）
      fadeIn($("kh"), 17.4);
      fadeIn($("kr1"), 17.7);
      fadeIn($("kr2"), 18.6);
      ft($("kw2"), { width: 192 }, { width: 96, duration: 0.9, ease: MOVE }, 19.6);
      fadeOut($("kv2a"), 19.6, 0.3);
      fadeIn($("kv2b"), 20.3, 0.4);

      fadeOut($("mcin"), 23.02);

      // ---------- 23.02 写回：线程零散写显存；28.11 期间不发 wgmma ----------
      fadeIn($("hbm"), 23.4);
      dots.forEach((d, i) => ft(d, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 23.7 + i * 0.03));
      fadeIn($("thl"), 24.0);
      const RT = [24.6, 25.4, 26.2];
      wl.forEach(([ln, len, r, i]) => {
        const t = RT[r] + ((i * 5) % 16) * 0.025;
        ft(ln, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: MOVE }, t);
        ft(ln, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: OUT }, t + 0.5);
      });
      mks.forEach(([m, r, i]) => fadeIn(m, RT[r] + ((i * 5) % 16) * 0.025 + 0.32, 0.15));
      fadeIn($("tcl"), 24.4); fadeIn($("trk"), 24.4);
      fadeIn($("g1"), 24.6, 0.3);
      ft($("g2"), { opacity: 1, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 1.2, ease: "none" }, 28.1);
      fadeIn($("g3"), 29.3, 0.4);
      ft($("btag"), { opacity: 0, scale: 0.85, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 28.9);

      tl.set({}, {}, 30.62);
      window.__timelines = window.__timelines || {};
      window.__timelines["s08"] = tl;
    })();
  </script>
