  <script>
    (function () {
      const $ = (k) => document.getElementById("s02-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const B = [1.0, 10.93, 18.16, 26.3], DUR = 36.17;
      const C_BK = "#e6e0d3", C_OK = "#a9d6b9", C_RED = "#e5322d", C_WARP = "#a9c2ee", C_HOT = "#c4561d";

      // ---------- 生成的静态子元素 ----------
      const svgNS = "http://www.w3.org/2000/svg";
      const dots = [], wires = [];
      for (let i = 0; i < 32; i++) {
        const x = 453 + i * 32;
        const d = document.createElement("div");
        d.className = "s02-dot"; d.style.left = x + "px";
        $("dots").appendChild(d); dots.push(d);
        const w = document.createElementNS(svgNS, "path");
        w.setAttribute("d", `M ${x + 11} 758 L 960 652`);
        w.setAttribute("stroke", "var(--warp)"); w.setAttribute("stroke-width", "2");
        $("wires").appendChild(w); wires.push(w);
      }
      const BX = (b) => 96 + b * 32;
      const banks = [], tds = [], lines = [];
      for (let b = 0; b < 32; b++) {
        const c = document.createElement("div");
        c.className = "s02-bk"; c.style.left = BX(b) + "px";
        $("banks").appendChild(c); banks.push(c);
        const d = document.createElement("div");
        d.className = "s02-td"; d.style.left = (BX(b) + 3) + "px";
        $("tds").appendChild(d); tds.push(d);
        const p = document.createElementNS(svgNS, "path");
        p.setAttribute("d", `M ${BX(b) + 14} 462 L ${BX(b) + 14} 698`);
        p.setAttribute("stroke", "var(--blue)"); p.setAttribute("stroke-width", "3");
        $("lines").insertBefore(p, $("cl")); lines.push(p);
      }
      // 8 个读请求（第 4 句）：偶数行的这一块落在 bank 0–3，奇数行落在 bank 16–19，各叠 4 个
      const grpA = banks.slice(0, 4), grpB = banks.slice(16, 20);
      const reqs = [[], []];
      for (let g = 0; g < 2; g++) for (let k = 0; k < 4; k++) {
        const r = document.createElement("div");
        r.className = "s02-req";
        r.textContent = "行 " + (k * 2 + g);
        r.style.left = BX(g ? 16 : 0) + "px";
        r.style.top = (560 - 72 * k) + "px";
        $("reqs").appendChild(r); reqs[g].push(r);
      }
      const T = kitTower($("tower"));
      const L = T.layer, smBox = $("tower-sm");
      const clLen = $("cl").getTotalLength();

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set([$("tbfill"), $("tbghost")], { scaleX: 11.78 / 16 });
      gsap.set($("tbghost"), { opacity: 0 });
      gsap.set($("tbnum"), { x: 11.78 * 45 + 12 });
      gsap.set($("tb"), { opacity: 0 });
      gsap.set([$("cubesvg"), $("warpl")], { opacity: 0 });
      gsap.set([...dots, ...wires], { opacity: 0 });
      gsap.set([L.tc, L.reg, L.smem, L.l2, L.hbm, smBox, $("oreg"), $("osm"), $("car"), $("twice")], { opacity: 0 });
      gsap.set($("twin"), { x: -540 });
      gsap.set([$("bkl"), $("tdl"), $("res1"), $("res2"), $("fix"), $("rowa"), $("rowb"), $("rnd"), $("bneck"), ...banks, ...tds, ...reqs[0], ...reqs[1]], { opacity: 0 });
      gsap.set(lines, { strokeDasharray: 236, strokeDashoffset: 236 });
      gsap.set($("cl"), { strokeDasharray: clLen, strokeDashoffset: clLen });
      gsap.set([$("q1"), $("q2"), $("q3"), $("q4")], { opacity: 0 });

      // ---------- 0.0 标题卡；1.0 缩到左上 ----------
      ft($("chip"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 0.08);
      ft($("ttl"), { scale: 1, y: 0, transformOrigin: "0 0" }, { scale: 0.72, y: -12, transformOrigin: "0 0", duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("tb"), 1.05);

      // ---------- 第 1 句：16 × 16 × 16，一个 warp 合算 ----------
      ft($("cubesvg"), { opacity: 0, scale: 0.6, transformOrigin: "240px 230px" }, { opacity: 1, scale: 1, duration: 0.7, ease: IN }, 1.15);
      dots.forEach((d, i) => ft(d, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 3.4 + i * 0.025));
      wires.forEach((w, i) => ft(w, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 4.3 + Math.abs(i - 15.5) * 0.015));
      ft($("warpl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 4.4);
      // 一起发：32 个点同时亮一下，立方体同时跳一下（两次）
      [5.8, 7.6, 9.4].forEach((t) => {
        ft(dots, { scale: 1 }, { scale: 1.5, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, t);
        ft($("cubesvg"), { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, t + 0.05);
      });
      [$("cubesvg"), $("warpl"), $("dots"), $("wires")].forEach((e) => fadeOut(e, B[1]));

      // ---------- 第 2 句：塔进场，数据先进寄存器、再写共享内存、又读回寄存器 ----------
      ["hbm", "l2", "smem", "reg", "tc"].forEach((id, i) =>
        ft(L[id], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, B[1] + 0.2 + i * 0.07));
      fadeIn(smBox, B[1] + 0.55);
      const LY = { tc: 362, reg: 486, smem: 610, l2: 752, hbm: 876 }, PX = 1656;
      gsap.set($("car"), { xPercent: -50, yPercent: -50, x: PX, y: LY.hbm, scale: 0 });
      ft($("car"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: IN }, B[1] + 0.6);
      const hop = (n, from, to, lane, t, dur) => {
        const pts = [[PX, LY[from]], [lane, LY[from]], [lane, LY[to]], [PX, LY[to]]];
        const seg = [0];
        for (let i = 1; i < pts.length; i++) seg.push(seg[i - 1] + Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]));
        const len = seg[seg.length - 1], kf = { easeEach: "none" };
        pts.forEach((p, i) => { kf[((seg[i] / len) * 100).toFixed(3) + "%"] = { x: p[0], y: p[1] }; });
        const path = $("r" + n);
        path.setAttribute("d", "M " + pts.map((p) => p.join(" ")).join(" L "));
        gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
        tl.to($("car"), { keyframes: kf, duration: dur, ease: "power1.inOut" }, t);
        ft(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, t);
      };
      const H = [B[1] + 0.9, B[1] + 2.0, B[1] + 3.1, B[1] + 4.2, B[1] + 5.3];
      hop(1, "hbm", "l2", 1700, H[0], 0.7);
      hop(2, "l2", "reg", 1700, H[1], 0.8);
      ft($("oreg"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, H[1] + 0.7);
      hop(3, "reg", "smem", 1728, H[2], 0.7);
      hop(4, "smem", "reg", 1756, H[3], 0.8);
      ft($("oreg"), { scale: 1 }, { scale: 1.06, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, H[3] + 0.7);
      ft($("twice"), { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.45, ease: IN }, H[3] + 0.7);
      hop(5, "reg", "tc", 1700, H[4], 0.7);
      // 塔从中间让到右侧，左边留给 bank
      fadeOut($("twice"), B[2], 0.3);
      ft($("twin"), { x: -540 }, { x: 0, duration: 0.8, ease: MOVE }, B[2] + 0.1);

      // ---------- 第 3 句：塔变暗只留共享内存；放大成 32 个 bank ----------
      const b3 = B[2];
      fadeOut($("car"), b3, 0.3);
      ["tc", "l2", "hbm"].forEach((id) => ft(L[id], { opacity: 1 }, { opacity: 0.3, duration: 0.5, ease: MOVE }, b3 + 0.1));
      ft([$("r1"), $("r2"), $("r3"), $("r4"), $("r5"), $("oreg")], { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: MOVE }, b3 + 0.1);
      fadeIn($("osm"), b3 + 0.3, 0.4);
      banks.forEach((c, b) => ft(c, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, b3 + 0.7 + b * 0.012));
      fadeIn($("bkl"), b3 + 0.8, 0.4);
      fadeIn($("tdl"), b3 + 0.8, 0.4);
      tds.forEach((d, b) => ft(d, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: IN }, b3 + 0.8 + b * 0.015));
      // 一轮：32 个地址各落一个 bank，全部同时完成（绿）
      ft(lines, { strokeDashoffset: 236 }, { strokeDashoffset: 0, duration: 0.45, ease: "power1.in" }, b3 + 1.1);
      ft(banks, { backgroundColor: C_BK }, { backgroundColor: C_OK, duration: 0.2, ease: "none" }, b3 + 1.5);
      ft($("res1"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, b3 + 1.5);
      // 第 20 个线程改指向 bank 4：与第 4 个线程撞同一 bank，排成两轮
      const b3c = b3 + 2.6;
      fadeOut($("res1"), b3c - 0.1, 0.3);
      ft(banks, { backgroundColor: C_OK }, { backgroundColor: C_BK, duration: 0.25, ease: "none" }, b3c - 0.1);
      fadeOut(lines[20], b3c, 0.3);
      ft(tds[20], { backgroundColor: "#2350d8" }, { backgroundColor: C_RED, duration: 0.2, ease: "none" }, b3c);
      ft($("cl"), { strokeDashoffset: clLen }, { strokeDashoffset: 0, duration: 0.45, ease: "power1.in" }, b3c + 0.15);
      ft(banks.filter((_, b) => b !== 4 && b !== 20), { backgroundColor: C_BK }, { backgroundColor: C_OK, duration: 0.2, ease: "none" }, b3c + 0.6);
      ft(banks[4], { backgroundColor: C_BK }, { backgroundColor: C_RED, duration: 0.2, ease: "none" }, b3c + 0.6);
      ft($("res2"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, b3c + 0.65);
      // 第 1 轮完成：其余地址退场；第 2 轮：轮到第 20 个线程
      ft(lines.filter((_, b) => b !== 20), { opacity: 1 }, { opacity: 0.2, duration: 0.3, ease: OUT }, b3c + 1.4);
      ft(banks.filter((_, b) => b !== 4 && b !== 20), { backgroundColor: C_OK }, { backgroundColor: C_BK, duration: 0.3, ease: "none" }, b3c + 1.4);
      ft(banks[4], { backgroundColor: C_RED }, { backgroundColor: C_OK, duration: 0.2, ease: "none" }, b3c + 1.9);
      // 上一篇的做法（warp 分块）：地址重新错开，一轮读完
      const b3f = b3 + 5.3;
      fadeOut($("res2"), b3f, 0.3);
      fadeOut($("cl"), b3f, 0.3);
      ft(tds[20], { backgroundColor: C_RED }, { backgroundColor: "#2350d8", duration: 0.2, ease: "none" }, b3f + 0.1);
      ft(lines[20], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, b3f + 0.2);
      ft(lines.filter((_, b) => b !== 20), { opacity: 0.2 }, { opacity: 1, duration: 0.3, ease: IN }, b3f + 0.2);
      ft(banks.filter((_, b) => b !== 4), { backgroundColor: C_BK }, { backgroundColor: C_OK, duration: 0.2, ease: "none" }, b3f + 0.4);
      ft($("fix"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, b3f + 0.3);

      // ---------- 第 4 句：一行 64 字节 = 半排 bank；8 行的同一块叠在 2 组，分 4 轮 ----------
      const b4 = B[3];
      [$("tdl"), $("tds"), $("lines")].forEach((e) => fadeOut(e, b4));
      fadeOut($("fix"), b4 + 0.2);
      ft(banks, { backgroundColor: C_OK }, { backgroundColor: C_BK, duration: 0.3, ease: "none" }, b4);
      ft($("rowa"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, b4 + 1.8);
      ft($("rowb"), { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.45, ease: IN }, b4 + 2.2);
      ft(banks.slice(0, 16), { backgroundColor: C_BK }, { backgroundColor: C_WARP, duration: 0.3, ease: "none" }, b4 + 1.9);
      ft(banks.slice(16), { backgroundColor: C_BK }, { backgroundColor: C_OK, duration: 0.3, ease: "none" }, b4 + 2.3);
      // 8 行的同一块：只落在 bank 0–3 与 16–19
      const b4g = b4 + 4.4;
      fadeOut([$("rowa"), $("rowb")], b4g - 0.1, 0.3);
      ft(banks, { backgroundColor: (i) => (i < 16 ? C_WARP : C_OK) }, { backgroundColor: (i) => ((i < 4 || (i >= 16 && i < 20)) ? C_WARP : C_BK), duration: 0.3, ease: "none" }, b4g);
      [0, 1, 2, 3].forEach((k) => {
        ft([reqs[0][k], reqs[1][k]], { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, b4g + 0.2 + k * 0.08);
      });
      fadeIn($("rnd"), b4g + 0.7, 0.3);
      // 每轮：最下面的一对请求落进 bank，其余往下挪一格
      for (let r = 0; r < 4; r++) {
        const t = b4g + 0.8 + r * 0.65;
        for (let g = 0; g < 2; g++) {
          for (let k = r; k < 4; k++) {
            const y0 = 72 * r;
            if (k === r) ft(reqs[g][k], { y: y0, opacity: 1 }, { y: 140 + 72 * k, opacity: 0, duration: 0.45, ease: "power2.in" }, t);
            else ft(reqs[g][k], { y: y0 }, { y: y0 + 72, duration: 0.45, ease: MOVE }, t);
          }
        }
        ft([...grpA, ...grpB], { backgroundColor: C_WARP }, { backgroundColor: C_HOT, duration: 0.12, ease: "none", yoyo: true, repeat: 1 }, t + 0.35);
        if (r > 0) ft($("q" + r), { opacity: 1 }, { opacity: 0, duration: 0.05 }, t + 0.35);
        ft($("q" + (r + 1)), { opacity: 0 }, { opacity: 1, duration: 0.05 }, t + 0.35);
      }
      ft($("bneck"), { opacity: 0, scale: 0.85, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, b4g + 3.3);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["s02"] = tl;
    })();
  </script>
</template>
