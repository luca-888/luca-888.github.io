  <script>
    (function () {
      const $ = (k) => document.getElementById("s02-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);

      const B = [1.0, 6.29, 10.24, 16.83], DUR = 21.43;

      // ---------- 生成的静态子元素 ----------
      const dots = [], wires = [];
      const svgNS = "http://www.w3.org/2000/svg";
      for (let i = 0; i < 32; i++) {
        const x = 453 + i * 32;
        const d = document.createElement("div");

        $("dots").appendChild(d); dots.push(d);
        const w = document.createElementNS(svgNS, "path");
        w.setAttribute("d", `M ${x + 11} 758 L 960 652`);
        w.setAttribute("stroke", "var(--warp)"); w.setAttribute("stroke-width", "2");
        $("wires").appendChild(w); wires.push(w);
      }
      const banks = [];
      for (let b = 0; b < 32; b++) {
        const c = document.createElement("div");
        c.className = "s02-bk"; c.style.left = (96 + b * 32) + "px";
        $("banks").appendChild(c); banks.push(c);
      }
      const grpA = banks.slice(0, 8), grpB = banks.slice(16, 24);
      // 8 个读请求：偶数行落在 bank 0–7，奇数行落在 bank 16–23，各叠 4 个
      const reqs = [[], []];
      for (let g = 0; g < 2; g++) for (let k = 0; k < 4; k++) {
        const r = document.createElement("div");
        r.className = "s02-req";
        r.textContent = "行 " + (k * 2 + g);
        r.style.left = (g ? 96 + 16 * 32 : 96) + "px";
        r.style.top = (560 - 72 * k) + "px";
        $("reqs").appendChild(r); reqs[g].push(r);

      const T = kitTower($("tower"));

      gsap.set([...dots, ...wires], { opacity: 0 });
      gsap.set([$("pct"), $("bn1"), $("bn2"), $("bv1"), $("bv2")], { opacity: 0 });
      gsap.set([$("bar1"), $("bar2")], { scaleX: 0 });
      gsap.set([L.tc, L.reg, L.smem, L.l2, L.hbm, smBox, $("oreg"), $("osm"), $("car")], { opacity: 0 });
      gsap.set(document.querySelectorAll("#s02-path .s02-row, #s02-path .s02-trip, #s02-two"), { opacity: 0 });
      gsap.set([$("bkh"), $("bkl"), $("rnd"), $("bneck"), ...banks, ...reqs[0], ...reqs[1]], { opacity: 0 });
      gsap.set([$("q1"), $("q2"), $("q3"), $("q4")], { opacity: 0 });

      // ---------- 0.0 标题卡；1.0 缩到左上 ----------
      ft($("chip"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 0.08);
      ft($("ttl"), { scale: 1, y: 0, transformOrigin: "0 0" }, { scale: 0.72, y: -12, transformOrigin: "0 0", duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("tb"), 1.05);

      // ---------- 第 1 句：16 × 16 × 16，一个 warp 合算 ----------
      ft($("cubesvg"), { opacity: 0, scale: 0.6, transformOrigin: "240px 230px" }, { opacity: 1, scale: 1, duration: 0.7, ease: IN }, 1.15);
      ft($("cubek"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 1.9);
      dots.forEach((d, i) => ft(d, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 2.7 + i * 0.025));
      wires.forEach((w, i) => ft(w, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 3.6 + Math.abs(i - 15.5) * 0.015));
      ft($("warpl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 3.7);
      // 一起发：32 个点同时亮一下，立方体同时跳一下
      ft(dots, { scale: 1 }, { scale: 1.5, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 4.8);
      ft($("cubesvg"), { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 4.85);
      [$("cubesvg"), $("cubek"), $("warpl"), $("dots"), $("wires")].forEach((e) => fadeOut(e, B[1]));

      // ---------- 第 2 句：耗时条闪一下；只有 cuBLAS 的 12% ----------
      ft($("tbfill"), { backgroundColor: "#3a3a3a" }, { backgroundColor: "#c4561d", duration: 0.25, ease: "power2.out", yoyo: true, repeat: 3 }, B[1] + 0.1);
      ft($("tbnum"), { scale: 1, transformOrigin: "0 50%" }, { scale: 1.25, transformOrigin: "0 50%", duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, B[1] + 0.1);
      ft($("bn1"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, B[1] + 0.3);
      ft($("bar1"), { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: MOVE }, B[1] + 0.4);
      fadeIn($("bv1"), B[1] + 1.2, 0.4);
      ft($("bn2"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, B[1] + 1.1);
      ft($("bar2"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: MOVE }, B[1] + 1.2);
      fadeIn($("bv2"), B[1] + 1.55, 0.4);
      ft($("pct"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, B[1] + 1.6);
      fadeOut($("cmp"), B[2]);

      // ---------- 第 3 句：塔进场，数据先进寄存器、再写共享内存、又读回寄存器 ----------

        ft(L[id], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, B[2] + 0.1 + i * 0.07));

      const LY = { tc: 362, reg: 486, smem: 610, l2: 752, hbm: 876 }, PX = 1656;
      gsap.set($("car"), { xPercent: -50, yPercent: -50, x: PX, y: LY.hbm, scale: 0 });
      ft($("car"), { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: IN }, B[2] + 0.5);
      const hop = (n, from, to, lane, t, dur) => {
        const pts = [[PX, LY[from]], [lane, LY[from]], [lane, LY[to]], [PX, LY[to]]];
        const seg = [0];
        for (let i = 1; i < pts.length; i++) seg.push(seg[i - 1] + Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]));
        const len = seg[seg.length - 1], kf = { easeEach: "none" };
        pts.forEach((p, i) => { kf[((seg[i] / len) * 100).toFixed(3) + "%"] = { x: p[0], y: p[1] }; });
        const path = $("r" + n);
        path.setAttribute("d", "M " + pts.map((p) => p.join(" ")).join(" L "));
        gsap.set(path, { strokeDasharray: len, strokeDashoffset: len });
        tl.to($("car"), { keyframes: kf, duration: dur, ease: "power1.inOut" }, t);
        ft(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, t);
      };
      const row = (k, t) => ft($("p" + k), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: IN }, t);
      const H = [B[2] + 0.8, B[2] + 1.75, B[2] + 2.75, B[2] + 3.7, B[2] + 4.7];
      hop(1, "hbm", "l2", 1700, H[0], 0.7); row(1, H[0]);
      hop(2, "l2", "reg", 1700, H[1], 0.8); row(2, H[1]);
      ft($("oreg"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, H[1] + 0.7);
      fadeIn($("t1"), H[1] + 0.7, 0.4);
      hop(3, "reg", "smem", 1728, H[2], 0.7); row(3, H[2]);
      hop(4, "smem", "reg", 1756, H[3], 0.8); row(4, H[3]);
      ft($("oreg"), { scale: 1 }, { scale: 1.06, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, H[3] + 0.7);
      fadeIn($("t2"), H[3] + 0.7, 0.4);
      hop(5, "reg", "tc", 1700, H[4], 0.7); row(5, H[4]);
      ft($("two"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, B[2] + 5.0);
      document.querySelectorAll("#s02-path .s02-row, #s02-path .s02-trip").forEach((e) => fadeOut(e, B[3]));
      fadeOut($("two"), B[3] + 0.5);

      // ---------- 第 4 句：塔缩小靠右；共享内存 bank 放大，分 4 轮 ----------
      fadeOut($("car"), B[3], 0.3);
      ["tc", "l2", "hbm"].forEach((id) => ft(L[id], { opacity: 1 }, { opacity: 0.3, duration: 0.5, ease: MOVE }, B[3] + 0.1));
      ft([$("r1"), $("r2"), $("r3"), $("r4"), $("r5"), $("oreg")], { opacity: 1 }, { opacity: 0.25, duration: 0.5, ease: MOVE }, B[3] + 0.1);
      fadeIn($("osm"), B[3] + 0.3, 0.4);
      ft($("bkh"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, B[3] + 0.15);
      banks.forEach((c, b) => ft(c, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, B[3] + 0.2 + b * 0.012));
      fadeIn($("bkl"), B[3] + 0.4, 0.4);
      ft([...grpA, ...grpB], { backgroundColor: "#e6e0d3" }, { backgroundColor: "#a9c2ee", duration: 0.3, ease: IN }, B[3] + 0.5);
      [0, 1, 2, 3].forEach((k) => {
        ft([reqs[0][k], reqs[1][k]], { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, B[3] + 0.4 + k * 0.08);
      });
      fadeIn($("rnd"), B[3] + 0.85, 0.3);
      // 每轮：最下面的一对请求落进 bank，其余往下挪一格
      for (let r = 0; r < 4; r++) {
        const t = B[3] + 0.9 + r * 0.6;
        for (let g = 0; g < 2; g++) {
          for (let k = r; k < 4; k++) {
            const y0 = 72 * r;
            if (k === r) ft(reqs[g][k], { y: y0, opacity: 1 }, { y: 140 + 72 * k, opacity: 0, duration: 0.45, ease: "power2.in" }, t);
            else ft(reqs[g][k], { y: y0 }, { y: y0 + 72, duration: 0.45, ease: MOVE }, t);
          }
