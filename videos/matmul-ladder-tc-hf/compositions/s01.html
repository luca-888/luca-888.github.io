  <script>
    (function () {
      const $ = (k) => document.getElementById("s01-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const rise = (el, t) => ft(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: IN }, t);

      // 装饰：132 个 SM 格（上下各 66 = 6 行 × 11 列），不计时
      const cells = $("cells"), sms = [];
      [176, 556].forEach((y0, half) => {
        for (let r = 0; r < 6; r++) for (let c = 0; c < 11; c++) {
          const d = document.createElement("div");
          d.className = "s01-sm";
          d.style.left = 476 + c * 88 + "px"; d.style.top = y0 + r * 48 + "px";
          cells.appendChild(d); sms.push({ el: d, k: half * 6 + r, c });
        }
      });

      // ---------- 镜头 A：芯片 ----------
      gsap.set(sms.map((s) => s.el), { opacity: 0 });
      gsap.set([$("l2"), $("hl1"), $("hl2"), $("smhi")], { opacity: 0 });
      gsap.set([0, 1, 2, 3, 4, 5].map((i) => $("h" + i)), { opacity: 0 });
      gsap.set($("die"), { opacity: 1 });
      sms.forEach((s) => ft(s.el, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, 0.9 + (s.k * 11 + s.c) * 0.012));
      ft($("l2"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: IN }, 4.4);
      [0, 1, 2, 3, 4, 5].forEach((i) => ft($("h" + i), { opacity: 0, x: i < 3 ? -40 : 40 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 6.2 + (i % 3) * 0.1));
      fadeIn([$("hl1"), $("hl2")], 6.5);
      // 选中一个 SM，镜头推进
      ft($("smhi"), { opacity: 0, scale: 1.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, 9.4);
      ft($("Ain"), { scale: 1, opacity: 1 }, { scale: 4, opacity: 0, transformOrigin: "956px 293px", duration: 0.9, ease: "power2.in" }, 9.85);

      // ---------- 镜头 B：一个 SM ----------
      ft($("smw"), { opacity: 0, scale: 0.09, x: -4, y: -207, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.9, ease: "power2.out" }, 9.95);
      gsap.set([$("p0"), $("p1"), $("p2"), $("p3"), $("smem")], { opacity: 0 });
      [0, 1, 2, 3].forEach((i) => rise($("p" + i), 11.0 + i * 0.25));
      const tcs = Array.from(document.querySelectorAll("#s01-smw .s01-tcb"));
      ft(tcs, { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.12, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 12.9);
      ft($("smem"), { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: IN }, 14.0);
      fadeOut($("Bin"), 16.4);

      // ---------- 镜头 C：一个乘加 vs 一整块 ----------
      gsap.set([$("cl1"), $("cl2"), $("cr1"), $("ta"), $("tx"), $("tw"), $("tar"), $("tcw"), $("tc")], { opacity: 0 });
      rise($("cl1"), 16.7);
      rise($("cl2"), 17.0);
      rise($("cr1"), 19.0);
      ft([$("ta"), $("tw")], { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN, stagger: 0.15 }, 19.3);
      fadeIn([$("tx"), $("tar"), $("tcw")], 19.6, 0.4);
      ft($("tc"), { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 20.4);
      fadeOut($("Cin"), 22.3);

      // ---------- 镜头 D：128 对 2048 ----------
      gsap.set([$("dl1"), $("dots1"), $("dl2"), $("dots2"), $("x16")], { opacity: 0 });
      rise([$("dl1"), $("dots1")], 22.8);
      fadeIn([$("dl2"), $("dots2")], 23.8, 0.2);
      ft($("cover"), { scaleY: 1 }, { scaleY: 0, duration: 1.6, ease: "power1.inOut" }, 23.9);
      ft($("x16"), { opacity: 0, scale: 0.7, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 25.9);
      fadeOut($("Din"), 28.0);

      // ---------- 镜头 E：显存 → L2 → 共享内存 → Tensor Core ----------
      const T = kitTower($("tower"), { inSM: 0, layers: [
        { id: "tc", name: "Tensor Core", note: "", color: "var(--teal)" },
        { id: "smem", name: "共享内存", note: "", color: "var(--use)" },
        { id: "l2", name: "L2", note: "", color: "var(--blue)" },
        { id: "hbm", name: "显存", note: "", color: "var(--hot)" },
      ] });
      const path = T.route("s01-route", ["hbm", "l2", "smem", "tc"], { color: "var(--blue)", width: 6 });
      const hops = ["hbm", "l2", "smem", "tc"].map((k) => T.at(k));
      const lys = ["tc", "smem", "l2", "hbm"].map((k) => T.layer[k]);
      gsap.set(lys, { opacity: 0 });
      gsap.set($("blk"), { opacity: 0, x: hops[0].x - 22, y: hops[0].y - 22 });
      ft($("tower"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 28.25);
      ["hbm", "l2", "smem", "tc"].forEach((k, i) => rise(T.layer[k], 28.3 + i * 0.3));
      ft(path, { strokeDashoffset: path.dataset.len }, { strokeDashoffset: 0, duration: 3.6, ease: "none" }, 30.0);
      ft($("blk"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 30.0);
      [1, 2, 3].forEach((i) => ft($("blk"), { x: hops[i - 1].x - 22, y: hops[i - 1].y - 22 }, { x: hops[i].x - 22, y: hops[i].y - 22, duration: 1.1, ease: MOVE }, 30.1 + (i - 1) * 1.2));
      ft(T.layer.tc, { scale: 1 }, { scale: 1.05, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 50%" }, 33.7);
      fadeOut($("Ein"), 38.4);

      // ---------- 镜头 F：9% 在算，其余在等 ----------
      gsap.set([$("bhd"), $("btrk"), $("busyl"), $("wait"), $("say")], { opacity: 0 });
      gsap.set([$("busy"), $("idle")], { scaleX: 0 });
      fadeIn([$("bhd"), $("btrk")], 38.9);
      ft($("busy"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: IN }, 39.3);
      rise($("busyl"), 39.6);
      ft($("idle"), { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power2.out" }, 41.6);
      ft($("wait"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 43.4);
      fadeOut($("Fin"), 45.5);
      // 大耗时条（2 倍居中）→ 最后停靠右上角，与 s02 一致
      const BIG = { x: -144, y: 436, scale: 2 };
      gsap.set($("tb"), { transformOrigin: "100% 0%", ...BIG, opacity: 0 });
      gsap.set($("tbfill"), { scaleX: 0 });
      gsap.set($("tbnum"), { x: 12 });
      ft($("tb"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 45.7);
      const ms = { v: 0 };
      ft(ms, { v: 0 }, { v: 11.78, duration: 1.0, ease: "power2.out", onUpdate: () => {
        gsap.set($("tbfill"), { scaleX: ms.v / 16 });
        gsap.set($("tbnum"), { x: ms.v * 45 + 12 });
        $("tbnum").textContent = ms.v.toFixed(2) + " ms";
      } }, 45.8);
      rise($("say"), 46.0);
      fadeOut($("say"), 47.05, 0.3);
      ft($("tb"), BIG, { x: 0, y: 0, scale: 1, duration: 0.8, ease: MOVE }, 47.05);

      tl.set({}, {}, 47.98);
      window.__timelines["s01"] = tl;
    })();
  </script>
