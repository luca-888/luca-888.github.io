      </div>

  <script>
    (function () {
      // ---------- 立方体几何（等轴测，中心 (1240,470)，宽 360） ----------
      var A = 208, C = A * Math.cos(Math.PI / 6), S = A / 2, N = 16;
      var P = { top: [0, -A], ur: [C, -S], lr: [C, S], bot: [0, A], ll: [-C, S], ul: [-C, -S], ctr: [0, 0] };
      function pts(a) { return a.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
      function add(p, q, k) { return [p[0] + q[0] * k, p[1] + q[1] * k]; }
      function sub(p, q) { return [p[0] - q[0], p[1] - q[1]]; }
      function grid(O, U, V) {
        var d = "";
        for (var k = 1; k < N; k++) {
          var a = add(O, U, k / N), b = add(a, V, 1);
          var c = add(O, V, k / N), e = add(c, U, 1);
          d += "M" + a[0].toFixed(1) + " " + a[1].toFixed(1) + "L" + b[0].toFixed(1) + " " + b[1].toFixed(1);
          d += "M" + c[0].toFixed(1) + " " + c[1].toFixed(1) + "L" + e[0].toFixed(1) + " " + e[1].toFixed(1);
        }
        return d;
      }
      var faces = {
        top: { O: P.ul, U: sub(P.top, P.ul), V: sub(P.ctr, P.ul) },
        left: { O: P.ul, U: sub(P.ctr, P.ul), V: sub(P.ll, P.ul) },
        right: { O: P.ctr, U: sub(P.ur, P.ctr), V: sub(P.bot, P.ctr) }
      };
      function quad(f) { return [f.O, add(f.O, f.U, 1), add(add(f.O, f.U, 1), f.V, 1), add(f.O, f.V, 1)]; }
      function center(f) { return add(add(f.O, f.U, 0.5), f.V, 0.5); }
      var $ = function (id) { return document.getElementById(id); };
      $("s01-f-top").setAttribute("points", pts(quad(faces.top)));
      $("s01-f-left").setAttribute("points", pts(quad(faces.left)));
      $("s01-f-right").setAttribute("points", pts(quad(faces.right)));
      $("s01-f-grid").setAttribute("d", grid(faces.top.O, faces.top.U, faces.top.V) + grid(faces.left.O, faces.left.U, faces.left.V) + grid(faces.right.O, faces.right.U, faces.right.V));
      $("s01-f-edge").setAttribute("d", "M" + pts([P.ul, P.ctr, P.ur]).replace(/ /g, "L") + "M0,0L" + P.bot[0] + "," + P.bot[1]);
      var slices = { sa: faces.left, sb: faces.top, sc: faces.right };
      Object.keys(slices).forEach(function (k) {
        var f = slices[k], c = center(f);
        $("s01-" + k + "-p").setAttribute("points", pts(quad(f)));
        $("s01-" + k + "-g").setAttribute("d", grid(f.O, f.U, f.V));
        $("s01-" + k + "-t").setAttribute("x", c[0].toFixed(1));
        $("s01-" + k + "-t").setAttribute("y", c[1].toFixed(1));
      });
      // 三片沿各自法线向外分开（屏幕方向）
      var D = 120, cos = Math.cos(Math.PI / 6), sin = 0.5;
      var off = { sa: [-cos * D, sin * D], sb: [0, -D], sc: [cos * D, sin * D] };

      // ---------- 点 ----------
      var host = $("s01-dots-in"), dots = [];
      for (var i = 0; i < 32; i++) {
        var el = document.createElement("div");
        el.className = "s01-dot";
        el.id = "s01-dot-" + i;
        el.style.left = (160 + 50 * i) + "px";
        el.style.top = "452px";
        host.appendChild(el);
        dots.push(el);
      }
      function rowC(i) { return [178 + 50 * i, 470]; }
      function cluC(i) { return [173 + 34 * (i % 8), 415 + 34 * Math.floor(i / 8)]; }
      function g128C(i) { return [166 + 12 * (i % 8), 266 + 12 * Math.floor(i / 8)]; }

      var tl = gsap.timeline({ paused: true });

      // ===== 0.0 封面：一个点 =====
      tl.fromTo(dots[0], { scale: 2.2 }, { scale: 1, duration: 0.6, ease: "power2.inOut" }, 0.5);
      tl.fromTo("#s01-cover-lbl-in", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.4);

      // ===== 0.5 一排 32 个点逐个亮满；进度条停在 44.3 =====
      tl.fromTo(dots.slice(1), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.07 }, 0.75);
      tl.fromTo("#s01-row-lbl-in", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 1.75);
      tl.fromTo("#s01-meter-in", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 1.0);
      tl.fromTo("#s01-meter-fill", { scaleX: 0 }, { scaleX: 44.3 / 781.86, duration: 0.8, ease: "power2.inOut" }, 1.3);
      tl.fromTo("#s01-meter-num", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 1.9);
      tl.fromTo("#s01-meter-note", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 3.6);

      // ===== 5.9 点阵退到左侧缩小；立方体一次点亮；A/B/C 三片贴上 =====
      tl.fromTo("#s01-meter-in", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 5.9);
      tl.fromTo("#s01-row-lbl-in", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 5.9);
      dots.forEach(function (d, i) {
        var r = rowC(i), c = cluC(i);
        tl.fromTo(d, { x: 0, y: 0, scale: 1 }, { x: c[0] - r[0], y: c[1] - r[1], scale: 26 / 36, duration: 1.0, ease: "power2.inOut", immediateRender: false }, 5.9 + i * 0.008);
      });
      tl.fromTo("#s01-clu-lbl-in", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 6.8);
      tl.fromTo("#s01-cubeg", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, transformOrigin: "300px 340px", duration: 0.7, ease: "power3.out" }, 6.05);
      ["sb", "sa", "sc"].forEach(function (k, j) {
        var o = off[k];
        tl.fromTo("#s01-" + k, { opacity: 0, x: o[0] * 1.8, y: o[1] * 1.8 }, { opacity: 1, x: o[0], y: o[1], duration: 0.6, ease: "power3.out" }, 6.6 + j * 0.15);
      });
      tl.fromTo("#s01-cube-lbl-in", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 7.0);

      // ===== 12.9 同一点距：128 对 2048 =====
      tl.fromTo(["#s01-sa", "#s01-sb", "#s01-sc"], { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 12.9);
      tl.fromTo("#s01-cube-lbl-in", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 12.9);
      tl.fromTo("#s01-clu-lbl-in", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 12.9);
      tl.fromTo("#s01-cubeg", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 13.0);
      dots.forEach(function (d, i) {
        var r = rowC(i), g = g128C(i);
        tl.fromTo(d, { x: cluC(i)[0] - r[0], y: cluC(i)[1] - r[1], scale: 26 / 36 }, { x: g[0] - r[0], y: g[1] - r[1], scale: 9 / 36, duration: 0.9, ease: "power2.inOut", immediateRender: false }, 12.9);
      });
      tl.fromTo(["#s01-q1", "#s01-q2", "#s01-q3"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.12 }, 13.5);
      tl.fromTo("#s01-g128-lbl-in", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 13.6);
      tl.fromTo("#s01-g2048-svg", { clipPath: "inset(0px 0px 384px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 1.3, ease: "power1.inOut" }, 14.0);
      tl.fromTo("#s01-g2048-lbl-in", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 14.2);
      tl.fromTo("#s01-g2048-cut", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 16.1);
      tl.fromTo("#s01-x16-in", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, transformOrigin: "0% 50%", duration: 0.6, ease: "power3.out" }, 16.3);

      // ===== 17.4 收成交接画面：立方体在右、16 倍在左 =====
      tl.fromTo(["#s01-dots-in", "#s01-g128", "#s01-g128-lbl-in", "#s01-g2048-lbl-in"], { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, 17.4);
      tl.fromTo("#s01-g2048-svg", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.47, transformOrigin: "50% 50%", duration: 0.7, ease: "power2.inOut", immediateRender: false }, 17.55);
      tl.fromTo("#s01-cubeg", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, transformOrigin: "300px 340px", duration: 0.75, ease: "power2.inOut", immediateRender: false }, 17.65);
      tl.fromTo("#s01-x16-in", { y: 0 }, { y: -60, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 17.5);

      tl.set({}, {}, 19.0);
      window.__timelines["s01"] = tl;
    })();
  </script>
