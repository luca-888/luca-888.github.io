<template>
  <!--

    tile 图（与 s06 同一朝向）：8192 阶 C 按 128 × 256 切成 64 行 × 32 列 tile，画成转置：
      横向 = tile 行 m（x = 40 + 25m），纵向 = tile 列 n（y = 18n），格 23 × 16；Wᵀ 边条在 x = 0。
      #s07-map 位于 left 96 / top 310，1640 × 576；第 2 句缩到 0.64 倍靠左上，右侧给 L2 扇出图。
  -->
  <style>
    #root { position: absolute; inset: 0; }
    #root .s07-full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root .s07-in { position: absolute; inset: 0; }
    #root .s07-abs { position: absolute; }
    #root .s07-st { position: absolute; left: 96px; font-size: 40px; font-weight: 700; color: var(--ink); white-space: nowrap; }
    #root .s07-lbl { position: absolute; font-size: 32px; font-weight: 600; color: var(--ink); white-space: nowrap; }
    #root .s07-note { position: absolute; font-size: 28px; font-weight: 500; color: var(--note); white-space: nowrap; }
    #root #s07-ttl { transform-origin: 0 0; }
    /* tile 图 */
    #root #s07-map { position: absolute; left: 96px; top: 310px; width: 1640px; height: 576px; transform-origin: 0 0; }
    #root #s07-cells, #root #s07-run { position: absolute; left: 40px; top: 0; width: 1600px; height: 576px; }
    #root #s07-wstrip { position: absolute; left: 0; top: 0; width: 23px; height: 576px; }
    #root .s07-c { position: absolute; width: 23px; height: 16px; background: var(--cell); }
    #root .s07-r { position: absolute; left: 0; top: 0; width: 23px; height: 16px; background: var(--purple); }
    #root .s07-w { position: absolute; left: 0; width: 23px; height: 16px; background: var(--yel); }
    #root #s07-colbox { position: absolute; left: 36px; top: -4px; width: 406px; height: 24px; border: 4px solid var(--ink); }
    #root #s07-wcur { position: absolute; left: -4px; top: -4px; width: 31px; height: 24px; border: 4px solid var(--ink); }
    #root #s07-runlbl { position: absolute; left: 290px; top: 560px; padding: 2px 10px; background: var(--paper); font-size: 32px; font-weight: 700; color: var(--purple-t); white-space: nowrap; }
    /* 扇出图 */
    #root .s07-ft { position: absolute; top: 322px; width: 30px; height: 30px; background: var(--purple); }
    #root #s07-tower { position: absolute; left: 1180px; top: 540px; width: 640px; height: 340px; }
    #root #s07-wb { position: absolute; left: 1580px; top: 771px; width: 48px; height: 48px; background: var(--yel); border: 2px solid var(--yel-t); }
    /* 结果 */
    #root .s07-bar { position: absolute; left: 340px; height: 100px; transform-origin: 0 50%; background: var(--hot); }
    #root .s07-val { position: absolute; font-family: var(--mono); font-size: 52px; font-weight: 800; color: var(--ink); white-space: nowrap; line-height: 100px; }
    #root .s07-rl { position: absolute; left: 96px; font-size: 36px; font-weight: 600; color: var(--ink2); white-space: nowrap; line-height: 100px; }
  </style>
  <div id="root" data-composition-id="s07" data-width="1920" data-height="1080">

    <!-- 0–1.0 标题卡；之后缩到左上角常驻 -->
    <div id="s07-title" class="clip s07-full" data-start="0.00" data-duration="20.10" data-track-index="1">
      <div id="s07-chip" class="kit-chip">wgmma_l2</div>
      <div id="s07-ttl" class="kit-title">第 6 步：<span class="acc">tile 发放顺序</span></div>
    </div>

    <!-- 耗时条：2.29 → 1.49 -->
    <div id="s07-tb" class="clip kit-tbar" data-start="1.00" data-duration="19.10" data-track-index="2">
      <div id="s07-tbin" class="s07-in">
        <div class="lbl">8192 阶矩阵乘法 · 一次耗时</div>
        <div class="track"><div id="s07-tbghost" class="ghost"></div><div id="s07-tbfill" class="fill"></div><div class="peak"></div></div>
        <div id="s07-tbnum" class="num">2.29 ms</div>
        <div id="s07-tbnum2" class="num">1.49 ms</div>
        <div class="ref">虚线：规格峰值 1.11 ms</div>
      </div>
    </div>

    <!-- 1.0 tile 图：按行发放 → 16 行一组；6.93 缩到左上 -->
    <div id="s07-mapc" class="clip s07-full" data-start="1.00" data-duration="12.50" data-track-index="3" data-layout-allow-overlap>
      <div id="s07-mapin" class="s07-full">
        <div id="s07-map">
          <div id="s07-wstrip"></div>
          <div id="s07-cells"></div>
          <div id="s07-run"></div>
          <div id="s07-colbox"></div>
          <div id="s07-wcur"></div>
        </div>
        <div id="s07-runlbl">同时运行的 132 个 tile</div>
        <div id="s07-axis" class="s07-note" style="left:96px;top:896px"><span style="color:var(--yel-t);font-weight:700">Wᵀ</span>　　C 的 tile：横向 64 行，纵向 32 列</div>
      </div>
    </div>

    <!-- 每句的要点（大字） -->
    <div id="s07-sts" class="clip s07-full" data-start="1.00" data-duration="12.50" data-track-index="4">
      <div id="s07-sA" class="s07-st" style="top:236px">按行发放：一轮占 4 行，读<span class="acc-y">整个 W</span></div>
      <div id="s07-sB" class="s07-st" style="top:236px">分组后：<span class="acc-p">16 行 × 8 列</span>，W 只用 9 块</div>
      <div id="s07-sC" class="s07-st" style="top:740px;font-size:44px">共用一块 <span class="acc-y">W</span> 的 16 个 tile 同时跑</div>
      <div id="s07-sD" class="s07-st" style="top:740px;font-size:44px"><span class="acc-y">W</span> 读进 L2 一次，被 <span class="acc-p">16 个 tile</span> 读走</div>
    </div>

    <!-- 6.93 L2 扇出：一块 W 进 L2，被 16 个 tile 读取 -->
    <div id="s07-fan" class="clip s07-full" data-start="6.93" data-duration="6.60" data-track-index="5" data-layout-allow-overlap>
      <div id="s07-fanin" class="s07-full">
        <div id="s07-ftl" class="s07-lbl" style="left:1200px;top:268px">同一列的 16 个 tile</div>
        <div id="s07-fts" class="s07-full"></div>
        <svg id="s07-fsvg" class="s07-full" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none"></svg>
        <div id="s07-tower"></div>
        <div id="s07-wb"></div>
        <div id="s07-once" class="s07-lbl" style="left:1676px;top:688px;color:var(--hot-t);font-weight:700">读一次</div>
      </div>
    </div>

    <!-- 13.08 显存读取 6.6 → 1.3 GB；1.49 ms，+54% -->
    <div id="s07-res" class="clip s07-full" data-start="13.08" data-duration="7.02" data-track-index="6">
      <div id="s07-rt" class="s07-abs" style="left:96px;top:330px;font-size:48px;font-weight:800;color:var(--ink);white-space:nowrap">一次乘法的显存读取</div>
      <div id="s07-r1" class="s07-full">
        <div class="s07-rl" style="top:450px">按行发放</div>
        <div id="s07-b1" class="s07-bar" style="top:450px;width:700px"></div>
        <div id="s07-v1" class="s07-val" style="left:1064px;top:450px">6.6 GB</div>
      </div>
      <div id="s07-r2" class="s07-full">
        <div class="s07-rl" style="top:640px">16 行一组</div>
        <div id="s07-b2" class="s07-bar" style="top:640px;width:700px"></div>
        <div id="s07-v2" class="s07-val" style="left:500px;top:640px;color:var(--use-t)">1.3 GB</div>
      </div>
      <div id="s07-gc" class="s07-abs" style="left:1392px;top:450px;font-size:44px;font-weight:700;color:var(--ink);white-space:nowrap">一步提速</div>
      <div id="s07-g" class="s07-abs" style="left:1380px;top:516px;font-family:var(--mono);font-size:168px;line-height:1;font-weight:800;color:var(--teal-t);white-space:nowrap">+54%</div>
    </div>
  </div>
  <script>
    (function () {
      const $ = (k) => document.getElementById("s07-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const NS = "http://www.w3.org/2000/svg";

      // ---------- tile 图 ----------
      const SX = 25, SY = 18;
      const cols = [];
      for (let m = 0; m < 64; m++) {
        const col = document.createElement("div");
        col.className = "s07-in";
        for (let n = 0; n < 32; n++) {
          const c = document.createElement("div");
          c.className = "s07-c";
          c.style.left = m * SX + "px"; c.style.top = n * SY + "px";
          col.appendChild(c);
        }
        $("cells").appendChild(col); cols.push(col);
      }
      const ws = [];
      for (let n = 0; n < 32; n++) {
        const w = document.createElement("div");
        w.className = "s07-w"; w.style.top = n * SY + "px";
        $("wstrip").appendChild(w); ws.push(w);
      }
      // 一轮 132 个 tile：按行 (m = k / 32, n = k % 32) → 分组 (m = k % 16, n = k / 16)
      const rowPos = (k) => [Math.floor(k / 32) * SX, (k % 32) * SY];
      const grpPos = (k) => [(k % 16) * SX, Math.floor(k / 16) * SY];
      const runs = [];
      for (let k = 0; k < 132; k++) {
        const r = document.createElement("div");
        r.className = "s07-r";
        $("run").appendChild(r); runs.push(r);
      }

      // ---------- 扇出图 ----------
      const T = kitTower($("tower"), {
        inSM: 0,
        layers: [
          { id: "l2", name: "L2", note: "50 MB · 全卡共享", color: "var(--blue)" },
          { id: "hbm", name: "显存 HBM", note: "3.35 TB/s", color: "var(--hot)" },
        ],
      });
      const fts = [], lines = [];
      for (let i = 0; i < 16; i++) {
        const t = document.createElement("div");
        t.className = "s07-ft"; t.style.left = 1200 + i * 36 + "px";
        $("fts").appendChild(t); fts.push(t);
        const x2 = 1215 + i * 36, y2 = 354, x1 = 1604, y1 = 600;
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", x1); ln.setAttribute("y1", y1);
        ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
        ln.setAttribute("stroke-width", 3);
        ln.style.stroke = "var(--yel-t)";
        const len = Math.hypot(x2 - x1, y2 - y1);
        ln.setAttribute("stroke-dasharray", len);
        ln.setAttribute("stroke-dashoffset", len);
        $("fsvg").appendChild(ln); lines.push([ln, len]);
      }

      // ---------- 耗时条 ----------
      const TBX = (ms) => ms * 45 + 12;
      gsap.set($("tbfill"), { scaleX: 2.29 / 16 });
      gsap.set($("tbghost"), { scaleX: 2.29 / 16, opacity: 0 });
      gsap.set($("tbnum"), { x: TBX(2.29) });
      gsap.set($("tbnum2"), { x: TBX(2.29), opacity: 0 });
      gsap.set($("tbin"), { opacity: 0 });

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set($("map"), { scale: 1, x: 0, y: 0 });
      gsap.set(cols, { opacity: 0 });
      gsap.set(ws, { opacity: 0 });
      runs.forEach((r, k) => { const p = rowPos(k); gsap.set(r, { x: p[0], y: p[1], opacity: 0 }); });
      gsap.set([$("colbox"), $("wcur"), $("runlbl"), $("axis")], { opacity: 0 });
      gsap.set([$("sA"), $("sB"), $("sC"), $("sD")], { opacity: 0 });
      gsap.set([$("ftl"), $("wb"), $("once"), T.layer.l2, T.layer.hbm], { opacity: 0 });
      gsap.set(fts, { opacity: 0 });
      gsap.set([$("rt"), $("r1"), $("r2"), $("v1"), $("v2"), $("gc"), $("g")], { opacity: 0 });
      gsap.set([$("b1"), $("b2")], { scaleX: 0 });

      // ---------- 0.0 标题卡 ----------
      ft($("chip"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 0.1);

      // ---------- 1.0 标题缩到左上；耗时条；tile 图按行发放 ----------
      ft($("ttl"), { x: 0, y: 0, scale: 1 }, { x: 0, y: -16, scale: 0.6, duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("tbin"), 1.0);
      cols.forEach((c, m) => ft(c, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 1.1 + m * 0.006));
      ws.forEach((w) => ft(w, { opacity: 0 }, { opacity: 0.3, duration: 0.4, ease: IN }, 1.3));
      fadeIn($("axis"), 1.4);
      // 编号流：按行发放的顺序逐个点亮
      runs.forEach((r, k) => ft(r, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: IN }, 1.6 + k * 0.009));
      fadeIn($("runlbl"), 2.2);
      fadeIn($("sA"), 1.6);
      // 用到整个 W：32 段全部点亮
      ws.forEach((w, n) => ft(w, { opacity: 0.3 }, { opacity: 1, duration: 0.25, ease: IN }, 2.6 + n * 0.02));

      // ---------- 4.0 每 16 行一组，组内按列：编号流按新顺序收拢 ----------
      fadeOut($("sA"), 4.0, 0.3);
      runs.forEach((r, k) => {
        const a = rowPos(k), b = grpPos(k);
        ft(r, { x: a[0], y: a[1] }, { x: b[0], y: b[1], duration: 0.9, ease: MOVE }, 4.05 + k * 0.006);
      });
      ft($("runlbl"), { x: 0, y: 0 }, { x: 270, y: -200, duration: 0.9, ease: MOVE }, 4.3);
      fadeIn($("sB"), 4.2);
      ws.forEach((w, n) => { if (n >= 9) ft(w, { opacity: 1 }, { opacity: 0.3, duration: 0.5, ease: MOVE }, 5.0); });

      // ---------- 6.93 tile 图缩到左上；框出同一列 W 的 16 个 tile ----------
      fadeOut($("sB"), 6.93, 0.3);
      fadeOut($("runlbl"), 6.93, 0.3);
      fadeOut($("axis"), 6.93, 0.3);
      ft($("map"), { scale: 1 }, { scale: 0.64, duration: 0.8, ease: MOVE }, 7.0);
      fadeIn($("colbox"), 7.6, 0.4);
      fadeIn($("wcur"), 7.6, 0.4);
      fadeIn($("sC"), 7.3);
      fadeIn($("ftl"), 7.6);
      fts.forEach((t, i) => ft(t, { opacity: 0 }, { opacity: 0.45, duration: 0.3, ease: IN }, 7.7 + i * 0.03));
      ft(T.layer.l2, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 8.3);
      ft(T.layer.hbm, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 8.2);
      ft($("wb"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, 8.8);

      // ---------- 10.1 W 进 L2（读一次）；11.4 被 16 个 tile 读走 ----------
      fadeOut($("sC"), 10.0, 0.3);
      ft($("wb"), { y: 0 }, { y: -170, duration: 0.7, ease: MOVE }, 10.1);
      fadeIn($("once"), 10.3);
      fadeIn($("sD"), 10.4);
      lines.forEach(([ln, len], i) => ft(ln, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.5, ease: MOVE }, 11.4 + i * 0.02));
      fts.forEach((t, i) => ft(t, { opacity: 0.45 }, { opacity: 1, duration: 0.25, ease: IN }, 11.8 + i * 0.02));

      // ---------- 13.08 显存读取 6.6 → 1.3 GB；16.95 耗时条 2.29 → 1.49；18.0 +54% ----------
      fadeOut($("mapin"), 13.08);
      fadeOut([$("sD"), $("fanin")], 13.08);
      fadeIn($("rt"), 13.4);
      fadeIn($("r1"), 14.3, 0.3);
      ft($("b1"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: IN }, 14.35);
      fadeIn($("v1"), 14.8, 0.3);
      fadeIn($("r2"), 15.2, 0.3);
      ft($("b2"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: IN }, 15.2);
      ft($("b2"), { scaleX: 1 }, { scaleX: 140 / 700, duration: 0.9, ease: MOVE }, 15.6);
      fadeIn($("v2"), 16.3, 0.3);

      tl.set($("tbghost"), { opacity: 1 }, 16.95);
      ft($("tbfill"), { scaleX: 2.29 / 16 }, { scaleX: 1.49 / 16, duration: 0.9, ease: MOVE }, 16.95);
      ft([$("tbnum"), $("tbnum2")], { x: TBX(2.29) }, { x: TBX(1.49), duration: 0.9, ease: MOVE }, 16.95);
      fadeOut($("tbnum"), 16.95, 0.3);
      fadeIn($("tbnum2"), 17.45, 0.4);
      ft($("tbghost"), { opacity: 1 }, { opacity: 0, duration: 0.5, ease: OUT }, 18.45);

      fadeIn($("gc"), 18.0);
      ft($("g"), { opacity: 0, scale: 0.9, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, 18.05);

      tl.set({}, {}, 20.1);
      window.__timelines = window.__timelines || {};
      window.__timelines["s07"] = tl;
    })();
  </script>
</template>
