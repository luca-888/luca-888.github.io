  <script>
    (function () {
      const $ = (k) => document.getElementById("s07-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const set1 = (el, t) => ft(el, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: IN }, t);
      const set0 = (el, t) => ft(el, { opacity: 1 }, { opacity: 0, duration: 0.2, ease: OUT }, t);

      // ---------- 生成的静态子元素 ----------
      const mkDots = (el, color, first) => {
        for (let r = 0; r < 4; r++) for (let i = 0; i < 32; i++) {
          const d = document.createElement("div");
          d.className = "s07-dot";
          d.style.left = i * 12 + "px"; d.style.top = r * 12 + "px";
          d.style.background = r === 0 && i === 0 && first ? first : color;
          el.appendChild(d);
        }
      };
      mkDots($("d0"), "var(--line)", "var(--use)");
      mkDots($("d1"), "var(--teal)");
      mkDots($("d2"), "var(--teal)");
      const slotX = (s) => 626 + s * 176;
      const SL = [];
      for (let s = 0; s < 4; s++) {
        const box = document.createElement("div");
        box.className = "s07-slot"; box.style.left = slotX(s) + "px";
        const dat = document.createElement("div");
        dat.className = "s07-dat";
        dat.innerHTML = '<i style="position:absolute;left:0;top:0;width:108px;height:50px;background:var(--blue)"></i><i style="position:absolute;left:0;top:58px;width:108px;height:50px;background:var(--yel)"></i>';
        box.appendChild(dat);
        const lf = document.createElement("div"), le = document.createElement("div");
        lf.className = "s07-lt"; lf.style.left = slotX(s) + 30 + "px"; lf.innerHTML = '<i style="background:var(--use)"></i>';
        le.className = "s07-lt"; le.style.left = slotX(s) + 80 + "px"; le.innerHTML = '<i style="background:var(--teal)"></i>';
        $("sl").append(box, lf, le);
        SL.push({ box, dat, lf, le, f: lf.firstChild, e: le.firstChild });
      }
      // 时间线：每段 240 px；1 号 算/等/算/等/算/等，2 号相反；Tensor Core 一轨连续，标出是谁在用
      const lane = $("lane"), X0 = 340, W = 240;
      const seg = (x, y, h, css, text) => {
        const d = document.createElement("div");
        d.className = "s07-seg";
        d.style.cssText += `left:${x}px;top:${y}px;width:${W}px;height:${h}px;${css}`;
        if (text) d.textContent = text;
        lane.appendChild(d);
      };
      for (let k = 0; k < 6; k++) {
        const x = X0 + k * W, c1 = k % 2 === 0;
        seg(x, 400, 60, c1 ? "background:var(--teal);color:var(--ink)" : "background:var(--paper2);color:var(--note)", k < 2 ? (c1 ? "计算" : "等待") : "");
        seg(x, 490, 60, !c1 ? "background:var(--teal);color:var(--ink)" : "background:var(--paper2);color:var(--note)", k < 2 ? (!c1 ? "计算" : "等待") : "");
        seg(x, 610, 64, "background:var(--teal);color:var(--ink);border-right:2px solid var(--paper)", c1 ? "1 号" : "2 号");
      }
      // tile 图的缝与 Wᵀ 边条的缝
      let g = "";
      for (let k = 1; k < 64; k++) g += `M${k * 15} 0V480`;
      for (let k = 1; k < 32; k++) g += `M0 ${k * 15}H960`;
      $("gap").setAttribute("d", g);
      let wg = "";
      for (let k = 1; k < 32; k++) wg += `M0 ${k * 15}H14`;
      $("wgap").setAttribute("d", wg);

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set($("ttl"), { x: 0, y: 0, scale: 1 });
      const fx = (v) => (v / 781.86) * 544;
      gsap.set($("fill"), { scaleX: 484 / 781.86 });
      gsap.set([$("n484"), $("n480")], { x: fx(484) + 10 });
      gsap.set($("fill2"), { scaleX: 481 / 781.86 });
      gsap.set([$("m481"), $("m635")], { x: fx(481) + 10 });
      gsap.set([$("mt"), $("n480"), $("same"), $("row2"), $("m635")], { opacity: 0 });
      gsap.set([$("pl"), $("wg0"), $("pt"), $("c1"), $("c2"), $("slots")], { opacity: 0 });
      gsap.set($("d0").children[0], { scale: 1 });
      gsap.set(SL.map((o) => o.box).concat(SL.map((o) => o.lf), SL.map((o) => o.le)), { opacity: 0 });
      gsap.set(SL.map((o) => o.dat).concat(SL.map((o) => o.f), SL.map((o) => o.e)), { opacity: 0 });
      gsap.set([$("sh"), $("wires"), $("cur"), $("leg")], { opacity: 0 });
      gsap.set([$("tk1"), $("tk2"), $("tk3"), $("tcl")], { opacity: 0 });
      gsap.set(lane, { clipPath: "inset(0px 1920px 0px 0px)" });
      gsap.set([$("wl"), $("wstrip"), $("tmap"), $("cl"), $("wneed"), $("round"), $("capt"), $("cap"), $("l2t"), $("l2l"), $("ovl"), $("bn")], { opacity: 0 });
      gsap.set([$("r0"), $("r1"), $("r2"), $("r3"), $("r4"), $("wlit"), $("cy"), $("ch")], { scaleX: 0, transformOrigin: "0 50%" });

      // ---------- 0–1.0 标题卡；1.0 缩到版本名右侧 ----------
      ft($("chip"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: IN }, 0.1);
      ft($("ttl"), { x: 0, y: 0, scale: 1 }, { x: 284, y: -72, scale: 0.6, duration: 0.7, ease: MOVE }, 1.0);

      // ---------- 1.0 生产者 + 两个消费者 ----------
      ft($("wg0"), { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 1.1);
      fadeIn($("pl"), 1.3);
      ft($("c1"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 2.6);
      ft($("c2"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 2.75);
      ft($("d0").children[0], { scale: 1 }, { scale: 1.8, duration: 0.4, ease: IN }, 4.4);
      fadeIn($("pt"), 4.5);
      fadeIn($("mt"), 5.6);

      // ---------- 8.4 4 个槽位，每个两盏灯：full（绿）/ empty（teal）循环 ----------
      ft($("slots"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 8.4);
      fadeIn($("sh"), 8.4);
      SL.forEach((o, s) => ft(o.box, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 8.5 + s * 0.08));
      SL.forEach((o, s) => { fadeIn(o.lf, 8.9 + s * 0.05, 0.3); fadeIn(o.le, 8.95 + s * 0.05, 0.3); });
      fadeIn($("wires"), 9.0);
      fadeIn($("leg"), 9.3);
      // 生产者先把 4 个槽位装满
      SL.forEach((o, s) => {
        const t = 9.8 + s * 0.4;
        ft(o.dat, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: IN }, t);
        set1(o.f, t + 0.3);
      });
      // 消费者依次用完槽位 → empty 亮；生产者随即重装 → full 亮
      fadeIn($("cur"), 11.6, 0.3);
      for (let k = 0; k < 4; k++) {
        const o = SL[k], t = 11.6 + k * 0.85;
        if (k > 0) ft($("cur"), { x: (k - 1) * 176 }, { x: k * 176, duration: 0.3, ease: MOVE }, t - 0.3);
        set0(o.f, t + 0.15);
        ft(o.dat, { opacity: 1 }, { opacity: 0.25, duration: 0.3, ease: MOVE }, t + 0.15);
        set1(o.e, t + 0.45);
        set0(o.e, t + 0.75);
        ft(o.dat, { opacity: 0.25, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: IN }, t + 0.75);
        set1(o.f, t + 0.95);
      }

      // ---------- 15.1 两个消费者交替使用 Tensor Core ----------
      ft($("p"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: OUT }, 15.1);
      fadeOut($("c1"), 15.1); fadeOut($("c2"), 15.1);
      ft($("slots"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: OUT }, 15.1);
      fadeIn($("tk1"), 15.5); fadeIn($("tk2"), 15.6); fadeIn($("tk3"), 15.7);
      ft(lane, { clipPath: "inset(0px 1920px 0px 0px)" }, { clipPath: "inset(0px 0px 0px 0px)", duration: 3.0, ease: "none" }, 15.6);
      fadeIn($("tcl"), 18.8);

      // ---------- 21.2 4096 阶 481 → 635；8192 阶仍为 480 ----------
      ft($("row2"), { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 21.2);
      ft($("fill2"), { scaleX: 481 / 781.86 }, { scaleX: 635 / 781.86, duration: 1.1, ease: MOVE }, 21.9);
      ft([$("m481"), $("m635")], { x: fx(481) + 10 }, { x: fx(635) + 10, duration: 1.1, ease: MOVE }, 21.9);
