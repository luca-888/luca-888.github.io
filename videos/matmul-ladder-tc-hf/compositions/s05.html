  <script>
    (function () {
      const $ = (k) => document.getElementById("s05-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4, from = 1) => ft(el, { opacity: from }, { opacity: 0, duration: d, ease: OUT }, t);

      // ---------- 生成的静态子元素 ----------
      // 点阵：4 行 × 32 点，点距 22 / 行距 22；每点三层：灰（闲着）、绿（发 TMA 的线程 0）、teal（参与 wgmma）
      const gray = [], teal = [], rows = [[], [], [], []];
      let d0 = null, g0 = null;
      for (let r = 0; r < 4; r++) for (let i = 0; i < 32; i++) {
        const d = document.createElement("div");
        d.className = "s05-dot";
        d.style.left = i * 22 + "px"; d.style.top = r * 22 + "px";
        d.innerHTML = '<i style="background:var(--line)"></i><i style="background:var(--teal)"></i>';
        if (r === 0 && i === 0) { d.innerHTML += '<i style="background:var(--use)"></i>'; d0 = d; g0 = d.children[2]; }
        $("dots").appendChild(d);
        gray.push(d.children[0]); teal.push(d.children[1]); rows[r].push(d.children[1]);
      }
      // 大块：浅蓝底 + 8 个深蓝格（同一列 = 同一组 bank）；换位时第 r 个深格右移 r 格，成对角线
      const mkBig = (el, pitch, cls) => {
        const dark = [];
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
          const q = document.createElement("i");
          q.style.left = c * pitch + "px"; q.style.top = r * pitch + "px"; q.style.background = "var(--warp)";
          el.appendChild(q);
        }
        for (let r = 0; r < 8; r++) {
          const q = document.createElement("i");
          q.style.left = "0px"; q.style.top = r * pitch + "px"; q.style.background = "var(--blue)";
          el.appendChild(q); dark.push(q);
        }
        return dark;
      };
      mkBig($("src"), 34);
      const cpyDark = mkBig($("cpy"), 34);
      const twDark = mkBig($("tb1"), 9);
      // wgmma 正面 4 × 16 格：每格正好是一条 mma.sync 的正面
      let gd = "";
      for (let k = 1; k < 16; k++) gd += `M${(300 + k * 25.6).toFixed(1)} 615.2V820`;
      for (let k = 1; k < 4; k++) gd += `M300 ${(615.2 + k * 51.2).toFixed(1)}H709.6`;
      $("vgrid").setAttribute("d", gd);
      // 时间线：3 个周期，每周期 搬 180 + 算 288 = 468 px，从 x 420 到 1824
      const lane = $("lane"), X0 = 420, CYC = 468, MV = 180, CP = 288;
      const seg = (x, w, y, css, text) => {
        const s = document.createElement("div");
        s.className = "s05-seg";
        s.style.cssText += `left:${x}px;top:${y}px;width:${w}px;height:90px;${css}`;
        if (text) s.textContent = text;
        lane.appendChild(s);
        return s;
      };
      const idle = [];
      for (let c = 0; c < 3; c++) {
        const b = X0 + c * CYC;
        seg(b, MV, 490, "background:var(--hot);color:#fff;border-right:3px solid var(--paper)", "搬");
        seg(b + MV, CP - 4, 490, "background:var(--teal);color:var(--ink)", "算");
        idle.push(seg(b, MV - 3, 640, "background:var(--cell);border:3px dashed var(--hot);color:var(--hot-t);font-size:32px", "空着"));
        seg(b + MV, CP - 4, 640, "background:var(--teal)");
      }

      // 塔
      const T = kitTower($("tower"));
      const L = T.layer, smBox = $("tower-sm");
      const rIn = T.route("s05-rin", ["hbm", "l2", "smem"], { color: "var(--hot)" });
      const rTC = T.route("s05-rtc", ["smem", "tc"], { color: "var(--teal)", lane: 1 });
      // 塔里的小块放在层板右侧空白处（容器 x 380），起点在显存层
      const TX = 1180 + 384, ty = (id) => 300 + T.at(id).y - 36;
      $("tb1").style.left = TX + "px"; $("tb1").style.top = ty("hbm") + "px";
      const dySmem = ty("smem") - ty("hbm"), dyTc = ty("tc") - ty("hbm");

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set($("ttl"), { x: 0, y: 0, scale: 1 });
      gsap.set([$("tbfill"), $("tbghost")], { scaleX: 3.56 / 16 });
      gsap.set($("tbnum"), { x: 3.56 * 45 + 12 });
      gsap.set([$("tb"), $("tbn")], { opacity: 0 });
      gsap.set([$("hop"), $("nt"), $("nw"), $("tnote"), $("wnote")], { opacity: 0 });
      gsap.set([$("nt"), $("nw")], { x: 0, y: 0, scale: 1 });
      gsap.set([$("wgf"), $("d1"), $("d2")], { opacity: 0 });
      gsap.set($("dots").children, { opacity: 0 });
      gsap.set(teal, { opacity: 0 });
      gsap.set(g0, { opacity: 0 });
      gsap.set([$("bl1"), $("bl2"), $("src"), $("arr"), $("arl"), $("cpy"), $("swl")], { opacity: 0 });
      gsap.set([L.tc, L.reg, L.smem, L.l2, L.hbm, smBox, $("tb1"), $("regx"), $("skip")], { opacity: 0 });
      gsap.set([rIn, rTC], { strokeDashoffset: (i, el) => el.dataset.len });
      gsap.set([$("vmma"), $("vwg"), $("vl1"), $("vl2"), $("x64"), $("vgrid")], { opacity: 0 });
      gsap.set([$("fast"), $("tk1"), $("tk2"), $("cur"), $("bn")], { opacity: 0 });
      gsap.set(lane, { clipPath: "inset(0px 1500px 0px 0px)" });

      // ---------- 0–1.0 标题卡；1.0 缩到版本名右侧 ----------
      ft($("chip"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 0.1);
      ft($("ttl"), { x: 0, y: 0, scale: 1 }, { x: 224, y: -72, scale: 0.6, duration: 0.7, ease: MOVE }, 1.0);
      fadeIn($("tb"), 1.1, 0.5);

      // ---------- 1.0 两条新指令 ----------
      fadeIn($("hop"), 1.1);
      ft($("nt"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 1.3);
      ft($("nw"), { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.6, ease: IN }, 1.6);

      // ---------- 3.73 TMA：一个线程发出，一整块搬进共享内存，顺带换位 ----------
      fadeOut($("hop"), 3.73, 0.3);
      fadeOut($("nw"), 3.73, 0.3);
      // TMA 缩成小标题：150 px → 72 px，移到 (96, 270)
      ft($("nt"), { x: 0, y: 0, scale: 1 }, { x: 0, y: -130, scale: 0.48, duration: 0.7, ease: MOVE }, 3.75);
      fadeIn($("tnote"), 4.3);
      // 塔进场
      ["hbm", "l2", "smem", "reg", "tc"].forEach((id, i) =>
        ft(L[id], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 3.9 + i * 0.08));
      fadeIn(smBox, 4.3);
      // 点阵出现，线程 0 变绿放大
      $("dots").children && Array.from($("dots").children).forEach((d, i) =>
        ft(d, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 4.2 + (i % 32) * 0.008 + Math.floor(i / 32) * 0.05));
      ft(g0, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 4.9);
      ft(d0, { scale: 1 }, { scale: 1.8, duration: 0.4, ease: IN }, 4.9);
      fadeIn($("d1"), 5.0);
      // 大块：显存里一整块；TMA 箭头；块飞到共享内存
      fadeIn($("bl1"), 5.6); ft($("src"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 5.6);
      ft($("tb1"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, 5.7);
      fadeIn($("arr"), 6.2, 0.3); fadeIn($("arl"), 6.2, 0.3);
      ft($("cpy"), { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.01 }, 6.3);
      ft($("cpy"), { x: 0 }, { x: 484, duration: 1.0, ease: MOVE }, 6.3);
      fadeIn($("bl2"), 7.0);
      ft(rIn, { strokeDashoffset: rIn.dataset.len }, { strokeDashoffset: 0, duration: 1.0, ease: MOVE }, 6.3);
      ft($("tb1"), { y: 0 }, { y: dySmem, duration: 1.0, ease: MOVE }, 6.3);
      // 7.58 顺带换位：深色格从一列错开成对角
      cpyDark.forEach((q, r) => ft(q, { x: 0 }, { x: r * 34, duration: 0.6, ease: MOVE }, 7.6 + r * 0.03));
      twDark.forEach((q, r) => ft(q, { x: 0 }, { x: r * 9, duration: 0.6, ease: MOVE }, 7.6 + r * 0.03));
      fadeIn($("swl"), 7.9);

      // ---------- 9.13 wgmma：4 个 warp 一起发；一条 = 64 条 mma.sync；操作数直接读共享内存 ----------
      fadeOut($("nt"), 9.13, 0.3);
      fadeOut($("tnote"), 9.13, 0.3);
      fadeOut($("d1"), 9.13, 0.3);
      ft(d0, { scale: 1.8 }, { scale: 1, duration: 0.3, ease: MOVE }, 9.13);
      [$("bl1"), $("bl2"), $("src"), $("arr"), $("arl"), $("cpy"), $("swl")].forEach((e) => fadeOut(e, 9.13, 0.35));
      ft($("nw"), { opacity: 0, x: 0, y: -320, scale: 0.48 }, { opacity: 1, x: 0, y: -320, scale: 0.48, duration: 0.5, ease: IN }, 9.3);
      fadeIn($("wnote"), 9.6);
      rows.forEach((row, r) => ft(row, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: IN }, 9.9 + r * 0.2));
      ft($("wgf"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 10.7);
      fadeIn($("d2"), 10.8);
      // 11.7 体积对比
      ft($("vmma"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 11.8);
      fadeIn($("vl1"), 11.9);
      ft($("vwg"), { opacity: 0, scale: 0.9, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, 12.4);
      fadeIn($("vl2"), 12.6);
      fadeIn($("vgrid"), 12.9, 0.6);
      ft($("x64"), { opacity: 0, scale: 0.8, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 13.3);
      // 14.88 塔：共享内存里的块直接送进 Tensor Core，寄存器层压暗
      ft($("regx"), { opacity: 0 }, { opacity: 0.92, duration: 0.5, ease: MOVE }, 14.9);
      ft(rTC, { strokeDashoffset: rTC.dataset.len }, { strokeDashoffset: 0, duration: 0.9, ease: MOVE }, 15.1);
      ft($("tb1"), { y: dySmem }, { y: dyTc, duration: 0.9, ease: MOVE }, 15.1);
      fadeIn($("skip"), 15.6);

      // ---------- 18.13 耗时条 3.56 → 2.27；塔与左侧退场；时间线 ----------
      ft($("tbfill"), { scaleX: 3.56 / 16 }, { scaleX: 2.27 / 16, duration: 0.9, ease: MOVE }, 18.13);
      ft($("tbnum"), { x: 3.56 * 45 + 12 }, { x: 2.27 * 45 + 12, duration: 0.9, ease: MOVE }, 18.13);
      fadeOut($("tbo"), 18.13, 0.3);
