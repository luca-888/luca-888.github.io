      fadeIn($("bl2"), t1 + 3.4);
      ft(rIn, { strokeDashoffset: rIn.dataset.len }, { strokeDashoffset: 0, duration: 1.0, ease: MOVE }, t1 + 2.7);
      ft($("tb1"), { y: 0 }, { y: dySmem, duration: 1.0, ease: MOVE }, t1 + 2.7);
      cpyDark.forEach((q, r) => ft(q, { x: 0 }, { x: r * 34, duration: 0.6, ease: MOVE }, t1 + 4.0 + r * 0.03));
      twDark.forEach((q, r) => ft(q, { x: 0 }, { x: r * 9, duration: 0.6, ease: MOVE }, t1 + 4.0 + r * 0.03));

      // ---------- 10.73 mbarrier：计数器记到达的字节数，计满 → 计算方开始读 ----------
      const t2 = B[2];
      [$("nt"), $("d1"), $("dots"), $("bl1"), $("bl2"), $("src"), $("arr"), $("arl"), $("cpy")].forEach((e) => fadeOut(e, t2, 0.35));
      ft($("nm"), { opacity: 0, x: 0, y: -200, scale: 0.379 }, { opacity: 1, x: 0, y: -200, scale: 0.379, duration: 0.5, ease: IN }, t2 + 0.2);
      fadeIn($("sl"), t2 + 0.4); fadeIn($("cells"), t2 + 0.5);
      ft($("ctr"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, t2 + 1.0);
      fadeIn($("cs0"), t2 + 1.4); fadeIn($("cw"), t2 + 1.5);
      // 塔：共享内存层提亮一下，表示这一切发生在共享内存里
      ft(L.smem, { scale: 1 }, { scale: 1.04, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, t2 + 0.6);
      // 12.75 起 8 批到达（A、W 两条 TMA 交错），每到一批计数 +4 KB
      const order = [0, 4, 1, 5, 2, 6, 3, 7];
      order.forEach((k, j) => {
        const t = 12.75 + j * 0.41;
        ft(chk[k], { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, t);
        tl.set(cn[j], { opacity: 0 }, t + 0.28);
        tl.set(cn[j + 1], { opacity: 1 }, t + 0.28);
        ft($("ctrf"), { scaleX: j / 8 }, { scaleX: (j + 1) / 8, duration: 0.2, ease: "power2.out" }, t + 0.28);
      });
      // 16.1 计满变绿；16.7 计算方的等待解除
      fadeIn($("ctrg"), 16.1, 0.4);
      fadeOut($("cw"), 16.7, 0.25);
      ft($("cr"), { opacity: 0, scale: 0.85, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, 16.75);
      ft(chk, { y: 0 }, { y: -10, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, stagger: 0.04 }, 16.9);

      // ---------- 18.28 wgmma：4 个 warp 一起发；一条 131072 次乘加 = 64 条 mma.sync；操作数直接读共享内存 ----------
      const t3 = B[3];
      [$("nm"), $("sl"), $("cells"), $("chks"), $("ctr"), $("cs0"), $("cr")].forEach((e) => fadeOut(e, t3, 0.35));
      tl.set(d0, { scale: 1 }, t3);
      tl.set(g0, { opacity: 0 }, t3);
      ft($("nw"), { opacity: 0, x: 0, y: -420, scale: 0.379 }, { opacity: 1, x: 0, y: -420, scale: 0.379, duration: 0.5, ease: IN }, t3 + 0.2);
      fadeIn($("dots"), t3 + 0.6, 0.4);
      rows.forEach((row, r) => ft(row, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: IN }, t3 + 0.9 + r * 0.2));
      ft($("wgf"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, t3 + 1.8);
      fadeIn($("d2"), t3 + 1.9);
      // 22.0 体积对比
      ft($("vmma"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: IN }, 22.0);
      fadeIn($("vl1"), 22.1);
      ft($("vwg"), { opacity: 0, scale: 0.9, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.6, ease: IN }, 22.6);
      fadeIn($("vl2"), 22.8);
      fadeIn($("vgrid"), 24.2, 0.6);
      ft($("x64"), { opacity: 0, scale: 0.8, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 24.9);
      // 23.28 耗时条 3.56 → 2.27（ghost 留 1.5 s）
      const ts = t3 + 5.0;
      ft($("tbfill"), { scaleX: 3.56 / 16 }, { scaleX: 2.27 / 16, duration: 0.9, ease: MOVE }, ts);
      ft($("tbnum"), { x: 3.56 * 45 + 12 }, { x: 2.27 * 45 + 12, duration: 0.9, ease: MOVE }, ts);
      fadeOut($("tbo"), ts, 0.3);
      fadeIn($("tbn"), ts + 0.45, 0.4);
      fadeOut($("tbghost"), ts + 1.5, 0.5);
      // 26.8 塔：共享内存里的块直接送进 Tensor Core，寄存器层压暗
      ft($("regx"), { opacity: 0 }, { opacity: 0.92, duration: 0.5, ease: MOVE }, 26.6);
      ft(rTC, { strokeDashoffset: rTC.dataset.len }, { strokeDashoffset: 0, duration: 0.9, ease: MOVE }, 26.8);
      ft($("tb1"), { y: dySmem }, { y: dyTc, duration: 0.9, ease: MOVE }, 26.8);

      // ---------- 29.92 塔与左侧退场；时间线：发 TMA → 算 → 发 TMA → 算 ----------
      const t4 = B[4];
      [$("nw"), $("wgf"), $("d2"), $("vmma"), $("vwg"), $("vl1"), $("vl2"), $("x64")].forEach((e) => fadeOut(e, t4));
      ft($("dots"), { opacity: 1 }, { opacity: 0, duration: 0.4, ease: OUT }, t4);
      ["tc", "reg", "smem", "l2", "hbm"].forEach((id) => fadeOut(L[id], t4));
      [smBox, $("tb1"), rIn, rTC].forEach((e) => fadeOut(e, t4));
      fadeOut($("regx"), t4, 0.4, 0.92);
      fadeIn($("tk1"), t4 + 0.6); fadeIn($("tk2"), t4 + 0.8);
      fadeIn($("cur"), t4 + 0.7, 0.3);
      ft(lane, { clipPath: "inset(0px 1500px 0px 0px)" }, { clipPath: "inset(0px 96px 0px 0px)", duration: 2.6, ease: "none" }, t4 + 0.7);
      ft($("cur"), { x: 0 }, { x: 1404, duration: 2.6, ease: "none" }, t4 + 0.7);
      fadeOut($("cur"), t4 + 3.3, 0.3);
      // 两块之间 Tensor Core 空着
      idle.forEach((s, i) => ft(s, { scale: 1 }, { scale: 1.08, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, t4 + 3.7 + i * 0.12));
      ft($("bn"), { opacity: 0, scale: 0.85, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, t4 + 4.2);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["s05"] = tl;
    })();
  </script>
