<template>
  <style>
    #root { position: absolute; inset: 0; }
    #root .s03-full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #root .s03-blk { position: absolute; border-radius: 4px; color: #fff; font-weight: 800; display: flex; align-items: center; white-space: nowrap; outline: 0 solid var(--ink); }
    #root .s03-lbl { position: absolute; font-size: 32px; font-weight: 800; color: var(--ink2); white-space: nowrap; }
    #root .s03-bar { position: absolute; height: 60px; border-radius: 3px; color: #fff; font-family: var(--mono); font-size: 30px; font-weight: 800; text-align: center; line-height: 60px; transform-origin: 0 50%; outline: 0 solid var(--ink); }
    #root .s03-gap { position: absolute; height: 60px; border: 3px dashed var(--gray); border-radius: 3px; transform-origin: 0 50%; }
    #root .s03-data { position: absolute; left: 0; top: 0; width: 44px; height: 44px; background: var(--blue); border: 3px solid var(--ink); border-radius: 3px; }
    #root .s03-slot { position: absolute; width: 110px; height: 90px; border-radius: 3px; background: var(--useL); border: 3px solid #fff; }
    #root .s03-fill { position: absolute; width: 110px; height: 90px; border-radius: 3px; border: 3px solid #fff; color: #fff; font-family: var(--mono); font-size: 40px; font-weight: 800; text-align: center; line-height: 84px; }
  </style>
  <!-- s03 第 2 步 cp.async：地图上 L2 → shared memory 点亮 → 绕经寄存器的搬运 + 串行时间线 → 拉直成直达 → 下一块提前 → 3 格环形缓冲 → 时间线重叠 -->
  <div id="root" data-composition-id="s03" data-width="1920" data-height="1080">
    <div id="s03-mapw" class="s03-full"></div>
    <div id="s03-main" class="s03-full"></div>
    <div id="s03-hud" class="s03-full"></div>
  </div>
  <script>
    (function () {
      const B = [0.6, 6.51, 16.05, 26.71, 31.29, 41.69];
      const DUR = 47.32;
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const U = HFKit("s03", tl), $ = U.$, mk = U.mk, ft = U.ft;

      // 常驻：小地图（前一步做完的状态）、速度条、页眉
      const M = HFMap.state(HFMap($("mapw"), { x: 460, y: 180 }), { mini: true });
      const SP = HFSpeed($("hud"), HFSPEED.s02).instant();
      const H = HFHeader($("hud"), "第 2 步", "cp.async：搬运不经过寄存器");
      // 小地图上某层（数据通道那一份）的画面矩形
      const MS = HFMap.MINI.scale;
      const miniRect = (id) => { const g = M.G[id], x = g.x ?? M.PX(0), w = g.w ?? M.PW; return { x: HFMap.MINI.x + x * MS, y: HFMap.MINI.y + g.y * MS, w: w * MS, h: g.h * MS }; };
      // 主画面的块从小地图上对应那一层放大出来
      const grow = (el, id, r, t, d = 1.0) => {
        const m = miniRect(id);
        ft(el, { opacity: 0 }, { opacity: 1, duration: 0.15 }, t);
        ft(el, { x: m.x + m.w / 2 - (r.x + r.w / 2), y: m.y + m.h / 2 - (r.y + r.h / 2), scaleX: m.w / r.w, scaleY: m.h / r.h, transformOrigin: "50% 50%" },
          { x: 0, y: 0, scaleX: 1, scaleY: 1, transformOrigin: "50% 50%", duration: d, ease: U.CAM }, t);
      };
      const blk = (p, r, bg, html, fs, center = true) => { const e = mk(p, `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${bg};font-size:${fs}px;${center ? "justify-content:center" : "padding-left:26px"}`, html); e.className = "s03-blk"; return e; };

      // ================= 第 1 句：小地图上 L2 → shared memory 一段点亮；标题出现；这一段放大到主画面 =================
      HFMap.focus(tl, M, "l2-smem", B[0] + 0.1);
      H.show(tl, B[0] + 0.4);
      const mn = $("main");
      const sv = U.svg(mn);   // 箭头在块的下面
      const R = { smem: { x: 760, y: 200, w: 700, h: 160 }, l2: { x: 760, y: 500, w: 700, h: 80 }, reg: { x: 1520, y: 390, w: 180, h: 80 } };
      const smemB = blk(mn, R.smem, "var(--use)", "shared memory", 36, false);
      const l2B = blk(mn, R.l2, "var(--ink2)", "L2 缓存", 36);
      const regB = blk(mn, R.reg, "var(--ink2)", "寄存器", 32);
      gsap.set([smemB, l2B, regB], { opacity: 0 });
      grow(l2B, "l2", R.l2, B[0] + 0.5);
      grow(smemB, "smem", R.smem, B[0] + 0.65);

      // ================= 第 2 句：数据从 L2 出发，绕进寄存器再拐进 shared memory；时间线上“搬”画完，“算”才开始 =================
      // 绕路的箭头与拉直后的箭头点数相同，便于直接补间 d 属性
      const D1 = "M 1245 496 L 1245 430 L 1610 430 L 1610 280 L 1470 280", D2 = "M 1245 496 L 1245 470 L 1245 440 L 1245 400 L 1245 372";
      const H1 = "1464,280 1480,267 1480,293", H2 = "1245,364 1232,380 1258,380";
      const route = U.path(sv, D1, "var(--ink)", 6);
      route.style.strokeDasharray = route.dataset.len + " 9999";
      const rHead = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      rHead.setAttribute("points", H1); rHead.setAttribute("fill", "var(--ink)"); sv.appendChild(rHead);
      gsap.set(rHead, { opacity: 0 });
      ft(regB, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: U.ARRIVE }, B[1] + 0.1);
      U.draw(route, B[1] + 0.3, 0.7);
      U.fade(rHead, B[1] + 0.95, 0.1);
      // 线程：挂在寄存器下面，状态“等待 / 算”
      const thw = mk(mn, "position:absolute;left:1520px;top:500px;width:340px;height:60px");
      const chip = mk(thw, "position:absolute;left:0;top:0;width:180px;height:60px;border:3px solid var(--ink);border-radius:4px;background:var(--paper);font-size:32px;font-weight:800;color:var(--ink);text-align:center;line-height:54px", "线程");
      const stW = mk(thw, "position:absolute;left:198px;top:8px;font-size:32px;font-weight:800;color:var(--note);white-space:nowrap", "等待");
      const stC = mk(thw, "position:absolute;left:198px;top:8px;font-size:32px;font-weight:800;color:var(--teal-t);white-space:nowrap", "算");
      gsap.set([thw, stW, stC], { opacity: 0 });
      U.appear(thw, B[1] + 0.2, 0.5, 14);

      // 时间线：上一行“搬运”，下一行 Tensor Core
      const TX = 800, Y1 = 640, Y2 = 740;
      const tr1 = mk(mn, `position:absolute;left:${TX}px;top:${Y1}px;width:1040px;height:60px;background:var(--paper2);border-radius:3px`);
      const tr2 = mk(mn, `position:absolute;left:${TX}px;top:${Y2}px;width:1040px;height:60px;background:var(--paper2);border-radius:3px`);
      const rl1 = mk(mn, `left:560px;top:${Y1 + 10}px;color:var(--hot-t)`, "搬运"); rl1.className = "s03-lbl";
      const rl2 = mk(mn, `left:560px;top:${Y2 + 10}px;color:var(--teal-t)`, "Tensor Core"); rl2.className = "s03-lbl";
      const axis = mk(mn, `left:1840px;top:${Y2 + 76}px;font-size:28px;font-weight:600;color:var(--note)`, "时间 →"); axis.className = "s03-lbl";
      gsap.set(axis, { xPercent: -100 });
      gsap.set([tr1, tr2, rl1, rl2, axis], { opacity: 0 });
      U.fade([tr1, tr2], B[1] + 0.3, 0.4); U.appear([rl1, rl2], B[1] + 0.3, 0.5, 10); U.fade(axis, B[1] + 0.6, 0.4);
      // 串行：搬 140 px、算 110 px，一前一后
      const bar = (x, y, w, bg, n) => { const e = mk(mn, `left:${x}px;top:${y}px;width:${w}px;background:${bg}`, String(n)); e.className = "s03-bar"; gsap.set(e, { opacity: 0 }); return e; };
      const gapBox = (x, w, txt) => { const e = mk(mn, `left:${x}px;top:${Y2}px;width:${w}px`); e.className = "s03-gap"; const l = mk(e, "position:absolute;inset:0;font-size:28px;font-weight:600;color:var(--note);text-align:center;line-height:54px;white-space:nowrap", txt || ""); gsap.set(e, { opacity: 0 }); e.lbl = l; return e; };
      const mv = [], cp = [], gp = [];
      for (let k = 0; k < 4; k++) { mv.push(bar(820 + 250 * k, Y1, 140, "var(--hot)", k + 1)); cp.push(bar(960 + 250 * k, Y2, 110, "var(--teal)", k + 1)); gp.push(gapBox(820 + 250 * k, 140, "等待")); }
      const grow1 = (e, t, d) => { ft(e, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); ft(e, { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: d, ease: "none" }, t); };
      // 一块数据：L2 → 寄存器（停一下）→ shared memory
      const dataDetour = (t) => {
        const e = mk(mn, ""); e.className = "s03-data"; gsap.set(e, { opacity: 0 });
        U.travel(e, [[1245, 540], [1245, 430], [1610, 430]], t, 0.7, "power1.inOut");
        ft(e, { opacity: 0 }, { opacity: 1, duration: 0.15 }, t);
        ft(regB, { outlineWidth: 0 }, { outlineWidth: 5, duration: 0.15 }, t + 0.7);
        ft(regB, { outlineWidth: 5 }, { outlineWidth: 0, duration: 0.2 }, t + 1.0);
        U.travel(e, [[1610, 430], [1610, 280], [1400, 280]], t + 1.0, 0.6, "power1.inOut");
        ft(e, { opacity: 1 }, { opacity: 0, duration: 0.2 }, t + 1.6);
      };
      // 前两轮跟着数据走（搬 1.6 s、算 0.9 s），后两轮快速画完
      const per = [[0.7, 1.6, 0.9], [3.2, 1.6, 0.9], [5.7, 0.55, 0.3], [6.55, 0.55, 0.3]];
      per.forEach(([o, dm, dc], k) => {
        const t = B[1] + o;
        if (k < 2) dataDetour(t);
        grow1(mv[k], t, dm); U.fade(gp[k], t, 0.25);
        grow1(cp[k], t + dm, dc);
        // 线程的状态：搬的时候在等，搬完才算
        ft(stW, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t); ft(stW, { opacity: 1 }, { opacity: 0, duration: 0.1 }, t + dm);
        ft(stC, { opacity: 0 }, { opacity: 1, duration: 0.1 }, t + dm); ft(stC, { opacity: 1 }, { opacity: 0, duration: 0.1 }, t + dm + dc);
      });

      // ================= 第 3 句：cp.async：绕路的箭头拉直成直达；线程发出指令后立即去算 =================
      ft(route, { attr: { d: D1 } }, { attr: { d: D2 }, duration: 1.0, ease: U.CAM }, B[2] + 0.2);
      ft(rHead, { attr: { points: H1 } }, { attr: { points: H2 }, duration: 1.0, ease: U.CAM }, B[2] + 0.2);
      ft(regB, { opacity: 1 }, { opacity: 0.25, duration: 0.5 }, B[2] + 0.4);
      // 线程发出一条 cp.async，指令落到直达箭头旁
      const tag = mk(mn, "position:absolute;left:0;top:0;padding:4px 14px;background:var(--panel);border-radius:4px;font-family:var(--mono);font-size:32px;font-weight:800;color:var(--hot-t);white-space:nowrap", "cp.async");
      gsap.set(tag, { opacity: 0 });
      ft(tag, { opacity: 0 }, { opacity: 1, duration: 0.2 }, B[2] + 1.4);
      U.travel(tag, [[1610, 530], [1370, 422]], B[2] + 1.4, 0.6, "power2.inOut");
      // 线程不等，立即转身去算：移到 shared memory 旁边，状态“算”
      ft(thw, { y: 0 }, { y: -260, duration: 0.7, ease: U.CAM }, B[2] + 2.1);
      ft(stC, { opacity: 0 }, { opacity: 1, duration: 0.2 }, B[2] + 2.5);
      // 数据从 L2 直达 shared memory，一块接一块
      const dataDirect = (t) => {
        const e = mk(mn, ""); e.className = "s03-data"; gsap.set(e, { opacity: 0 });
        U.travel(e, [[1245, 540], [1245, 280]], t, 0.7, "power1.inOut");
        ft(e, { opacity: 0 }, { opacity: 1, duration: 0.15 }, t);
        ft(e, { opacity: 1 }, { opacity: 0, duration: 0.2 }, t + 0.7);
      };
      for (let k = 0; k < 5; k++) dataDirect(B[2] + 2.1 + k * 1.2);

      // ================= 第 4 句：时间线上“下一块”从更早的位置开始 =================
      const nxt = mk(mn, `position:absolute;left:1070px;top:${Y1 - 40}px;font-size:32px;font-weight:800;color:var(--ink);line-height:36px;white-space:nowrap`, "下一块");
      gsap.set(nxt, { opacity: 0 });
      ft(mv[1], { outlineWidth: 0 }, { outlineWidth: 4, duration: 0.25 }, B[3] + 0.2);
      U.appear(nxt, B[3] + 0.2, 0.4, 8);
      ft([mv[1], nxt], { x: 0 }, { x: -110, duration: 1.0, ease: U.CAM }, B[3] + 1.2);

      // ================= 第 5 句：shared memory 里 3 格环形缓冲；“搬”和“算”沿环转动 =================
      U.leave([thw, regB], B[4], 0.3);
      const SX = [1090, 1215, 1340], SY = 220;
      const slots = SX.map((x) => { const e = mk(mn, `left:${x}px;top:${SY}px`); e.className = "s03-slot"; gsap.set(e, { opacity: 0 }); return e; });
      slots.forEach((e, i) => U.pop(e, B[4] + 0.3 + i * 0.1, 0.45));
      // 环：最后一格回到第一格
      const ring = U.path(sv, "M 1395 314 L 1395 338 L 1145 338 L 1145 320", "#fff", 4);
      const sv2 = U.svg(mn);   // 白色回环画在 shared memory 上面
      sv2.appendChild(ring);
      const ringH = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      ringH.setAttribute("points", "1145,311 1135,323 1155,323"); ringH.setAttribute("fill", "#fff"); sv2.appendChild(ringH);
      gsap.set(ringH, { opacity: 0 });
      U.draw(ring, B[4] + 0.8, 0.5); U.fade(ringH, B[4] + 1.25, 0.1);
      // “算”的指针：在正在计算的那一格上方
      const ptr = mk(mn, `position:absolute;left:${SX[0]}px;top:150px;width:110px;text-align:center;font-size:32px;font-weight:800;color:var(--teal-t);line-height:40px`, "算");
      const ptrT = mk(ptr, "position:absolute;left:45px;top:40px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:12px solid var(--teal)");
      gsap.set(ptr, { opacity: 0 });
      // 第 n 块：在第 (n-1)%3 格；先搬（橙），到达后等待计算，计算时变 teal，算完这一格立即补上第 n+3 块
      const T0 = B[4] + 1.2, P = 1.3;
      const compT = (n) => T0 + 1.0 + (n - 1) * P;
      const loadT = (n) => (n <= 3 ? T0 + 0.25 * (n - 1) : compT(n - 2));
      for (let n = 1; loadT(n) < DUR - 0.7; n++) {
        const s = (n - 1) % 3, lt = loadT(n), ct = compT(n), et = compT(n + 1);
        const d = mk(mn, ""); d.className = "s03-data"; gsap.set(d, { opacity: 0 });
        ft(d, { opacity: 0 }, { opacity: 1, duration: 0.12 }, lt);
        U.travel(d, [[1245, 540], [1245, 360], [SX[s] + 55, SY + 45]], lt, 0.6, "power1.inOut");
        ft(d, { opacity: 1 }, { opacity: 0, duration: 0.12 }, lt + 0.6);
        const f = mk(mn, `left:${SX[s]}px;top:${SY}px;background:var(--hot)`, String(n)); f.className = "s03-fill"; gsap.set(f, { opacity: 0 });
        ft(f, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: U.ARRIVE }, lt + 0.55);
        ft(f, { backgroundColor: "#c4561d" }, { backgroundColor: "#0fa391", duration: 0.25 }, ct);
        if (et < DUR) ft(f, { opacity: 1 }, { opacity: 0, duration: 0.2 }, et - 0.05);
        if (n === 1) U.fade(ptr, ct, 0.25);
        else ft(ptr, { x: SX[(n - 2) % 3] - SX[0] }, { x: SX[s] - SX[0], duration: s === 0 ? 0.5 : 0.35, ease: U.CAM }, ct - 0.1);
      }

      // ================= 第 6 句：时间线收拢成上下两行重叠，Tensor Core 那一行的空白变短；速度条前进 =================
      ft(mv[1], { outlineWidth: 4 }, { outlineWidth: 0, duration: 0.2 }, B[5]);
      U.leave(nxt, B[5], 0.2);
      // 搬 k 从 820 + 140(k-1) 开始，算 k 从 960 + 140(k-1) 开始；中间只剩 30 px 的空白
      for (let k = 1; k < 4; k++) {
        const t = B[5] + 0.3 + k * 0.06;
        if (k > 1) ft(mv[k], { x: 0 }, { x: -110 * k, duration: 1.0, ease: U.CAM }, t);
        ft(cp[k], { x: 0 }, { x: -110 * k, duration: 1.0, ease: U.CAM }, t);
        ft(gp[k], { x: 0, scaleX: 1 }, { x: -110 * (k - 1), scaleX: 30 / 140, duration: 1.0, ease: U.CAM }, t);
        U.leave(gp[k].lbl, B[5] + 0.2, 0.2);
      }
      const mv5 = bar(1380, Y1, 140, "var(--hot)", 5), mv6 = bar(1520, Y1, 140, "var(--hot)", 6);
      const cp5 = bar(1520, Y2, 110, "var(--teal)", 5), cp6 = bar(1660, Y2, 110, "var(--teal)", 6);
      const g5 = gapBox(1490, 30), g6 = gapBox(1630, 30);
      grow1(mv5, B[5] + 1.4, 0.4); grow1(cp5, B[5] + 1.7, 0.3); U.fade(g5, B[5] + 1.5, 0.2);
      grow1(mv6, B[5] + 1.8, 0.4); grow1(cp6, B[5] + 2.1, 0.3); U.fade(g6, B[5] + 1.9, 0.2);
      SP.to(tl, HFSPEED.s03, B[5] + 2.2, 1.2);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["s03"] = tl;
    })();
  </script>
</template>
