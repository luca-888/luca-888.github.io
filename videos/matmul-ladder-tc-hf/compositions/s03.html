    </div>

    <!-- 第 2 句（5.96）：cp.async，L2 直达共享内存 -->
    <div id="s03-tw" class="clip s03-full" data-start="5.96" data-duration="9.60" data-track-index="4">

      <svg class="s03-full" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" stroke-linejoin="round">

    <div id="s03-cmp" class="clip s03-full" data-start="5.96" data-duration="6.80" data-track-index="5">
      <div id="s03-po" class="s03-path" style="top:330px;font-size:44px;color:var(--note)">以前：L2 → <span id="s03-preg">寄存器 →</span> 共享内存</div>
      <div id="s03-strike" style="left:354px;top:358px;width:186px"></div>

      <div id="s03-code" class="s03-abs" style="left:96px;top:590px">

          <div class="ln on">           Ab + (size_t)r * K + k0 + c * 8);</div>
        </div>
      </div>

    <!-- 第 3 句（12.33）：4.09 ms，快 2.9 倍 -->
    <div id="s03-gain" class="clip s03-abs" data-start="12.33" data-duration="3.20" data-track-index="6" style="left:96px;top:380px;white-space:nowrap">
      <div id="s03-gainin">
        <div><span style="font-size:72px;font-weight:800;color:var(--ink)">快 </span><span style="font-family:var(--mono);font-size:200px;font-weight:800;color:var(--teal-t);line-height:1">2.9</span><span style="font-size:72px;font-weight:800;color:var(--ink)"> 倍</span></div>
        <div style="font-family:var(--mono);font-size:48px;font-weight:700;color:var(--ink2);margin-top:20px">11.78 ms → 4.09 ms</div>
      </div>

    <!-- 第 4 句（15.13）：每一块仍要等拷贝完成 -->
    <div id="s03-tl" class="clip s03-full" data-start="15.13" data-duration="4.08" data-track-index="7">
      <div id="s03-tlh" class="s03-abs" style="left:96px;top:300px;font-size:40px;font-weight:700;color:var(--ink);white-space:nowrap">每一块：拷贝 → 等待 → 计算</div>
      <div class="s03-lname" style="top:440px">线程</div>

        <div class="s03-seg" style="left:0;width:160px;background:var(--hot)">拷贝</div>
        <div class="s03-seg" style="left:160px;width:300px;background:var(--line);color:var(--ink2)">等待</div>
        <div class="s03-seg" style="left:460px;width:240px;background:var(--teal)">计算</div>
        <div class="s03-seg" style="left:700px;width:160px;background:var(--hot)">拷贝</div>
        <div class="s03-seg" style="left:860px;width:300px;background:var(--line);color:var(--ink2)">等待</div>
        <div class="s03-seg" style="left:1160px;width:240px;background:var(--teal)">计算</div>
      </div>
      <div id="s03-lane2" class="s03-lane" style="top:600px">
        <div class="s03-seg" style="left:0;width:460px;background:var(--paper2);color:var(--note)">空闲</div>
        <div class="s03-seg" style="left:460px;width:240px;background:var(--teal)">计算</div>
        <div class="s03-seg" style="left:700px;width:460px;background:var(--paper2);color:var(--note)">空闲</div>
        <div class="s03-seg" style="left:1160px;width:240px;background:var(--teal)">计算</div>
      </div>
      <div id="s03-tarr" class="s03-lbl" style="left:1660px;top:716px;font-size:28px;color:var(--note)">时间 →</div>
      <div id="s03-wait" class="s03-abs" style="left:534px;top:434px;width:312px;height:102px;border:6px solid var(--hot)"></div>
      <div id="s03-idle" class="s03-abs" style="left:374px;top:594px;width:472px;height:102px;border:6px solid var(--hot)"></div>
      <div id="s03-bn" class="s03-abs" style="left:380px;top:730px"><span class="k-bottleneck" style="font-size:36px;padding:6px 14px">瓶颈：等拷贝</span></div>
    </div>
  </div>
  <script>
    (function () {
      const $ = (k) => document.getElementById("s03-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4) => ft(el, { opacity: 1 }, { opacity: 0, duration: d, ease: OUT }, t);
      const B = [1.0, 5.96, 12.33, 15.13], DUR = 19.21;

      // ---------- 网格：8 行 × 8 格（每格 16 字节 = 4 个 bank） ----------
      const PX = 112, PY = 64, cells = [], reds = [], greens = [], zeros = [], heads = [], rls = [];
      for (let j = 0; j < 8; j++) {
        const h = document.createElement("div");
        h.className = "s03-hd"; h.textContent = j;
        h.style.left = (230 + j * PX) + "px";
        $("heads").appendChild(h); heads.push(h);
      }
      for (let r = 0; r < 8; r++) {
        const l = document.createElement("div");
        l.className = "s03-rl"; l.textContent = "行 " + r;
        l.style.top = (340 + r * PY) + "px";
        $("rows").appendChild(l); rls.push(l);
        cells.push([]);
        for (let j = 0; j < 8; j++) {
          const c = document.createElement("div");
          c.className = "s03-cell";
          c.style.left = (j * PX) + "px"; c.style.top = (r * PY) + "px";
          if (j === 0) {
            c.innerHTML = `<i class="h" style="background:var(--red)"></i><i class="h" style="background:var(--use)"></i><span class="n">0</span>`;
            const hs = c.querySelectorAll(".h"); reds.push(hs[0]); greens.push(hs[1]); zeros.push(c.querySelector(".n"));
          } else c.innerHTML = `<span class="n">${j}</span>`;
          $("cells").appendChild(c); cells[r].push(c);
        }
      }
      const T = kitTower($("tower"));
      const L = T.layer, smBox = $("tower-sm");

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set([$("tbfill"), $("tbghost")], { scaleX: 11.78 / 16 });
      gsap.set($("tbghost"), { opacity: 0 });
      gsap.set($("tbnum"), { x: 11.78 * 45 + 12 });
      gsap.set([$("tb"), $("tbv2")], { opacity: 0 });
      gsap.set([$("gtop"), $("colo"), $("rk1"), $("rk2"), ...heads, ...rls, ...reds, ...greens], { opacity: 0 });
      cells.forEach((row) => gsap.set(row, { opacity: 0 }));
      gsap.set([L.tc, L.reg, L.smem, L.l2, L.hbm, smBox, $("old"), $("cpl"), $("car1"), $("car2")], { opacity: 0 });
      ["x1", "x2", "new"].forEach((k) => { const p = $(k), len = p.getTotalLength(); p.dataset.len = len; gsap.set(p, { strokeDasharray: len, strokeDashoffset: len }); });
      gsap.set([$("po"), $("pn"), $("code")], { opacity: 0 });
      gsap.set($("strike"), { scaleX: 0 });
      gsap.set($("gainin"), { opacity: 0 });
      gsap.set([$("tlh"), $("tarr"), $("wait"), $("idle"), $("bn")], { opacity: 0 });
      gsap.set(document.querySelectorAll("#s03-tl .s03-lname"), { opacity: 0 });
      gsap.set([$("lane1"), $("lane2")], { clipPath: "inset(0px 100% 0px 0px)" });

      // ---------- 标题卡 ----------
      ft($("chip"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 0.08);
      ft($("ttl"), { scale: 1, y: 0, transformOrigin: "0 0" }, { scale: 0.72, y: -12, transformOrigin: "0 0", duration: 0.6, ease: MOVE }, 1.0);
      fadeIn($("tb"), 1.05);

      // ---------- 第 1 句：不换位 8 轮 → 换位后 1 轮 ----------
      cells.forEach((row, r) => row.forEach((c, j) => ft(c, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: IN }, 1.1 + r * 0.04 + j * 0.015)));
      rls.forEach((l, r) => fadeIn(l, 1.2 + r * 0.04, 0.35));
      heads.forEach((h, j) => fadeIn(h, 1.3 + j * 0.03, 0.35));
      ft($("gtop"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 1.4);
      reds.forEach((e, r) => ft(e, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: IN }, 1.9 + r * 0.06));
      zeros.forEach((e, r) => ft(e, { color: "#6b6556" }, { color: "#ffffff", duration: 0.25, ease: IN }, 1.9 + r * 0.06));
      ft($("colo"), { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.35, ease: IN }, 2.4);
      ft($("rk1"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 2.4);
      // 换位：第 r 行第 c 格 → 第 c ⊕ r 格（整行一起滑）
      fadeOut($("colo"), 3.2, 0.3);
      cells.forEach((row, r) => row.forEach((c, j) => { const dx = ((j ^ r) - j) * PX; if (dx) ft(c, { x: 0 }, { x: dx, duration: 0.9, ease: MOVE }, 3.25); }));
      greens.forEach((e) => ft(e, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 4.1));
      ft($("rk2"), { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, 4.3);
      fadeOut($("grid"), B[1]);

      // ---------- 第 2 句：塔进场；旧路径经寄存器，划掉；cp.async 直达 ----------
      ["hbm", "l2", "smem", "reg", "tc"].forEach((id, i) =>
        ft(L[id], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, B[1] + 0.1 + i * 0.07));
      fadeIn(smBox, B[1] + 0.45);
      ft($("old"), { opacity: 0 }, { opacity: 0.9, duration: 0.4, ease: IN }, B[1] + 0.5);
      ft($("po"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, B[1] + 0.4);
      ft($("x1"), { strokeDashoffset: $("x1").dataset.len }, { strokeDashoffset: 0, duration: 0.2, ease: IN }, B[1] + 1.1);
      ft($("x2"), { strokeDashoffset: $("x2").dataset.len }, { strokeDashoffset: 0, duration: 0.2, ease: IN }, B[1] + 1.3);
      ft($("strike"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: MOVE }, B[1] + 1.15);
      ft($("old"), { opacity: 0.9 }, { opacity: 0.25, duration: 0.4, ease: MOVE }, B[1] + 1.8);
      ft($("pn"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, B[1] + 1.9);
      ft($("new"), { strokeDashoffset: $("new").dataset.len }, { strokeDashoffset: 0, duration: 0.9, ease: "power1.inOut" }, B[1] + 2.0);
      fadeIn($("cpl"), B[1] + 2.3, 0.4);
      const LY = { smem: 610, l2: 752 }, RX = 1656, LX = 1748;
      const trip = (car, t, d) => {
        const pts = [[RX, LY.l2], [LX, LY.l2], [LX, LY.smem], [RX, LY.smem]];
        const seg = [0];
        for (let i = 1; i < pts.length; i++) seg.push(seg[i - 1] + Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]));
        const len = seg[seg.length - 1], kf = { easeEach: "none" };
        pts.forEach((p, i) => { kf[((seg[i] / len) * 100).toFixed(3) + "%"] = { x: p[0], y: p[1] }; });
        gsap.set(car, { xPercent: -50, yPercent: -50, x: RX, y: LY.l2 });
        fadeIn(car, t - 0.3, 0.3);
        tl.to(car, { keyframes: kf, duration: d, ease: "power1.inOut" }, t);
        ft(car, { scale: 1 }, { scale: 0.6, duration: 0.3, ease: OUT }, t + d);
        ft(car, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: OUT }, t + d + 0.1);
      };
      trip($("car1"), B[1] + 2.2, 1.0);
      trip($("car2"), B[1] + 4.0, 1.0);
      ft($("code"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, B[1] + 3.0);
      fadeOut($("cmp"), B[2]);

      // ---------- 第 3 句：11.78 → 4.09 ms，快 2.9 倍 ----------
      ft($("tbghost"), { opacity: 0 }, { opacity: 1, duration: 0.1 }, B[2]);
      ft($("tbfill"), { scaleX: 11.78 / 16 }, { scaleX: 4.09 / 16, duration: 0.9, ease: MOVE }, B[2]);
      ft($("tbnum"), { x: 11.78 * 45 + 12 }, { x: 4.09 * 45 + 12, duration: 0.9, ease: MOVE }, B[2]);
      ft($("tbv1"), { opacity: 1 }, { opacity: 0, duration: 0.3, ease: OUT }, B[2] + 0.1);
      ft($("tbv2"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, B[2] + 0.7);
      fadeOut($("tbghost"), B[2] + 1.5, 0.5);
      ft($("gainin"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: IN }, B[2] + 0.3);
      fadeOut($("gainin"), B[3]);
      fadeOut($("tw"), B[3]);

      // ---------- 第 4 句：拷贝 → 等待 → 计算；计算前的等待 = 瓶颈 ----------
      ft($("tlh"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: IN }, B[3] + 0.2);
      document.querySelectorAll("#s03-tl .s03-lname").forEach((e, i) => fadeIn(e, B[3] + 0.25 + i * 0.1, 0.4));
      ft([$("lane1"), $("lane2")], { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 2.0, ease: "none" }, B[3] + 0.4);
      fadeIn($("tarr"), B[3] + 0.8);
      ft([$("wait"), $("idle")], { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, B[3] + 2.5);
      ft($("bn"), { opacity: 0, scale: 0.85, transformOrigin: "0 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, B[3] + 2.6);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["s03"] = tl;
    })();
  </script>
