        const seg = [0];
        for (let i = 1; i < pts.length; i++) seg.push(seg[i - 1] + Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]));
        const len = seg[seg.length - 1], kf = { easeEach: "none" };
        pts.forEach((p, i) => { kf[((seg[i] / len) * 100).toFixed(3) + "%"] = { x: p[0], y: p[1] }; });
        const path = $("r" + n);
        path.setAttribute("d", "M " + pts.map((p) => p.join(" ")).join(" L "));
