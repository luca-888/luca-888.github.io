    <div id="s06-tl" class="clip s06-full" data-start="35.96" data-a-start="33.8" data-duration="6.75" data-a-duration="8.1" data-track-index="6" data-layout-allow-overlap>

  <script>
    (function () {
      const $ = (k) => document.getElementById("s06-" + k);
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const IN = "power3.out", MOVE = "power2.inOut", OUT = "power2.in";
      const ft = (el, a, b, t) => tl.fromTo(el, a, b, t);
      const fadeIn = (el, t, d = 0.5) => ft(el, { opacity: 0 }, { opacity: 1, duration: d, ease: IN }, t);
      const fadeOut = (el, t, d = 0.4, from = 1) => ft(el, { opacity: from }, { opacity: 0, duration: d, ease: OUT }, t);

      // ---------- 生成的静态子元素 ----------
      // warpgroup 点阵：4 行 × 32 个线程点，点距 20 px，行距 28 px
      const grid = $("grid"), rows = [[], [], [], []], gLay = [], bLay = [], kLay = [];
      for (let r = 0; r < 4; r++) for (let i = 0; i < 32; i++) {
        const d = document.createElement("div");
        d.className = "s06-dot";
        d.style.left = i * 20 + "px"; d.style.top = r * 28 + "px";
        d.innerHTML = '<i class="b"></i><i class="g"></i><i class="k"></i>';
        grid.appendChild(d);
        rows[r].push(d);
        bLay.push(d.children[0]); gLay.push(d.children[1]); kLay.push(d.children[2]);
      }
      const dot0b = bLay[0];
      dot0b.style.background = "var(--blue)";
      // 8 × 8 的数据块：未换位时第 0 列着色；换位后第 r 行着色格在 0 ⊕ r = r 列（对角线）
      const mkBlock = (el, color) => {
        const plain = [], swz = [];
        for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
          const q = document.createElement("i");
          q.className = "c";
          q.style.left = c * 9 + "px"; q.style.top = r * 9 + "px";
          q.style.background = "var(--cell)";
          el.appendChild(q);
        }
        for (let r = 0; r < 8; r++) {
          const p = document.createElement("i");
          p.className = "c"; p.style.left = "0px"; p.style.top = r * 9 + "px"; p.style.background = color;
          el.appendChild(p); plain.push(p);
          const s = document.createElement("i");
          s.className = "c"; s.style.left = r * 9 + "px"; s.style.top = r * 9 + "px"; s.style.background = color;
          el.appendChild(s); swz.push(s);
        }
        return { plain, swz };
      };
      const BA = mkBlock($("ba"), "var(--blue)"), BW = mkBlock($("bw"), "var(--yel-t)");
      // wgmma 正面上画 4 × 16 格：每格正好是一条 mma.sync 的正面（16 × 8），共 64 格
      let gd = "";
      for (let k = 1; k < 16; k++) gd += `M${(520 + k * 25.6).toFixed(1)} 555.2V760`;
      for (let k = 1; k < 4; k++) gd += `M520 ${(555.2 + k * 51.2).toFixed(1)}H929.6`;
      $("vgrid").setAttribute("d", gd);
      // 时间线：3 个周期，每周期 480 px：发 TMA 40 | 等待 120 | 计算 280 | 同步 40
      const lane = $("lane"), X0 = 340, CY = 480;
      const seg = (x, w, y, css, text) => {
        const s = document.createElement("div");
        s.className = "s06-seg";
        s.style.cssText += `left:${x}px;top:${y}px;width:${w}px;${css}`;
        if (text) s.textContent = text;
        lane.appendChild(s);
        return s;
      };
      for (let c = 0; c < 3; c++) {
        const b = X0 + c * CY;
        seg(b, 40, 440, "background:var(--use)");
        seg(b + 40, 120, 440, "background:var(--paper2);color:var(--note)", c === 0 ? "等待" : "");
        seg(b + 160, 280, 440, "background:var(--teal);color:var(--ink)", "计算");
        seg(b + 440, 40, 440, "background:var(--gray)");
        seg(b + 160, 280, 580, "background:var(--teal)");
      }
      [[X0, 160], [X0 + 440, 200], [X0 + 920, 200], [X0 + 1400, 40]].forEach(([x, w], i) =>
        seg(x, w, 580, "border:3px dashed var(--hot);color:var(--hot-t)", i > 0 && i < 3 ? "空闲" : ""));
      const tlab = (x, txt, color) => {
        const d = document.createElement("div");
        d.className = "s06-lbl"; d.style.cssText += `left:${x}px;top:392px;font-size:28px;color:${color}`;
        d.textContent = txt; lane.appendChild(d);
      };
      tlab(X0 - 4, "发 TMA", "var(--use-t)");
      tlab(X0 + 430, "同步", "var(--note)");

      const T = kitTower($("tower"));
      const L = T.layer, smBox = $("tower-sm");
      const rL2 = T.route("s06-rl2", ["l2", "smem"], { color: "var(--use)" });
      const rTC = T.route("s06-rtc", ["smem", "tc"], { color: "var(--teal)", lane: 1 });

      // ---------- 初始状态 ----------
      gsap.set([$("chip"), $("ttl")], { opacity: 0 });
      gsap.set($("ttl"), { x: 0, y: 0, scale: 1 });
      const fx = (v) => (v / 781.86) * 544;
      gsap.set($("fill"), { scaleX: 309 / 781.86 });
      gsap.set([$("n309"), $("n484")], { x: fx(309) + 10 });
      gsap.set([$("mt"), $("n484"), $("gain")], { opacity: 0 });
      gsap.set($("hz"), { x: 0, y: 0, scale: 1 });
      gsap.set([$("c0"), $("c1"), $("c2"), $("c3"), $("blkf"), $("wgf"), $("lv0"), $("lv1"), $("lv2"), $("lv3")], { opacity: 0 });
      gsap.set(grid.children, { opacity: 0 });
      gsap.set(gLay.concat(kLay), { opacity: 0 });
      gsap.set([$("wgl"), $("t0"), $("mb"), $("full"), $("b16"), $("b32")], { opacity: 0 });
      gsap.set([$("bfa"), $("bfw")], { scaleX: 0 });
      gsap.set([L.tc, L.reg, L.smem, L.l2, L.hbm, smBox], { opacity: 0 });
      gsap.set([rL2, rTC], { strokeDashoffset: (i, el) => el.dataset.len });
      gsap.set([$("ba"), $("bw"), $("swz"), $("regx"), $("skip")], { opacity: 0 });
      gsap.set(BA.swz.concat(BW.swz), { opacity: 0 });
      gsap.set([$("vmma"), $("vwg"), $("vl1"), $("vl2"), $("vl3"), $("vl4"), $("x64")], { opacity: 0 });
      gsap.set($("vgrid"), { opacity: 0 });
      gsap.set([$("tk1"), $("tk2"), $("bn")], { opacity: 0 });
      gsap.set(lane, { clipPath: "inset(0px 1920px 0px 0px)" });

      // ---------- 0–1.0 标题卡；1.0 缩到版本名右侧 ----------
      ft($("chip"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: IN }, 0.0);
      ft($("ttl"), { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: IN }, 0.1);
      ft($("ttl"), { x: 0, y: 0, scale: 1 }, { x: 224, y: -72, scale: 0.6, duration: 0.7, ease: MOVE }, 1.0);

      // ---------- 1.0 层级：thread → warp → warpgroup → block ----------
      fadeIn($("c0"), 1.05); fadeIn($("lv0"), 1.05, 0.35);
      ft(rows[0][0], { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, 1.05);
      fadeIn($("c1"), 2.6);
      fadeOut($("lv0"), 2.6, 0.25); fadeIn($("lv1"), 2.75, 0.35);
      rows[0].slice(1).forEach((d, i) => ft(d, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: IN }, 2.6 + i * 0.02));
      fadeIn($("c2"), 4.3);
      fadeOut($("lv1"), 4.3, 0.25); fadeIn($("lv2"), 4.45);
      for (let r = 1; r < 4; r++) rows[r].forEach((d, i) => ft(d, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: IN }, 4.3 + (r - 1) * 0.15 + i * 0.004));
      ft($("wgf"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 4.8);
      fadeIn($("lv3"), 5.0);
      fadeIn($("c3"), 5.3);
      ft($("blkf"), { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.5, ease: IN }, 5.3);
      fadeIn($("mt"), 5.5);

      // ---------- 6.2 TMA：塔进场；层级缩到左上；线程 0 发出；一整块 L2 → 共享内存并换位 ----------
      fadeOut($("mt"), 6.2, 0.3);
      [$("c0"), $("c1"), $("c2"), $("c3"), $("lv2"), $("lv3"), $("blkf")].forEach((e) => fadeOut(e, 6.2, 0.3));
      ft($("hz"), { x: 0, y: 0, scale: 1 }, { x: -127.5, y: -12.5, scale: 0.75, duration: 1.0, ease: MOVE }, 6.3);
      fadeIn($("wgl"), 7.1);
      ["hbm", "l2", "smem", "reg", "tc"].forEach((id, i) =>
        ft(L[id], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: IN }, 6.4 + i * 0.08));
      ft(smBox, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: IN }, 6.8);
      // 其余 127 个点变灰，只剩线程 0
      ft(gLay.slice(1), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: MOVE }, 7.6);
      ft(rows[0][0], { scale: 1 }, { scale: 1.6, duration: 0.4, ease: IN }, 7.8);
      fadeIn($("t0"), 7.9);
      // A 块出现在 L2，沿 L2 → 共享内存移动，途中换位
      ft($("ba"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: IN }, 8.8);
      ft(rL2, { strokeDashoffset: rL2.dataset.len }, { strokeDashoffset: 0, duration: 0.8, ease: MOVE }, 9.6);
      ft($("ba"), { y: 0 }, { y: -142, duration: 1.0, ease: MOVE }, 9.6);
      ft(BA.plain, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: MOVE }, 10.3);
      BA.swz.forEach((q, i) => ft(q, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: IN }, 10.4 + i * 0.05));
