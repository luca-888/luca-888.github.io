<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PagedAttention · Swiss</title>
<style>html,body{margin:0;background:#f1ede4}canvas{display:block}</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
// ======================= palette & type =======================
const K = {
  paper: '#f1ede4', paper2: '#e6e0d3', ink: '#141414', ink2: '#3a3a3a', gray: '#8a8474',
  red: '#e5322d', blue: '#2350d8', yel: '#f4c21b', yelD: '#9a7500',
};
const CUBE = {
  blue: ['#5a7ff0', '#2350d8', '#1a3aa3'], yel: ['#f8d75a', '#f4c21b', '#c99a00'],
  gray: ['#d8d2c4', '#c3bcac', '#aaa392'], ink: ['#4a4a4a', '#2c2c2c', '#161616'], red: ['#f06a5f', '#e5322d', '#b3211c'],
};
const ACC = { b: K.blue, r: K.red, y: K.yelD, k: K.ink, g: K.gray };
const HN = '"Helvetica Neue", "PingFang SC", sans-serif';
const ZH = '"PingFang SC", "Helvetica Neue", sans-serif';
const font = (w, s, f = ZH) => `${w} ${s}px ${f}`;

// ======================= math =======================
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const L = (a, b, p) => a + (b - a) * p;
const EO = (x) => { x = cl(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };           // expo out
const EI = (x) => { x = cl(x); return x === 0 ? 0 : Math.pow(2, 10 * x - 10); };            // expo in
const EIO = (x) => { x = cl(x); return x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2; }; // quint in-out
const O = (t, a, d = .5) => EO((t - a) / d);
const IO = (t, a, d = .6) => EIO((t - a) / d);
function SP(t, a, k = 1) { const x = (t - a) * k; if (x <= 0) return 0; const z = .5, w = 16, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); }
const bez = (p, t) => { const u = 1 - t; return [0, 1].map((j) => u * u * u * p[0][j] + 3 * u * u * t * p[1][j] + 3 * u * t * t * p[2][j] + t * t * t * p[3][j]); };
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }
const fmt = (v, d = 0) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

// ======================= drawing primitives =======================
let X; // current ctx
function poly(pts, fill, stroke, lw = 1) {
  X.beginPath(); pts.forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y)); X.closePath();
  if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.stroke(); }
}
function rect(x, y, w, h, fill, stroke, lw = 1) {
  if (w <= 0 || h <= 0) return; X.beginPath(); X.rect(x, y, w, h);
  if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.stroke(); }
}
function line(pts, col, lw = 2, dash) {
  X.beginPath(); pts.forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y));
  X.strokeStyle = col; X.lineWidth = lw; X.lineCap = 'butt'; X.lineJoin = 'miter'; if (dash) X.setLineDash(dash); X.stroke(); X.setLineDash([]);
}
function txt(s, x, y, f, fill, align = 'left', base = 'alphabetic') { X.font = f; X.fillStyle = fill; X.textAlign = align; X.textBaseline = base; X.fillText(s, x, y); }
const tw = (s, f) => { X.font = f; return X.measureText(s).width; };
function head(x, y, ang, size, fill) { poly([[x, y], [x - size * Math.cos(ang - .42), y - size * Math.sin(ang - .42)], [x - size * Math.cos(ang + .42), y - size * Math.sin(ang + .42)]], fill); }
// partial polyline draw, returns end point
function polyPart(pts, p, col, lw = 2, arrow = true) {
  if (p <= 0) return;
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let rem = tot * cl(p); const out = [pts[0]];
  for (let i = 1; i < pts.length && rem > 0; i++) {
    const d = seg[i - 1], q = Math.min(1, rem / d);
    out.push([L(pts[i - 1][0], pts[i][0], q), L(pts[i - 1][1], pts[i][1], q)]); rem -= d;
  }
  const n = out.length, [ex, ey] = out[n - 1], [px, py] = out[n - 2] || out[0];
  const ang = Math.atan2(ey - py, ex - px);
  if (arrow && p >= .999) { line(out.slice(0, -1).concat([[ex - Math.cos(ang) * 8, ey - Math.sin(ang) * 8]]), col, lw); head(ex, ey, ang, 15, col); }
  else line(out, col, lw);
}
// hatch pattern cache
const PAT = {};
function hatchPat(col, bg, gap = 11, w = 3.2) {
  const key = col + bg + gap; if (PAT[key]) return PAT[key];
  const c = document.createElement('canvas'); c.width = c.height = gap; const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, gap, gap); }
  g.strokeStyle = col; g.lineWidth = w; g.beginPath();
  for (let o = -gap; o <= gap * 2; o += gap) { g.moveTo(o, gap); g.lineTo(o + gap, 0); }
  g.stroke(); PAT[key] = X.createPattern(c, 'repeat'); return PAT[key];
}
// rich text: "{r:红字}"
function runs(s) { const out = []; const re = /\{(\w):([^}]*)\}/g; let last = 0, m; while ((m = re.exec(s))) { if (m.index > last) out.push([s.slice(last, m.index), null]); out.push([m[2], m[1]]); last = re.lastIndex; } if (last < s.length) out.push([s.slice(last), null]); return out; }
function rich(s, x, y, f, base, align = 'left') {
  X.font = f; const r = runs(s); const w = r.reduce((a, [t]) => a + X.measureText(t).width, 0);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x; X.textAlign = 'left'; X.textBaseline = 'alphabetic';
  for (const [t, k] of r) { X.fillStyle = k ? ACC[k] : base; X.fillText(t, cx, y); cx += X.measureText(t).width; }
  return w;
}
// mask-reveal: draws fn inside a clip that rises from below
function rise(p, x, y, w, h, fn) {
  if (p <= 0) return; X.save(); X.beginPath(); X.rect(x, y, w, h); X.clip(); X.translate(0, (1 - p) * h); fn(); X.restore();
}
function wipe(p, x, y, w, h, fn) { if (p <= 0) return; X.save(); X.beginPath(); X.rect(x, y, w * p, h); X.clip(); fn(); X.restore(); }

// ======================= isometric (flat print) =======================
function Iso(ox, oy, s, H = 28, cols = 4, gap = 2.4) {
  const I = { ox, oy, s, H, cols, gap };
  I.pt = (u, v, z = 0) => [ox + (u - v) * s * .866, oy + (u + v) * s * .5 - z];
  I.uv = (k, m) => [(k % cols) * gap + (m % 2), Math.floor(k / cols) * gap + Math.floor(m / 2)];
  I.cc = (k, m, z = 0) => { const [u, v] = I.uv(k, m); return I.pt(u + .5, v + .5, z); };
  I.bc = (k, z = 0) => { const [u, v] = I.uv(k, 0); return I.pt(u + 1, v + 1, z); };
  I.ext = (rows) => rows * gap - (gap - 2);
  return I;
}
function isoCube(I, u, v, h, col, z0 = 0, inset = .07, lw = 1.2) {
  const a = inset, b = 1 - inset;
  const T = [I.pt(u + a, v + a, z0 + h), I.pt(u + b, v + a, z0 + h), I.pt(u + b, v + b, z0 + h), I.pt(u + a, v + b, z0 + h)];
  const B = [I.pt(u + b, v + a, z0), I.pt(u + b, v + b, z0), I.pt(u + a, v + b, z0)];
  poly([T[3], T[2], B[1], B[2]], col[2], K.ink, lw);
  poly([T[2], T[1], B[0], B[1]], col[1], K.ink, lw);
  poly(T, col[0], K.ink, lw);
}
function isoTile(I, u, v, fill, lw = 1.1, stroke = K.ink) {
  poly([I.pt(u + .06, v + .06), I.pt(u + .94, v + .06), I.pt(u + .94, v + .94), I.pt(u + .06, v + .94)], fill, stroke, lw);
}
// o: { t0, n, rows, cell(k,m)->{col, at, z0}|null, tile(k,m)->fill|null, label(k)->color|null }
function drawSlab(I, t, o) {
  const rows = o.rows || 4, n = o.n || 16, ext = I.ext(rows) + .4;
  const ap = O(t, o.t0, .7);
  if (ap <= 0) return;
  X.save(); X.globalAlpha = cl(ap * 1.5); X.translate(0, (1 - ap) * 60);
  const A = I.pt(-.4, -.4), B = I.pt(ext, -.4), C = I.pt(ext, ext), D = I.pt(-.4, ext), th = 22;
  poly([D, C, [C[0], C[1] + th], [D[0], D[1] + th]], K.ink);
  poly([C, B, [B[0], B[1] + th], [C[0], C[1] + th]], K.ink2);
  poly([A, B, C, D], K.paper2, K.ink, 2);
  X.restore();
  const cells = [];
  for (let k = 0; k < n; k++) for (let m = 0; m < 4; m++) { const [u, v] = I.uv(k, m); cells.push({ k, m, u, v }); }
  cells.sort((p, q) => p.u + p.v - q.u - q.v);
  for (const c of cells) {
    const a = O(t, o.t0 + .25 + (c.u + c.v) * .018, .4);
    if (a <= 0) continue;
    X.save(); X.globalAlpha = a; X.translate(0, (1 - a) * 30);
    isoTile(I, c.u, c.v, (o.tile && o.tile(c.k, c.m)) || K.paper);
    const s = o.cell && o.cell(c.k, c.m);
    if (s) {
      const h = I.H * SP(t, s.at, 1.1);
      if (h > .5) isoCube(I, c.u, c.v, h, s.col, s.z0 || 0);
      const rp = (t - s.at) / .45;
      if (s.ring && rp > 0 && rp < 1) { X.globalAlpha = 1 - rp; const g = .5 + rp * 1.1; poly([I.pt(c.u + .5 - g, c.v + .5 - g), I.pt(c.u + .5 + g, c.v + .5 - g), I.pt(c.u + .5 + g, c.v + .5 + g), I.pt(c.u + .5 - g, c.v + .5 + g)], null, K.ink, 2); }
    }
    X.restore();
  }
  if (o.label) for (let k = 0; k < n; k++) {
    const col = o.label(k); if (!col) continue;
    const a = O(t, o.t0 + .7 + k * .02, .3); if (a <= 0) continue;
    const [u, v] = I.uv(k, 2), [x, y] = I.pt(u - .32, v + 1.32);
    X.globalAlpha = a; txt('#' + k, x, y + 8, font(800, 17, HN), col, 'center'); X.globalAlpha = 1;
  }
}
// flying token square with trailing dots
function flyer(pts, q, col = K.red, size = 38) {
  if (q <= 0 || q >= 1) return;
  const e = EIO(q);
  for (let j = 3; j >= 1; j--) { const [x, y] = bez(pts, cl(e - j * .05)); rect(x - 4, y - 4, 8, 8, K.ink); }
  const [x, y] = bez(pts, e), s = L(size, size * .7, e);
  rect(x - s / 2, y - s / 2, s, s, col, K.ink, 2);
}

// ======================= shared data =======================
const TOK = ['我', '今天', '去', '公园', '散步', '，', '天气', '很', '好', '，', '风', '也', '很', '舒服'];
const TABLE = [7, 2, 11, 5];
const OTHER = { 0: 4, 3: 4, 4: 3, 8: 4, 13: 2, 14: 4 };

// ======================= scenes =======================
const SC = [];
const EV = []; // [globalTime, type]

// ---------- 00 hook ----------
SC.push({
  id: 'hook', dur: 9,
  cam: [[0, 960, 540, 1], [9, 960, 540, 1.02]],
  beats: [],
  ev: (() => { const e = []; for (let i = 0; i < 12; i++) e.push([.7 + i * .1, 'tick']); e.push([2.0, 'thud'], [4.2, 'whoosh'], [4.65, 'thud'], [4.9, 'tick'], [5.1, 'tick'], [6.0, 'pop']); return e; })(),
  draw(t) {
    const out = EI((t - 4.2) / .5);
    X.save(); X.translate(-2100 * out, 0);
    // strip texture
    const r = rng(11), n = 48, x0 = 96, cw = 1728 / n, y = 740, h = 96;
    for (let i = 0; i < n; i++) {
      const v = r(), a = O(t, .15 + i * .012, .35);
      const x = x0 + i * cw;
      X.save(); X.beginPath(); X.rect(x, y, cw, h); X.clip(); X.translate(0, (1 - a) * h);
      rect(x + 1, y, cw - 2, h, v < .22 ? K.blue : v < .62 ? hatchPat(K.ink, K.paper) : v < .82 ? hatchPat(K.red, K.paper) : K.paper2, K.ink, 1.5);
      X.restore();
    }
    const v = 79.6 * EO((t - .7) / 1.3);
    rise(O(t, .5, .5), 80, 180, 1800, 400, () => txt(fmt(v, 1) + '%', 88, 540, font(900, 330, HN), K.red));
    rise(O(t, 2.0, .5), 96, 580, 1700, 110, () => rich('的 {b:KV cache} 显存，被白白浪费', 100, 668, font(800, 72), K.ink));
    X.globalAlpha = O(t, 2.6, .5); txt('现有 LLM 推理系统的最坏情况 · 数据：vLLM 论文（SOSP 2023）', 96, 880, font(600, 22), K.gray); X.globalAlpha = 1;
    X.restore();
    // title
    if (t > 4.4) {
      const s = SP(t, 4.6, 1);
      X.save(); X.translate(96 + 90, 250 + 90); X.scale(s, s); rect(-90, -90, 180, 180, K.red); X.restore();
      rise(O(t, 4.85, .45), 320, 150, 1500, 230, () => txt('Paged', 316, 350, font(900, 210, HN), K.ink));
      rise(O(t, 5.05, .45), 90, 380, 1800, 230, () => txt('Attention', 86, 580, font(900, 210, HN), K.ink));
      rect(96, 640, 1728 * EIO((t - 5.5) / .7), 4, K.ink);
      rise(O(t, 6.0, .5), 96, 670, 1728, 90, () => rich('vLLM 用操作系统的{r:分页}，把 KV cache 浪费压到 {r:4% 以下}', 96, 735, font(800, 48), K.ink));
    }
  },
});

// ---------- 01 KV cache ----------
SC.push({
  id: 'kv', dur: 19, num: '01', title: 'KV cache 决定并发', card: K.blue,
  cam: [[0, 960, 540, 1], [11.6, 960, 540, 1], [12.6, 960, 1240, 1], [19, 960, 1240, 1.02]],
  beats: [[1.4, '每生成一个 token，都要回看之前所有 token 的 {b:K} 和 {y:V}'], [5.6, '把它们存在显存里，就是 {b:KV cache}'], [8.2, '13B 模型：每个 token 约 {r:800 KB}'], [12.6, 'A100 40 GB：放完 26 GB 权重，只剩约 {b:12 GB}'], [16.2, '一种颜色一个请求：放得越紧，能同时服务的请求越多']],
  ev: (() => { const e = []; for (let i = 0; i < 7; i++) e.push([1.4 + i * .08, 'tick']); e.push([3.6, 'pop']); for (let i = 0; i < 7; i++) e.push([4.2 + i * .1, 'tick']); e.push([5.6, 'thud'], [6.4, 'click']);
    for (let i = 0; i < 9; i++) e.push([8.2 + i * .12, 'tick']); e.push([10.4, 'thud'], [11.6, 'whoosh'], [12.7, 'click'], [13.4, 'click'], [14.1, 'tick'], [14.4, 'thud'], [16.2, 'whoosh']); return e; })(),
  draw(t) {
    const toks = ['今天', '天气', '真', '不错', '，', '我们', '去', '公园'];
    const w = 176, step = 204, x0 = 960 - (8 * step - 28) / 2, y = 300;
    toks.forEach((s, i) => {
      const isNew = i === 7, at = isNew ? 3.6 : 1.4 + i * .08, a = O(t, at, .45);
      if (a > 0) {
        X.save(); X.globalAlpha = cl(a * 2); X.translate(0, (1 - a) * -40);
        rect(x0 + i * step, y, w, 80, isNew ? K.red : K.paper, K.ink, 2);
        txt(s, x0 + i * step + w / 2, y + 41, font(800, 34), isNew ? '#fff' : K.ink, 'center', 'middle');
        X.restore();
      }
      const kvA = isNew ? 6.4 : 2.0 + i * .08;
      rect(x0 + i * step, y + 104, w * EIO((t - kvA) / .45), 30, K.blue);
      rect(x0 + i * step, y + 142, w * EIO((t - kvA - .1) / .45), 30, K.yel);
    });
    X.globalAlpha = O(t, 2.0, .4); txt('K', x0 - 20, y + 128, font(900, 26, HN), K.blue, 'right'); txt('V', x0 - 20, y + 166, font(900, 26, HN), K.yelD, 'right'); X.globalAlpha = 1;
    // attention arcs (q·K)
    const nx = x0 + 7 * step + w / 2;
    for (let i = 0; i < 7; i++) {
      const tx = x0 + i * step + w / 2, h = 36 + (7 - i) * 13, p = IO(t, 4.2 + i * .1, .45);
      if (p <= 0) continue;
      const pts = []; for (let s = 0; s <= 30; s++) { const q = s / 30; pts.push(bez([[nx, y - 6], [nx, y - 6 - h], [tx, y - 6 - h], [tx, y - 6]], q)); }
      polyPart(pts, p, K.ink, 2, true);
    }
    X.globalAlpha = O(t, 4.5, .4); txt('q · K', nx + 90, y - 60, font(800, 26, HN), K.red, 'left'); X.globalAlpha = 1;
    // KV cache bracket
    const bw = L(7 * step - 28, 8 * step - 28, IO(t, 6.4, .5)), bp = IO(t, 5.6, .6);
    if (bp > 0) {
      line([[x0, y + 186], [x0, y + 198], [x0 + bw * bp, y + 198], [x0 + bw * bp, y + 186]], K.ink, 3);
      rise(O(t, 5.8, .45), x0, y + 210, 1200, 60, () => { txt('KV cache', x0, y + 254, font(900, 38, HN), K.blue); txt('存在 GPU 显存里，随生成不断变长', x0 + 200, y + 252, font(600, 26), K.gray); });
    }
    // formula
    const parts = [['2', 'K 和 V'], ['×'], ['40', '层'], ['×'], ['5120', 'hidden'], ['×'], ['2 B', 'FP16'], ['='], ['800 KB', '每个 token']];
    const fN = font(900, 84, HN), fL = font(700, 22);
    const widths = parts.map((p) => tw(p[0] === '800 KB' ? '800 KB' : p[0], fN) + (p.length === 1 ? 40 : 44));
    let fx = 960 - widths.reduce((a, b) => a + b, 0) / 2;
    parts.forEach((p, i) => {
      const a = O(t, 8.2 + i * .12, .45), last = i === parts.length - 1;
      const s = last ? fmt(Math.round(800 * EO((t - 9.3) / 1.1))) + ' KB' : p[0];
      rise(a, fx - 10, 660, widths[i] + 20, 150, () => {
        txt(s, fx, 760, fN, last ? K.red : p.length === 1 ? K.gray : K.ink);
        if (p[1]) txt(p[1], fx + 2, 798, fL, K.gray);
      });
      fx += widths[i];
    });
    // ---- memory ----
    if (t > 11.4) {
      const by = 1040, bh = 130, W = 1728;
      rise(O(t, 12.2, .4), 96, 970, 1000, 60, () => txt('A100 · 40 GB 显存', 96, 1012, font(900, 32), K.ink));
      rect(96, by, W, bh, null, K.ink, 3);
      const w1 = W * 26 / 40, w2 = W * 12 / 40, w3 = W * 2 / 40;
      rect(96, by, w1 * IO(t, 12.6, .8), bh, CUBE.gray[1]);
      rect(96 + w1, by, w2 * IO(t, 13.3, .6), bh, K.blue);
      rect(96 + w1 + w2, by, w3 * IO(t, 13.8, .3), bh, hatchPat(K.ink, K.paper));
      line([[96 + w1, by], [96 + w1, by + bh]], K.ink, 2); line([[96 + w1 + w2, by], [96 + w1 + w2, by + bh]], K.ink, 2);
      rise(O(t, 13.0, .4), 96, by, w1, bh, () => txt('模型权重 26 GB', 130, by + 78, font(800, 36), K.ink));
      rise(O(t, 13.6, .4), 96 + w1, by, w2, bh, () => txt('KV cache ≈ 12 GB', 96 + w1 + 28, by + 78, font(800, 34, HN), '#fff'));
      // zoom lines + grid
      const gx = 744, gy = 1260, cs = 14, gp = 18, cols = 60, rowsN = 7;
      const zl = IO(t, 13.9, .5);
      if (zl > 0) { line([[96 + w1, by + bh], [L(96 + w1, gx, zl), L(by + bh, gy - 10, zl)]], K.ink, 1.5); line([[96 + w1 + w2, by + bh], [L(96 + w1 + w2, gx + cols * gp - 4, zl), L(by + bh, gy - 10, zl)]], K.ink, 1.5); }
      const runsR = [70, 44, 96, 58, 30, 82, 60, 50], cc = [K.blue, K.yel, K.ink, CUBE.gray[2], K.red];
      const req = []; runsR.forEach((n, k) => { for (let j = 0; j < n; j++) req.push(k); });
      for (let k = 0; k < cols * rowsN; k++) {
        const i = k % cols, j = Math.floor(k / cols);
        const a = O(t, 14.1 + i * .012, .25); if (a <= 0) continue;
        const rc = t > 16.2 + (req[k] ?? 9) * .08 ? cc[(req[k] ?? 0) % 5] : K.blue;
        const s = cs * a;
        rect(gx + i * gp + (cs - s) / 2, gy + j * gp + (cs - s) / 2, s, s, rc);
      }

SC.push({

        rect(110, y, 260, 58, hot ? '#fbe3e1' : K.paper, hot ? K.red : K.ink, hot ? 3 : 2);

        let k = i === 0 ? 3 : 9;

        const [u, v] = I.uv(target, 0), [ex, ey] = I.pt(u, v + 1, 4);
        const mx = 420 + si * 30 + i * 14, ry = y + 29;

        polyPart([[372, ry], [mx, ry], [mx, ey], [ex - 12, ey]], p, sq.col === K.yelD ? K.yelD : K.blue, 2.5);

    // write labels

      if (t < at || t > at + 2.2) return; const [x, y] = I.cc(k, 2, I.H + 40);

    // use cases

// ======================= timeline =======================
let acc = 0; for (const s of SC) { s.start = acc; acc += s.dur; }
const TOTAL = acc;
for (const s of SC) {
  for (const [lt, ty] of s.ev) EV.push([s.start + lt, ty]);
  if (s.num) EV.push([s.start - .45, 'whoosh'], [s.start + .05, 'thud'], [s.start + 1.05, 'whoosh']);
}
EV.sort((a, b) => a[0] - b[0]);

function camAt(s, lt) {
  const k = s.cam; if (lt <= k[0][0]) return k[0];
  for (let i = 0; i < k.length - 1; i++) if (lt < k[i + 1][0]) { const p = EIO((lt - k[i][0]) / (k[i + 1][0] - k[i][0])); return [0, L(k[i][1], k[i + 1][1], p), L(k[i][2], k[i + 1][2], p), L(k[i][3], k[i + 1][3], p)]; }
  return k[k.length - 1];
}
function chapterCard(s, lc) {
  if (!s.num || lc < -.45 || lc > 1.55) return;
  const x = lc < 0 ? 1920 * (1 - EO((lc + .45) / .45)) : -1920 * EI((lc - 1.05) / .45);
  X.setTransform(1, 0, 0, 1, 0, 0);
  rect(x, 0, 1920, 1080, s.card);
  X.save(); X.beginPath(); X.rect(x, 0, 1920, 1080); X.clip();
  const nx = x * 1.25;
  txt(s.num, nx + 70, 1010, font(900, 620, HN), 'rgba(255,255,255,.95)');
  txt('PagedAttention · ' + s.num + ' / 06', x + 1824, 120, font(800, 24, HN), 'rgba(255,255,255,.7)', 'right');
  rise(O(lc, .05, .45), x + 90, 150, 1740, 150, () => txt(s.title, x + 96, 270, font(900, 100), '#fff'));
  X.restore();
}
function chrome(s, lt) {
  if (!s.num) return;
  const a = O(lt, 1.3, .4) * (s.chromeUntil ? 1 - O(lt, s.chromeUntil, .2) : 1);
  if (a <= 0) return;
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = a;
  rect(0, 0, 1920, 108, K.paper);
  txt(s.num, 96, 78, font(900, 28, HN), K.red); txt(s.title, 148, 78, font(800, 26), K.ink);
  txt('PagedAttention', 1824, 78, font(800, 22, HN), K.gray, 'right');
  rect(96, 104, 1728 * EIO((lt - 1.3) / .6), 2, K.ink);
  X.globalAlpha = 1;
}
function caption(s, lt) {
  const b = s.beats; if (!b.length) return;
  let i = -1; for (let j = 0; j < b.length; j++) if (lt >= b[j][0]) i = j;
  X.setTransform(1, 0, 0, 1, 0, 0);
  const endA = 1 - O(lt, s.dur - .5, .3);
  const draw = (str, p, out) => {
    if (!str) return; const f = font(800, 38);
    X.save(); X.globalAlpha = endA;
    X.beginPath(); X.rect(96, 926, 1760, 72); X.clip();
    const y = 972 + (1 - p) * 60 - out * 60;
    rect(96, y - 30, 20, 20, K.red);
    rich(str, 136, y - 6 + 10, f, K.ink);
    X.restore();
  };
  if (i >= 0) {
    const p = O(lt, b[i][0] + .14, .45);
    draw(b[i][1], p, 0);
    if (i > 0 && lt < b[i][0] + .2) draw(b[i - 1][1], 1, EI((lt - b[i][0]) / .18));
  }
}
function drawFrame(ctx, T) {
  X = ctx;
  let idx = 0; for (let i = 0; i < SC.length; i++) if (T >= SC[i].start) idx = i;
  const s = SC[idx], lt = T - s.start;
  const [, cx, cy, z] = camAt(s, lt);
  X.setTransform(1, 0, 0, 1, 0, 0); rect(0, 0, 1920, 1080, K.paper);
  X.setTransform(z, 0, 0, z, 960 - cx * z, 540 - cy * z);
  s.draw(lt);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1;
  chrome(s, lt);
  caption(s, lt);
  chapterCard(s, lt);
  const nx = SC[idx + 1]; if (nx) chapterCard(nx, T - nx.start);
  const fe = O(T, TOTAL - 1.0, .9); if (fe > 0) { X.globalAlpha = fe; rect(0, 0, 1920, 1080, '#000'); X.globalAlpha = 1; }
}

// ======================= runtime (motion blur) =======================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = 1920; off.height = 1080; const octx = off.getContext('2d');
window.DURATION = TOTAL;
window.EVENTS = EV;
window.renderAt = (t, fps = 60, samples = 5, shutter = .5) => {
  for (let s = 0; s < samples; s++) {
    const ts = t - (shutter / fps) * (1 - s / (samples - 1));
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalAlpha = 1;
    drawFrame(octx, Math.max(0, ts));
    ctx.globalAlpha = 1 / (s + 1); ctx.drawImage(off, 0, 0);
  }
  ctx.globalAlpha = 1;
};
window.renderAt(3);
