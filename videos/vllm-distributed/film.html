<script>
// v3：开头先由浅入深解剖 DeepSeek-V4-Pro（6 幕），再按确认过的分镜讲怎么分。把 DeepSeek-V4-Pro 放到一台 8×B200 上，按“显存账本”讲；每幕只讲一件事，元素逐个出现。

//   余下的显存按全部给 KV cache 估算，未扣中间结果；“其余完整一份”按全部复制估算。负载、时间轴为示意。

function IN(t0, fn, d = .7, dy = 20) { const p = P(t0, d); if (p <= 0) return; X.save(); X.globalAlpha *= p; X.translate(0, (1 - p) * dy); fn(); X.restore(); }
// 从小放大着出现（色块用）

const PAT = {};

// 一张卡的账本：高度按显存画，180 GB 的外框；每段有自己的进度 p（0→1 时长出来）

function minis(y, t0, fn) { for (let g = 0; g < 8; g++) POP(t0 + g * .09, mx(g), y, MW, 360, () => { R(mx(g), y, MW, 360, K.paper2); TX(`GPU ${g}`, mx(g), y - 14, font(700, 26, HN), K.gray); fn(g, mx(g), y); box(mx(g) - 1.5, y - 1.5, MW + 3, 363, 3); }); }

//   MoE = router + 384 个 routed expert（每个 token 选 6 个）+ 1 个 shared expert，结果加权求和；一个 expert = 3 个 7168×3072 的矩阵（FP4 约 35 MB）；
//   attention：Q 投影出 128 个 head，KV 投影出每个 token 1 份 KV（num_key_value_heads = 1）写入 KV cache，再读全部 KV 算注意力，最后输出投影。
//   大小：attention 每层约 0.3 GB，expert 每层 13.5 GB；61 层 expert 合计 822 GB；embedding 与输出等约 5 GB。官方：总参数 1.6T，每个 token 激活 49B。
const CV = 2.6, MORPH = 1.0;

function ln(pts, col = K.ink, lw = 4, p = 1) { if (p <= 0) return; X.strokeStyle = col; X.lineWidth = lw; X.lineJoin = 'round'; X.beginPath(); let tot = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let left = tot * clamp(p); X.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++) { const f = Math.min(1, left / seg[i - 1]); X.lineTo(mix(pts[i - 1][0], pts[i][0], f), mix(pts[i - 1][1], pts[i][1], f)); left -= seg[i - 1]; } X.stroke(); }

function anat() {

    TX('DeepSeek V4-Pro', 88, 219, font(700, 150, HN), K.ink);   // 2026-10-02：去掉官方 logo，模型名改为纯文字
    IN(.5, () => { const f = font(700, 60); X.font = f; const w = X.measureText('分布式推理').width + 48; R(96, 310, w, 84, K.ink); TX('分布式推理', 120, 373, f, '#fff'); TX('1.6T 参数，怎么放到 8 张卡上', 96 + w + 32, 373, f, K.ink); });

    IN(t0, () => { R(96, 100, 164, 50, K.ink2); TX('模型结构', 114, 136, font(700, 32), '#fff'); }, .5, 0);

  blk(x, yb, 130, hb, K.blue, 'embedding', '', 22); glow(x, 130); const xe = x; x += 146;
  const xl = x; for (let k = 0; k < 30 && k < shown; k++) { R(x + k * pitch, yb, sw, hb, K.teal); wave(x + k * pitch, sw); } x += 30 * pitch + 16 * eL;

  const xr = x; for (let k = 0; k < 30 && k + 31 < shown; k++) { R(x + k * pitch, yb, sw, hb, K.teal); wave(x + k * pitch, sw); } x += 30 * pitch + 16;

    A(wa, () => RICH(`token 走到{p:第 ${n} 层}，共 61 层`, xl, yb - 22, font(700, 30), K.ink2)); }
  // ---- 拉开的那一层 ----
  if (eL < .04) { if (30 < shown) { R(xm, yb, sw, hb, K.teal); wave(xm, sw); } }
  else { R(xm, Y0, wmid, H, K.paper2); box(xm, Y0, wmid, H, 4);
    X.save(); X.beginPath(); X.rect(xm - 2, Y0 - 44, wmid + 4, H + 260); X.clip(); X.translate(xm, 0); X.scale(wmid / WF, 1);
    const ai = clamp((eL - .45) * 2), a = 330 - 170 * eM + 370 * eA, mw = 550 + 290 * eM - 250 * eA, xa = 20, p1 = xa + a + 25, xmo = xa + a + 50, p2 = xmo + mw + 25;
