<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LLM 量化 · 影片</title>
<style>html,body{margin:0;background:#f1ede4;overflow:hidden}canvas{display:block;width:100vw;height:100vh;object-fit:contain}</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
// LLM 量化，12 幕（第 3 版：从“模型是一堆数、一个数要几个 bit”推起，每一幕回答上一幕留下的问题）。示例模型 Qwen3.8-27B，示例显卡 RTX 5090（32 GiB）。
// 速度、体积、分数引用公开来源（见 keyframes.md）；第 4 幕的直方图与第 5、6 幕的舍入误差是本站在真实权重上算的（scripts/quant_weight_hist.py）。贯穿全片的图形：一张灰度图（一个球）、刻度、显卡的显存条、被追踪的权重 0.37（purple）。
// ?play 在浏览器里播放；node film.mjs 渲染（见该文件头部）。
const K = { paper: '#f1ede4', paper2: '#e6e0d3', ink: '#141414', ink2: '#3a3a3a', gray: '#8a8474', lg: '#b9b2a2',
  red: '#e5322d', blue: '#2350d8', yel: '#f4c21b', yelD: '#9a7500', purple: '#7c3ff5', teal: '#0fa391' };
const ZH = '"PingFang SC", "Helvetica Neue", sans-serif', HN = '"Helvetica Neue", "PingFang SC", sans-serif';
const font = (w, s, f = ZH) => `${w} ${s}px ${f}`;
let X, T = 0;
const clamp = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const io = (x) => { x = clamp(x); return x < .5 ? 4 * x ** 3 : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const P = (t0, d = .7) => ease((T - t0) / d);                    // 缓出
const S = (t0, d = 1) => io((T - t0) / d);                       // 缓入缓出
const mix = (a, b, p) => a + (b - a) * p;
const R = (x, y, w, h, c) => { if (w > 0 && h > 0) { X.fillStyle = c; X.fillRect(x, y, w, h); } };
function TX(s, x, y, f, c, a = 'left') { X.font = f; X.fillStyle = c; X.textAlign = a; X.textBaseline = 'alphabetic'; const available = a === 'center' ? Math.min(x, 1920 - x) * 2 - 32 : a === 'right' ? x - 72 : 1824 - x; X.fillText(s, x, y, Math.max(40, available)); }
function A(a, fn) { if (a <= .003) return; X.save(); X.globalAlpha *= Math.min(1, a); fn(); X.restore(); }
function IN(t0, fn, d = .7, dy = 20) { const p = P(t0, d); if (p <= 0) return; X.save(); X.globalAlpha *= p; X.translate(0, (1 - p) * dy); fn(); X.restore(); }
function POP(t0, x, y, w, h, fn, d = .5) { const p = P(t0, d); if (p <= 0) return; X.save(); X.globalAlpha *= Math.min(1, p * 1.5); X.translate(x + w / 2, y + h / 2); X.scale(.86 + .14 * p, .86 + .14 * p); X.translate(-x - w / 2, -y - h / 2); fn(); X.restore(); }
function RICH(s, x, y, f, base, align = 'left') {
  const ACC = { b: K.blue, r: K.red, y: K.yelD, p: K.purple, t: K.teal };
  const parts = []; const re = /\{(\w):([^}]*)\}/g; let last = 0, m;
  while ((m = re.exec(s))) { if (m.index > last) parts.push([s.slice(last, m.index), null]); parts.push([m[2], m[1]]); last = re.lastIndex; }
  if (last < s.length) parts.push([s.slice(last), null]);
  X.font = f; const w = parts.reduce((a, [t]) => a + X.measureText(t).width, 0); let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  X.textAlign = 'left'; X.textBaseline = 'alphabetic';
  X.save(); const limit = align === 'center' ? Math.min(x, 1920 - x) * 2 - 32 : align === 'right' ? x - 72 : 1824 - x; if (w > limit) { X.translate(cx, 0); X.scale(limit / w, 1); cx = 0; }
  for (const [t, k] of parts) { X.fillStyle = k ? ACC[k] : base; X.fillText(t, cx, y); cx += X.measureText(t).width; } X.restore();
}
const PAT = {};
function hatch(col, bg) { const k = col + bg; if (PAT[k]) return PAT[k]; const g = 14, c = document.createElement('canvas'); c.width = c.height = g; const q = c.getContext('2d');
  q.fillStyle = bg; q.fillRect(0, 0, g, g); q.strokeStyle = col; q.lineWidth = 4; q.beginPath(); for (let o = -g; o <= g * 2; o += g) { q.moveTo(o, g); q.lineTo(o + g, 0); } q.stroke(); return (PAT[k] = X.createPattern(c, 'repeat')); }
const HR = (x, y, w, h, col = K.lg, bg = K.paper2) => { if (w > 0 && h > 0) { X.fillStyle = hatch(col, bg); X.fillRect(x, y, w, h); } };
const box = (x, y, w, h, lw = 4, col = K.ink) => { X.strokeStyle = col; X.lineWidth = lw; X.strokeRect(x, y, w, h); };
function line(x1, y1, x2, y2, col = K.ink, lw = 3, dash) { X.strokeStyle = col; X.lineWidth = lw; X.setLineDash(dash || []); X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke(); X.setLineDash([]); }
function poly(pts, col = K.ink, lw = 4) { X.strokeStyle = col; X.lineWidth = lw; X.lineJoin = 'miter'; X.beginPath(); pts.forEach(([x, y], i) => (i ? X.lineTo(x, y) : X.moveTo(x, y))); X.stroke(); }
function arrow(x1, y1, x2, y2, col = K.ink, lw = 6) { const a = Math.atan2(y2 - y1, x2 - x1), hl = lw * 3.4, hw = lw * 2.2; if (Math.hypot(x2 - x1, y2 - y1) < hl) return;
  line(x1, y1, x2 - Math.cos(a) * hl * .9, y2 - Math.sin(a) * hl * .9, col, lw);
  X.fillStyle = col; X.beginPath(); X.moveTo(x2, y2); X.lineTo(x2 - Math.cos(a) * hl + Math.sin(a) * hw, y2 - Math.sin(a) * hl - Math.cos(a) * hw); X.lineTo(x2 - Math.cos(a) * hl - Math.sin(a) * hw, y2 - Math.sin(a) * hl + Math.cos(a) * hw); X.fill(); }
function cell(x, y, w, h, col, label, size = 30, tc = '#fff', fam = HN) { R(x, y, w, h, col); if (label != null) TX(label, x + w / 2, y + h / 2 + size * .36, font(700, size, fam), tc, 'center'); }
function span(x1, x2, y, col = K.ink, lw = 4) { line(x1, y, x2, y, col, lw); line(x1, y - 10, x1, y + 10, col, lw); line(x2, y - 10, x2, y + 10, col, lw); }
function frame(tag, col, head, src, t0 = .15) {
  TX('LLM 量化 · 以 Qwen3.8-27B 为例', 96, 76, font(700, 28), K.ink2);
  IN(t0, () => { X.font = font(700, 32); const w = X.measureText(tag).width + 36; R(96, 100, w, 50, col); TX(tag, 114, 136, font(700, 32), '#fff'); }, .5, 0);
  IN(t0 + .15, () => RICH(head, 96, 226, font(700, 60), K.ink));
  if (src) IN(t0 + .3, () => TX(src, 1824, 76, font(500, 26), K.gray, 'right'), .5, 0);
}

// ---------- 显存条 ----------
// checkpoint 体积（GiB）：BF16 官方、FP8 官方、NVFP4 为 NVIDIA 版、INT4 为 RedHatAI 版
const CK = { bf16: 51.75, fp8: 28.75, nvfp4: 20.42, int4: 18.12 }, CARD = 32;
// 外框是卡（32 GiB），蓝色是权重；装得下时余量画成黄色，装不下时超出部分画红色斜线。full 为 false 时不画余量（权重还在画出的过程中）
function cardbar(x, y, px, h, w, full = true) {
  const fit = w <= CARD;
  if (fit) { if (full) R(x + w * px, y, (CARD - w) * px, h, K.yel); } else HR(x + CARD * px, y, (w - CARD) * px, h, K.red, K.paper2);
  R(x, y, Math.min(w, CARD) * px - (fit && full ? 4 : 0), h, K.blue);
  box(x - 3, y - 3, CARD * px + 6, h + 6, 6);
}
function barLabels(x, y, px, h, w, fs, wl, rl) {
  const fit = w <= CARD, ty = y + h / 2 + fs * .36;
  TX(wl, x + fs * .5, ty, font(700, fs), '#fff');
  if (!rl) return;
  const rw = Math.abs(CARD - w) * px; X.font = font(700, fs); const tw = X.measureText(rl).width, inside = tw + fs < rw;
  const lx = x + (inside ? Math.min(w, CARD) * px + fs * .5 : Math.max(w, CARD) * px + 20);
  if (!fit && inside) R(lx - fs * .3, ty - fs, tw + fs * .6, fs * 1.4, K.paper);
  TX(rl, lx, ty, font(700, fs), fit ? K.ink : K.red);
}

// ---------- 定位：这些数是从模型的哪里取出来的 ----------
// 64 层 → 其中一层里的几个权重矩阵 → 其中一个矩阵。t0 起依次展开；block 为 -1 时不强调具体哪个矩阵。结构按官方 config：64 层，MLP 是 gate / up / down 三个矩阵。
const BLK = ['attention', 'gate_proj', 'up_proj', 'down_proj'];
function locator(t0, layer, layerLabel, block, matLabel) {
  const sx = 200, sy = 372, sw = 220, ly = sy + (63 - layer) * 4, bx = (i) => 580 + i * 155, mx = 1320, my = 392;
  const fan = (t, pts) => A(P(t, .5), () => { X.fillStyle = K.paper2; X.beginPath(); pts.forEach(([x, y], i) => (i ? X.lineTo(x, y) : X.moveTo(x, y))); X.fill(); });
  IN(t0, () => { TX('Qwen3.8-27B：64 层', sx, sy - 18, font(700, 28), K.ink); for (let i = 0; i < 64; i++) R(sx, sy + i * 4, sw, 3, 63 - i === layer && T > t0 + .9 ? K.purple : K.blue); }, .6, 0);
  IN(t0 + .9, () => TX(layerLabel, sx - 14, Math.min(Math.max(ly + 11, sy + 20), sy + 256), font(700, 26), K.purple, 'right'), .4, 0);
  fan(t0 + 1.1, [[sx + sw, ly], [560, 420], [560, 600], [sx + sw, ly + 3]]);
  IN(t0 + 1.3, () => { R(560, 420, 640, 180, K.paper2); TX('这一层里的权重矩阵', 580, 408, font(700, 26), K.ink); span(bx(1), bx(3) + 135, 458, K.gray, 3); TX('MLP', bx(2) + 67, 448, font(700, 22, HN), K.gray, 'center');
    BLK.forEach((n, i) => { const on = i === block && T > t0 + 2.3; cell(bx(i), 478, 135, 90, on ? K.purple : K.blue, n, 22); }); }, .6, 0);
  const b0 = block < 0 ? 1200 : bx(block) + 135; fan(t0 + 2.5, [[b0, block < 0 ? 420 : 478], [mx, my], [mx, my + 220], [b0, block < 0 ? 600 : 568]]);
  IN(t0 + 2.7, () => { let q = 11; for (let r = 0; r < 11; r++) for (let c = 0; c < 23; c++) { q = (q * 16807) % 2147483647; A(.25 + .75 * (q % 1000) / 1000, () => R(mx + c * 20, my + r * 20, 18, 18, block < 0 ? K.blue : K.purple)); }
    TX(matLabel, mx, my + 262, font(700, 28), K.ink); }, .6, 0);
}

// ---------- 1 封面 → 模型是一堆数 ----------
// 封面是一张大图（左半 16 bit、右半 4 bit）；图放大淡出后是一片数（权重），其中一个数 0.37 展开成 16 个 bit，再算出总体积，显存条冲出显卡外框。
const CV = 3.6, MORPH = 1.1, HOT = 2 * 13 + 6;
const NUMS = (() => { let q = 7; const r = () => (q = (q * 16807) % 2147483647) / 2147483647; return Array.from({ length: 65 }, (_, i) => (i === HOT ? '0.37' : ((r() + r() + r() - 1.5) * 1.1).toFixed(2).replace('-', '−').replace(/^0\.37$/, '0.73'))); })();
function sA() {
  const m = S(CV, MORPH), t = CV + MORPH, u = t + 4.2, dim = S(u + 1.6, .8);   // u：定位动画结束、那片数出现的时刻
  // 封面：左边标题与两把尺子，右边一张大图，分界线从右扫到中间，左半 16 bit、右半 4 bit。转场时图放大淡出，露出下面的一片数
  const wipe = (t0, fn) => { X.save(); X.beginPath(); X.rect(0, 0, 96 + 800 * clamp((T - t0) / 1.0), 1080); X.clip(); fn(); X.restore(); };
  A(1 - clamp(m * 2.5), () => { TX('FP8 · INT4 · NVFP4', 96, 168, font(700, 64, HN), K.ink); TX('LLM 量化', 88, 390, font(700, 200), K.ink);
    IN(.5, () => TX('一个数，到底要用几个 bit 来存', 96, 500, font(600, 54), K.ink2));
    IN(.9, () => RICH('{b:16 bit}　65,536 个刻度', 96, 668, font(700, 32), K.ink), .5, 0); wipe(1.0, () => { for (let q = 96; q < 876; q += 3) R(q, 686, 2, 70, K.ink); });
    IN(1.7, () => RICH('{b:4 bit}　16 个刻度', 96, 836, font(700, 32), K.ink), .5, 0); wipe(1.8, () => { for (let k = 0; k < 16; k++) R(96 + k * 52, 854, 8, 70, K.blue); }); });
  if (m < 1) { const k = 1 + .6 * m, w = 810 * k, h = 630 * k, x = 1419 - w / 2, y = 525 - h / 2, sp = mix(1, .5, S(.7, 1.7)), b4 = picOf('b4', () => PIC.map((v) => Math.round(v * 15) / 15));
    A(P(.2, .6) * (1 - clamp(m * 1.8)), () => { X.save(); X.imageSmoothingEnabled = true; X.drawImage(pic(0), x, y, w, h); X.imageSmoothingEnabled = false; X.beginPath(); X.rect(x + w * sp, y, w * (1 - sp), h); X.clip(); X.drawImage(b4, x, y, w, h); X.restore();
      box(x, y, w, h, 5); R(x + w * sp - 3, y - 16, 6, h + 32, K.purple);
      IN(.4, () => TX('16 bit', x + 24, y + 52, font(700, 36, HN), K.ink), .5, 0); IN(2.4, () => TX('4 bit', x + w - 24, y + 52, font(700, 36, HN), K.ink, 'right'), .5, 0); }); }
  A(clamp(m * 2 - 1), () => frame('模型是什么', K.blue, '模型就是{b:一大堆数}：Qwen3.8-27B 有 278 亿个', '0.37 为示意', t));
  A(1 - S(u - .5, .5), () => locator(t + .1, 0, '第 0 层', 3, '比如这一个：8,913 万个数'));
  NUMS.forEach((n, i) => { const r = Math.floor(i / 13), c = i % 13, hot = i === HOT;
    IN(u + i * .012, () => A(hot ? 1 : 1 - .6 * dim, () => TX(n, 96 + c * 133, 334 + r * 62, font(hot && dim > 0 ? 700 : 600, 36, HN), hot && dim > 0 ? K.purple : K.gray)), .4, 0); });
  IN(u + 2.2, () => RICH('{p:0.37} 存成 16 个 bit', 96, 692, font(700, 36), K.ink), .5, 0);
  '0011111010111101'.split('').forEach((b, i) => POP(u + 2.4 + i * .05, 520 + i * 66, 648, 60, 60, () => cell(520 + i * 66, 648, 60, 60, K.blue, b, 30), .35));
  IN(u + 4.6, () => TX('278 亿 × 16 bit = 51.8 GiB', 96, 800, font(700, 44), K.ink));
  IN(u + 6.0, () => TX('RTX 5090 · 32 GiB', 96 + CARD * 28, 826, font(700, 28), K.ink, 'right'), .5, 0);
  A(P(u + 6.0, .5), () => cardbar(96, 842, 28, 84, CK.bf16 * S(u + 6.2, 1.4)));
  IN(u + 7.8, () => barLabels(96, 842, 28, 84, CK.bf16, 32, '权重 51.8 GiB', '装不下：超出 19.8 GiB'), .5, 0);
  IN(u + 9.2, () => RICH('每生成一个 token，这些数还要{b:全部读一遍}。每个数能不能少用几个 bit？', 96, 1010, font(700, 38), K.ink));
}

// ---------- 2 bit → 可选的值 → 最近的一档 ----------
// 16 个 bit 留下 4 个；4 个 bit 的 16 种组合各对应数轴上一个值（刻度下面直接写这个值）。
// 只跟一个数：0.37 垂直落到数轴上它自己的位置，放大它所在的那一格，量出到两边刻度的距离（0.12 与 0.13），滑到近的那个，上方对应的组合 0001 被圈出。
const S4 = .25, NX = (v) => 160 + (v + 2) * 426.67;
function sB() {
  frame('每个数少用几个 bit，会怎样', K.blue, '4 个 bit 只有 {b:16 种组合}，所以只有 16 个刻度', '示意数值');
  const ay = 520, keep = S(1.8, .8), HX = NX(.37), X0 = NX(.25), X1 = NX(.5), dot = (x, y, r, c) => { X.fillStyle = c; X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); };
  A(1 - P(3.0, .5), () => { '0011111010111101'.split('').forEach((b, i) => A(i < 4 ? 1 : 1 - keep, () => cell(96 + i * 50, 296, 44, 44, i < 4 ? K.purple : K.blue, b, 24)));
    IN(.8, () => TX(keep < .5 ? '原来：16 个 bit' : '只留 4 个 bit', 96 + (keep < .5 ? 16 : 4) * 50 + 20, 328, font(700, 30), K.ink), .4, 0); });
  R(120, ay - 2, 1680 * S(2.8, 1.0), 4, K.ink);
  for (let q = -8; q <= 7; q++) { const x = NX(q * S4), t0 = 3.3 + (q + 8) * .11, code = (q & 15).toString(2).padStart(4, '0');
    POP(t0, x - 44, 296, 88, 44, () => code.split('').forEach((b, j) => cell(x - 44 + j * 22, 296, 20, 44, b === '1' ? K.blue : K.lg, b, 20, b === '1' ? '#fff' : K.ink)), .35);
    POP(t0 + .15, x - 3, ay - 30, 6, 60, () => R(x - 3, ay - 30, 6, 60, K.blue), .35);
    IN(t0 + .15, () => TX((q * S4).toFixed(2).replace('-', '−'), x, ay + 66, font(600, 24, HN), K.ink2, 'center'), .4, 0); }
  IN(5.4, () => TX('每种组合是一个编号：编号 × scale = 它代表的值', 96, 392, font(700, 28), K.gray), .5, 0);
  IN(6.0, () => { span(NX(-1.75), NX(-1.5), ay - 62, K.ink, 4); TX('scale = 0.25（一格多大）', NX(-1.625), ay - 84, font(700, 28), K.ink, 'center'); }, .5, 0);
  // 一个权重：垂直落到数轴上自己的位置
  const dr = S(7.6, .6), sn = S(11.4, .7);
  IN(7.0, () => { dot(HX, 410, 16, K.purple); TX('一个权重：0.37', HX + 30, 421, font(700, 32), K.purple); }, .5, 0);
  if (dr > 0) line(HX, 428, HX, 428 + (ay - 428) * dr, K.purple, 3, [8, 6]);
  if (dr >= 1) dot(mix(HX, X0, sn), ay, 13, K.purple);
  // 放大 0.25 … 0.50 这一格
  const zo = S(8.6, .8), iy = 740, ix0 = 420, ix1 = 1500, ZX = (v) => ix0 + (v - .25) / .25 * (ix1 - ix0), zm = ZX(.37);
  A(zo, () => { X.fillStyle = K.paper2; X.beginPath(); X.moveTo(X0, 600); X.lineTo(X1, 600); X.lineTo(ix1, 646); X.lineTo(ix0, 646); X.fill(); R(ix0, 646, ix1 - ix0, 128, K.paper2);
    line(ix0, iy, ix1, iy, K.ink, 4); [[ix0, '0.25'], [ix1, '0.50']].forEach(([x, n]) => { R(x - 3, iy - 30, 6, 60, K.blue); TX(n, x, iy + 76, font(700, 30, HN), K.ink, 'center'); });
    TX('放大这一格', ix0 - 36, iy + 10, font(600, 26), K.gray, 'right'); dot(mix(zm, ix0, sn), iy, 15, K.purple); A(1 - sn, () => TX('0.37', zm, iy + 76, font(700, 30, HN), K.purple, 'center')); });
  IN(9.8, () => { span(ix0 + 6, zm - 6, iy - 50, sn > 0 ? K.red : K.purple, 4); TX(sn >= 1 ? '误差 0.12' : '离 0.25 差 0.12', (ix0 + zm) / 2, iy - 68, font(700, 28), sn > 0 ? K.red : K.purple, 'center'); }, .5, 0);
  IN(10.5, () => A(1 - .6 * sn, () => { span(zm + 6, ix1 - 6, iy - 50, K.gray, 4); TX('离 0.50 差 0.13', (zm + ix1) / 2, iy - 68, font(700, 28), K.gray, 'center'); }), .5, 0);
  IN(12.1, () => { box(X0 - 49, 291, 98, 54, 5, K.purple); line(X0, 348, X0, ay - 34, K.purple, 3); }, .4, 0);
  // 另外两个数照同样的规则走一遍
  [[-1.1, 14.8], [1.3, 15.4]].forEach(([w, t0]) => { const x0 = NX(w), x1 = NX(Math.round(w / S4) * S4), d = S(t0 + .3, .5), g = S(t0 + .9, .5);
    IN(t0, () => { dot(x0, 410, 12, K.gray); TX(w.toFixed(2).replace('-', '−'), x0 + 22, 420, font(700, 28, HN), K.gray); }, .4, 0);
    if (d > 0) line(x0, 424, x0, 424 + (ay - 424) * d, K.gray, 3, [8, 6]); if (d >= 1) dot(mix(x0, x1, g), ay, 11, K.gray); });
  IN(12.6, () => RICH('{p:0.37} 离 0.25 更近：显存里只存编号 {p:0001}，用的时候 {p:1 × 0.25 = 0.25}', 96, 886, font(700, 36), K.ink));
  IN(14.0, () => RICH('这就是量化：{b:从 16 个刻度里，挑最近的一个}', 96, 946, font(700, 38), K.ink));
  IN(16.4, () => TX('像一把只有 16 个刻度的尺子：量什么都只能读到最近的刻度', 96, 1004, font(600, 30), K.ink2));
}
