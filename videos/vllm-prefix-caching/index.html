<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Prefix Caching</title>
<style>html,body{margin:0;background:#f1ede4}canvas{display:block}</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
// ======================= palette & type =======================
const K = {
  paper: '#f1ede4', paper2: '#e6e0d3', ink: '#141414', ink2: '#3a3a3a', gray: '#8a8474',
  red: '#e5322d', blue: '#2350d8', yel: '#f4c21b', yelD: '#9a7500',
};
const CUBE = {
  blue: ['#5a7ff0', '#2350d8', '#1a3aa3'], yel: ['#f8d75a', '#f4c21b', '#c99a00'],
  gray: ['#d8d2c4', '#c3bcac', '#aaa392'], ink: ['#4a4a4a', '#2c2c2c', '#161616'], red: ['#f06a5f', '#e5322d', '#b3211c'],
};
const ACC = { b: K.blue, r: K.red, y: K.yelD, k: K.ink, g: K.gray };
const HN = '"Helvetica Neue", "PingFang SC", sans-serif';
const ZH = '"PingFang SC", "Helvetica Neue", sans-serif';
const font = (w, s, f = ZH) => `${w} ${s}px ${f}`;

// ======================= math =======================
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const L = (a, b, p) => a + (b - a) * p;
const EO = (x) => { x = cl(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };           // expo out
const EI = (x) => { x = cl(x); return x === 0 ? 0 : Math.pow(2, 10 * x - 10); };            // expo in
const EIO = (x) => { x = cl(x); return x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2; }; // quint in-out
const O = (t, a, d = .5) => EO((t - a) / d);
const IO = (t, a, d = .6) => EIO((t - a) / d);
function SP(t, a, k = 1) { const x = (t - a) * k; if (x <= 0) return 0; const z = .5, w = 16, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); }
const bez = (p, t) => { const u = 1 - t; return [0, 1].map((j) => u * u * u * p[0][j] + 3 * u * u * t * p[1][j] + 3 * u * t * t * p[2][j] + t * t * t * p[3][j]); };
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }
const fmt = (v, d = 0) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

// ======================= drawing primitives =======================
let X; // current ctx
function poly(pts, fill, stroke, lw = 1) {
  X.beginPath(); pts.forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y)); X.closePath();
  if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.stroke(); }
}
function rect(x, y, w, h, fill, stroke, lw = 1) {
  if (w <= 0 || h <= 0) return; X.beginPath(); X.rect(x, y, w, h);
  if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.stroke(); }
}
function line(pts, col, lw = 2, dash) {
  X.beginPath(); pts.forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y));
  X.strokeStyle = col; X.lineWidth = lw; X.lineCap = 'butt'; X.lineJoin = 'miter'; if (dash) X.setLineDash(dash); X.stroke(); X.setLineDash([]);
}
function txt(s, x, y, f, fill, align = 'left', base = 'alphabetic') { X.font = f; X.fillStyle = fill; X.textAlign = align; X.textBaseline = base; X.fillText(s, x, y); }
const tw = (s, f) => { X.font = f; return X.measureText(s).width; };
function head(x, y, ang, size, fill) { poly([[x, y], [x - size * Math.cos(ang - .42), y - size * Math.sin(ang - .42)], [x - size * Math.cos(ang + .42), y - size * Math.sin(ang + .42)]], fill); }
// partial polyline draw, returns end point
function polyPart(pts, p, col, lw = 2, arrow = true) {
  if (p <= 0) return;
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let rem = tot * cl(p); const out = [pts[0]];
  for (let i = 1; i < pts.length && rem > 0; i++) {
    const d = seg[i - 1], q = Math.min(1, rem / d);
    out.push([L(pts[i - 1][0], pts[i][0], q), L(pts[i - 1][1], pts[i][1], q)]); rem -= d;
  }
  const n = out.length, [ex, ey] = out[n - 1], [px, py] = out[n - 2] || out[0];
  const ang = Math.atan2(ey - py, ex - px);
  if (arrow && p >= .999) { line(out.slice(0, -1).concat([[ex - Math.cos(ang) * 8, ey - Math.sin(ang) * 8]]), col, lw); head(ex, ey, ang, 15, col); }
  else line(out, col, lw);
}
// hatch pattern cache
const PAT = {};
function hatchPat(col, bg, gap = 11, w = 3.2) {
  const key = col + bg + gap; if (PAT[key]) return PAT[key];
  const c = document.createElement('canvas'); c.width = c.height = gap; const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, gap, gap); }
  g.strokeStyle = col; g.lineWidth = w; g.beginPath();
  for (let o = -gap; o <= gap * 2; o += gap) { g.moveTo(o, gap); g.lineTo(o + gap, 0); }
  g.stroke(); PAT[key] = X.createPattern(c, 'repeat'); return PAT[key];
}
// rich text: "{r:红字}"
function runs(s) { const out = []; const re = /\{(\w):([^}]*)\}/g; let last = 0, m; while ((m = re.exec(s))) { if (m.index > last) out.push([s.slice(last, m.index), null]); out.push([m[2], m[1]]); last = re.lastIndex; } if (last < s.length) out.push([s.slice(last), null]); return out; }
function rich(s, x, y, f, base, align = 'left') {
  X.font = f; const r = runs(s); const w = r.reduce((a, [t]) => a + X.measureText(t).width, 0);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x; X.textAlign = 'left'; X.textBaseline = 'alphabetic';
  for (const [t, k] of r) { X.fillStyle = k ? ACC[k] : base; X.fillText(t, cx, y); cx += X.measureText(t).width; }
  return w;
}
// mask-reveal: draws fn inside a clip that rises from below
function rise(p, x, y, w, h, fn) {
  if (p <= 0) return; X.save(); X.beginPath(); X.rect(x, y, w, h); X.clip(); X.translate(0, (1 - p) * h); fn(); X.restore();
}
function wipe(p, x, y, w, h, fn) { if (p <= 0) return; X.save(); X.beginPath(); X.rect(x, y, w * p, h); X.clip(); fn(); X.restore(); }

const env = (t, a, b, d = .4) => O(t, a, d) * (1 - O(t, b, .3));
function box(x, y, w, h, fill, label, lc = '#fff', f = font(800, 26, HN), lw = 2) {
  rect(x, y, w, h, fill, K.ink, lw);
  if (label) txt(label, x + w / 2, y + h / 2 + 1, f, lc, 'center', 'middle');
}
function popAt(t, at, cx, cy, fn) { const s = SP(t, at, 1.1); if (s <= 0) return; X.save(); X.translate(cx, cy); X.scale(s, s); fn(); X.restore(); }
// 横向括号：dir=1 时竖边朝下（括号在物体上方）
function brace(x1, x2, y, p = 1, col = K.ink, lw = 3, dir = 1) {
  if (p <= 0) return; const xe = L(x1, x2, p);
  line([[x1, y + 12 * dir], [x1, y], [xe, y]].concat(p >= 1 ? [[x2, y + 12 * dir]] : []), col, lw);
}
function fade(a, fn) { if (a <= 0) return; X.save(); X.globalAlpha *= cl(a); fn(); X.restore(); }

// ======================= generated assets =======================
const RIBBON = new Image();
const RIB = { x: 880, y: 150, s: 0.95, w: 1086, h: 936 };
window.ASSETS = new Promise((res) => { RIBBON.onload = res; RIBBON.onerror = res; RIBBON.src = 'assets/ribbon.png'; });

// ======================= prefix caching =======================
// 语义色（与正文图一致）：蓝 = 命中 / 复用，黄 = 需要计算，红 = 未命中 / 淘汰，黑 = 运行中，蓝斜线 = 空闲但仍可命中。
// 字号下限：正文标签 32px，关键数字 ≥ 96px；只有出处用 26px 灰字。
const HIT = K.blue, CMP = K.yel, MISS = K.red, RUN = K.ink;
const CACHED = () => hatchPat(K.blue, K.paper, 12, 3.4);
const LBL = 32;
const lcOf = (fill) => (fill === RUN || fill === HIT || fill === MISS ? '#fff' : K.ink);
function cellBox(x, y, w, h, fill, label, fs = 40, lw = 2) { box(x, y, w, h, fill, label, lcOf(fill), font(900, fs, HN), lw); }
const SC = [];
const EV = [];

// ---------- 00 hook ----------
SC.push({
  id: 'hook', dur: 9.5,
  cam: [[0, 960, 540, 1], [9.5, 960, 540, 1.02]],
  beats: [],
  ev: [[0.3, 'tick'], [0.5, 'tick'], [0.7, 'tick'], [0.9, 'tick'], [1.2, 'whoosh'], [2.6, 'pop'], [3.0, 'thud'], [3.4, 'pop'], [4.6, 'whoosh'], [5.5, 'whoosh'], [5.05, 'thud'], [5.3, 'tick'], [5.5, 'tick'], [6.4, 'pop']],
  draw(t) {
    const out = EI((t - 4.6) / .5);
    X.save(); X.translate(-2100 * out, 0);
    // 五个请求的 prompt：开头相同的部分（蓝）连成一整块，其余（黄）是各自要算的部分
    const NC = 20, CW = 82, PITCH = 86, RH = 84, RP = 102, gx = 96, gy = 150, pre = [15, 15, 14, 16, 15];
    for (let r = 0; r < pre.length; r++) {
      const y = gy + r * RP;
      for (let c = 0; c < NC; c++) {
        const x = gx + c * PITCH, a0 = .15 + r * .12 + c * .01;
        const hit = c < pre[r], on = hit ? t > 1.2 + c * .06 : t > 2.6 + (c - pre[r]) * .04;
        fade(O(t, a0, .25), () => rect(x, y, CW, RH, on ? (hit ? HIT : CMP) : K.paper2, K.ink, 1.5));
      }
      fade(O(t, 3.0 + r * .06, .3), () => rect(gx, y, pre[r] * PITCH - (PITCH - CW), RH, HIT, K.ink, 1.5));
    }
    const ly = gy + 5 * RP + 30;
    rise(O(t, 3.2, .5), 96, ly, 1700, 120, () => rich('开头相同的部分，{b:只算一次}', 96, ly + 84, font(800, 76), K.ink));
    X.restore();
    if (t > 4.8) {
      // 生成素材：一条蓝紫色半透明丝带分叉成四股，象征“共享前缀之后各自分开”；铺在标题下方
      const rp = IO(t, 5.4, 1.1);
      if (rp > 0) {
        const w = RIB.w * RIB.s, h = RIB.h * RIB.s, x = RIB.x - 360 * (1 - rp);
        X.save(); X.globalAlpha = cl(rp * 1.6); X.drawImage(RIBBON, x, RIB.y, w, h);
        X.restore();
      }
      const s = SP(t, 5.0, 1);
      X.save(); X.translate(96 + 90, 250 + 90); X.scale(s, s); rect(-90, -90, 180, 180, K.red); X.restore();
      rise(O(t, 5.25, .45), 320, 150, 1500, 230, () => txt('Prefix', 316, 350, font(900, 200, HN), K.ink));
      rise(O(t, 5.45, .45), 90, 380, 1800, 230, () => txt('Caching', 86, 580, font(900, 200, HN), K.ink));
      rect(96, 640, 1728 * EIO((t - 5.9) / .7), 4, K.ink);
      rise(O(t, 6.4, .5), 96, 670, 1728, 90, () => rich('vLLM：跨请求复用 KV cache，只算{r:不一样的部分}', 96, 735, font(800, 52), K.ink));
    }
  },
});

// ---------- 01 复用的是什么 ----------
const SHARED = ['你是', '一个', '有用', '的', '助手', '。'], QA = ['今天', '天气', '怎么', '样'], QB = ['写', '一首', '短', '诗'];
SC.push({
  id: 'what', dur: 20, num: '01', title: '复用的是什么', card: K.blue,
  cam: [[0, 960, 540, 1], [20, 960, 540, 1.02]],
  beats: [[1.4, '第 i 个 token 的 KV，只取决于{b:它和它之前的 token}'], [6.0, 'B 与 A 的前 6 个 token 相同 → 这 6 个位置的 KV {b:逐位相同}'], [10.6, 'B 直接引用这部分 KV，只 {y:prefill} 后 4 个'], [15.0, '命中越长，TTFT 越短；{r:decode 不受益}']],
  ev: (() => { const e = []; for (let i = 0; i < 10; i += 2) e.push([1.4 + i * .05, 'tick']); e.push([2.4, 'whoosh'], [3.2, 'click'], [6.0, 'pop'], [6.6, 'thud']); for (let i = 0; i < 6; i += 2) e.push([10.8 + i * .06, 'land']); e.push([11.8, 'pop'], [15.0, 'whoosh'], [15.6, 'thud']); return e; })(),
  draw(t) {
    const cw = 140, ch = 92, pitch = 156, x0 = 188, yA = 230, yB = 480;
    const tx = (i) => x0 + i * pitch;
    const row = (y, words, at, name) => {
      rise(O(t, at, .4), 60, y, 120, ch, () => txt(name, x0 - 30, y + ch / 2 + 2, font(900, 48, HN), K.ink, 'right', 'middle'));
      words.forEach((w, i) => rise(O(t, at + i * .05, .35), tx(i), y, cw, ch, () => box(tx(i), y, cw, ch, K.paper, w, K.ink, font(800, 38), 2)));
    };
    // KV：每个 token 下面两条（K、V）
    const kv = (y, i, p, col) => { if (p <= 0) return; rect(tx(i), y + ch + 12, cw * p, 14, col, K.ink, 1.5); rect(tx(i), y + ch + 32, cw * p, 14, col, K.ink, 1.5); };
    row(yA, [...SHARED, ...QA], 1.4, 'A');
    for (let i = 0; i < 10; i++) kv(yA, i, IO(t, 2.4 + i * .05, .4), K.ink2);
    // 因果：第 6 个 token 只看它左边
    fade(env(t, 3.2, 6.0), () => {
      const ax = tx(5) + cw / 2;
      for (let j = 0; j < 5; j++) {
        const bx = tx(j) + cw / 2, hh = 36 + (5 - j) * 16, pts = [];
        for (let s = 0; s <= 30; s++) pts.push(bez([[ax, yA - 8], [ax, yA - 8 - hh], [bx, yA - 8 - hh], [bx, yA - 8]], s / 30));
        polyPart(pts, IO(t, 3.2 + j * .06, .45), K.red, 3, true);
      }
      rise(O(t, 3.6, .4), tx(6), yA - 110, 700, 60, () => txt('“。”的 K、V 只看它左边', tx(6), yA - 66, font(800, LBL), K.red));
    });
    row(yB, [...SHARED, ...QB], 6.0, 'B');
    // 相同前缀：两行前 6 列
    fade(O(t, 6.6, .4), () => {
      X.save(); X.globalAlpha *= .12; rect(tx(0) - 12, yA - 12, tx(5) + cw - tx(0) + 24, yB + ch + 60 - yA + 24, K.blue); X.restore();
      brace(tx(0) - 12, tx(5) + cw + 12, yA - 30, IO(t, 6.6, .5), K.blue, 4, 1);
      rise(O(t, 6.8, .4), tx(0), yA - 90, 900, 60, () => txt('相同前缀：6 个 token', tx(0), yA - 46, font(900, 36), K.blue));
    });
    for (let i = 0; i < 6; i++) kv(yB, i, IO(t, 10.8 + i * .06, .35), HIT);
    for (let i = 6; i < 10; i++) kv(yB, i, IO(t, 11.8 + (i - 6) * .12, .45), CMP);
    rise(O(t, 11.0, .4), tx(0), yB + ch + 60, 800, 60, () => txt('直接引用 A 的 KV', tx(0), yB + ch + 100, font(800, LBL), K.blue));
    rise(O(t, 12.2, .4), tx(6), yB + ch + 60, 800, 60, () => txt('prefill 4 个 token', tx(6), yB + ch + 100, font(800, LBL), K.yelD));
    // 15s：对比 prefill 工作量
    fade(O(t, 15.0, .4), () => {
      X.save(); X.translate(0, 40 * (1 - O(t, 15.0, .5)));
      const bx = 420, u = 110, by = 760;
      txt('不复用', bx - 24, by + 30, font(900, 36), K.ink, 'right', 'middle');
      rect(bx, by, 10 * u * IO(t, 15.1, .6), 60, CMP, K.ink, 2);
      txt('复用', bx - 24, by + 110, font(900, 36), K.ink, 'right', 'middle');
      rect(bx, by + 80, 4 * u * IO(t, 15.4, .5), 60, CMP, K.ink, 2);
      fade(O(t, 15.6, .4), () => { txt('prefill 10 个', bx + 10 * u + 24, by + 30, font(800, LBL), K.ink, 'left', 'middle'); txt('prefill 4 个 → TTFT 更短', bx + 4 * u + 24, by + 110, font(800, LBL), K.blue, 'left', 'middle'); });
      X.restore();
    });
  },
});

// ---------- 02 hash 链 ----------
const TA = 'abcdefghijklmn'.split(''), TB = 'abcdefghijxyz'.split('');
SC.push({
  id: 'hash', dur: 26, num: '02', title: '用 hash 链找缓存', card: K.red,
  cam: [[0, 960, 540, 1], [26, 960, 540, 1.02]],
  beats: [[1.4, '每个{r:写满}的 block 算一个 hash，输入里带着{b:前一块的 hash}'], [6.4, '所以 hash 相同 = {b:整个前缀}相同；已缓存的 block 登记在 hash 表里'], [11.0, '新请求 B：逐块算 hash、逐块查表'], [13.0, '前两块命中：直接引用物理 block {b:#3、#7}'], [16.6, '第三块只差两个 token，hash 就不同：{r:查找停在这里}'], [20.4, 'i、j 虽然相同，也要重算：B 命中 {b:8} / 13 个 token']],
  ev: (() => { const e = []; for (let i = 0; i < 14; i += 2) e.push([1.4 + i * .04, 'tick']); e.push([2.4, 'click'], [3.0, 'click'], [3.6, 'click'], [4.2, 'pop'], [6.8, 'land'], [7.0, 'land'], [7.2, 'land']); for (let i = 0; i < 13; i += 2) e.push([11.0 + i * .04, 'tick']); e.push([13.2, 'whoosh'], [13.6, 'hit'], [14.2, 'whoosh'], [14.6, 'hit'], [16.8, 'err'], [20.4, 'pop'], [21.0, 'thud']); return e; })(),
  draw(t) {
    const tc = 72, tg = 8, BW = 4 * tc + 3 * tg, BG = 44, x0 = 300, yA = 300, yT = 470, yB = 680;
    const bx = (b) => x0 + b * (BW + BG), tx = (i) => bx(Math.floor(i / 4)) + (i % 4) * (tc + tg), bm = (b) => bx(b) + BW / 2;
    const tok = (i, y, fill, ch, at) => rise(O(t, at, .35), tx(i), y, tc, tc, () => { if (fill === 'empty') { rect(tx(i), y, tc, tc, K.paper, CUBE.gray[2], 2); X.setLineDash([]); txt(ch, tx(i) + tc / 2, y + tc / 2 + 2, font(900, 38, HN), K.gray, 'center', 'middle'); } else cellBox(tx(i), y, tc, tc, fill, ch, 38); });
    // A 行
    rise(O(t, 1.4, .4), 100, yA, 180, tc, () => txt('A', x0 - 40, yA + tc / 2 + 2, font(900, 48, HN), K.ink, 'right', 'middle'));
    TA.forEach((ch, i) => tok(i, yA, i < 12 ? RUN : 'empty', ch, 1.4 + i * .04));
    fade(O(t, 2.0, .4), () => txt('未写满，不缓存', bx(3), yA + tc + 44, font(700, 28), K.gray));
    // hash 链
    ['h₀', 'h₁', 'h₂'].forEach((h, b) => rise(O(t, 2.4 + b * .6, .4), bm(b) - 80, yA - 80, 160, 70, () => txt(h, bm(b), yA - 26, font(900, 48, HN), K.red, 'center')));
    [0, 1].forEach((b) => polyPart([[bm(b) + 48, yA - 40], [bm(b + 1) - 48, yA - 40]], IO(t, 2.7 + b * .6, .4), K.red, 4, true));
    fade(env(t, 4.2, 6.2), () => rise(O(t, 4.2, .45), 96, 130, 1728, 70, () => rich('h{r:ᵢ} = hash( {r:hᵢ₋₁} , 本块 token , LoRA / 图片 / salt )', 96, 186, font(900, 44, HN), K.ink)));
    // hash 表
    const PHYS = [3, 7, 1];
    fade(O(t, 6.4, .4), () => txt('hash 表', x0 - 40, yT + 36, font(900, 36), K.ink, 'right', 'middle'));
    PHYS.forEach((id, b) => {
      polyPart([[bm(b), yA + tc + 10], [bm(b), yT - 8]], IO(t, 6.6 + b * .2, .35), K.ink, 3, true);
      popAt(t, 6.8 + b * .2, bm(b), yT + 36, () => box(-120, -36, 240, 72, K.paper, `h${['₀', '₁', '₂'][b]} → #${id}`, K.ink, font(900, 38, HN), 2));
    });
    // B 行
    rise(O(t, 11.0, .4), 100, yB, 180, tc, () => txt('B', x0 - 40, yB + tc / 2 + 2, font(900, 48, HN), K.ink, 'right', 'middle'));
    TB.forEach((ch, i) => {
      const hit = i < 8, at = hit ? 13.6 + Math.floor(i / 4) * 1.0 : 17.0;
      const fill = t >= at ? (hit ? HIT : CMP) : K.paper;
      tok(i, yB, fill, ch, 11.0 + i * .04);
    });
    // 查找：B → 表
    [0, 1].forEach((b) => {
      const at = 13.2 + b * 1.0;

  if (s.num) EV.push([s.start - .45, 'whoosh'], [s.start + .05, 'thud'], [s.start + 1.05, 'whoosh']);
}
EV.sort((a, b) => a[0] - b[0]);

function camAt(s, lt) {
  const k = s.cam; if (lt <= k[0][0]) return k[0];
  for (let i = 0; i < k.length - 1; i++) if (lt < k[i + 1][0]) { const p = EIO((lt - k[i][0]) / (k[i + 1][0] - k[i][0])); return [0, L(k[i][1], k[i + 1][1], p), L(k[i][2], k[i + 1][2], p), L(k[i][3], k[i + 1][3], p)]; }
  return k[k.length - 1];
}
function chapterCard(s, lc) {
  if (!s.num || lc < -.45 || lc > 1.55) return;
  const x = lc < 0 ? 1920 * (1 - EO((lc + .45) / .45)) : -1920 * EI((lc - 1.05) / .45);
  const onYel = s.card === K.yel, fg = onYel ? K.ink : '#fff';
  X.setTransform(1, 0, 0, 1, 0, 0);
  rect(x, 0, 1920, 1080, s.card);
  X.save(); X.beginPath(); X.rect(x, 0, 1920, 1080); X.clip();
  X.globalAlpha = .95; txt(s.num, x * 1.25 + 70, 1010, font(900, 620, HN), fg); X.globalAlpha = 1;
  X.globalAlpha = .7; txt('Prefix Caching · ' + s.num + ' / 0' + NCH, x + 1824, 120, font(800, 28, HN), fg, 'right'); X.globalAlpha = 1;
  rise(O(lc, .05, .45), x + 90, 150, 1740, 150, () => txt(s.title, x + 96, 270, font(900, 100), fg));
  X.restore();
}
// 顶栏只留章节号与标题，底线表示本章进度
function chrome(s, lt) {
  if (!s.num) return;
  const a = O(lt, 1.3, .4) * (s.chromeUntil ? 1 - O(lt, s.chromeUntil, .2) : 1);
  if (a <= 0) return;
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = a;
  rect(0, 0, 1920, 110, K.paper);
  txt(s.num, 96, 80, font(900, 34, HN), K.red); txt(s.title, 160, 80, font(800, 32), K.ink);
  rect(96, 104, 1728, 2, CUBE.gray[0]); rect(96, 104, 1728 * cl(lt / s.dur), 2, K.ink);
  X.globalAlpha = 1;
}
function caption(s, lt) {
  const b = s.beats; if (!b.length) return;
  let i = -1; for (let j = 0; j < b.length; j++) if (lt >= b[j][0]) i = j;
  X.setTransform(1, 0, 0, 1, 0, 0);
  const endA = 1 - O(lt, s.dur - .5, .3);
  const draw = (str, p, out) => {
    if (!str) return; const f = font(800, 42);
    X.save(); X.globalAlpha = endA;
    X.beginPath(); X.rect(96, 930, 1760, 80); X.clip();
    const y = 978 + (1 - p) * 64 - out * 64;
    rect(96, y - 32, 22, 22, K.red);
    rich(str, 138, y - 6 + 10, f, K.ink);
    X.restore();
  };
  if (i >= 0) {
    const p = O(lt, b[i][0] + .14, .45);
    draw(b[i][1], p, 0);
    if (i > 0 && lt < b[i][0] + .2) draw(b[i - 1][1], 1, EI((lt - b[i][0]) / .18));
  }
}
function drawFrame(ctx, T) {
  X = ctx;
  let idx = 0; for (let i = 0; i < SC.length; i++) if (T >= SC[i].start) idx = i;
  const s = SC[idx], lt = T - s.start;
  const [, cx, cy, z] = camAt(s, lt);
  X.setTransform(1, 0, 0, 1, 0, 0); rect(0, 0, 1920, 1080, K.paper);
  X.setTransform(z, 0, 0, z, 960 - cx * z, 540 - cy * z);
  s.draw(lt);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1;
  chrome(s, lt);
  caption(s, lt);
  chapterCard(s, lt);
  const nx = SC[idx + 1]; if (nx) chapterCard(nx, T - nx.start);
  const fe = O(T, TOTAL - 1.0, .9); if (fe > 0) { X.globalAlpha = fe; rect(0, 0, 1920, 1080, '#000'); X.globalAlpha = 1; }
}

// ======================= runtime (motion blur) =======================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = 1920; off.height = 1080; const octx = off.getContext('2d');
window.DURATION = TOTAL;
window.EVENTS = EV;
window.SCENES = SC.map((s) => [s.id, s.start, s.dur]);
window.renderAt = (t, fps = 60, samples = 5, shutter = .5) => {
  for (let s = 0; s < samples; s++) {
    const ts = t - (shutter / fps) * (1 - s / (samples - 1));
    octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalAlpha = 1;
    drawFrame(octx, Math.max(0, ts));
    ctx.globalAlpha = 1 / (s + 1); ctx.drawImage(off, 0, 0);
  }
  ctx.globalAlpha = 1;
};
window.renderAt(3);
</script>
